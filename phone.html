<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Messages</title>

  <!-- Telegram Web App SDK (same as the other mini-games in this repo) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!--
    GENERIC PHONE / CHAT-THREAD UI  (reusable across games — config-driven, SERVER-AUTHORITATIVE, MODULAR)
    ---------------------------------------------------------------------------------------------------------
    A fake-messaging-app shell (status bar + header + screen router) with TWO interchangeable modes, chosen by
    which param is present. Neither mode ever receives or leaks the "correct" answer — only the player's pick
    or assembled text is reported; the engine (same path as an in-chat answer) decides the verdict.

      • THREADS mode — set `threads` (JSON array, url-encoded):
          [{ "id":"helpline", "name":"F.", "avatar":"📞", "preview":"...", "time":"08:14", "unread":true,
             "messages":[ { "from":"them"|"me", "text":"...", "time":"08:12" }, ... ] }, ...]
        Tapping a thread WITH `messages` opens a full chat transcript (read it, then tap SELECT). A thread
        WITHOUT `messages` selects immediately on tap (fast quick-pick list). Either way the app reports
        `{ choice: "<thread id>" }` — the engine validates it exactly like a choice-puzzle button tap.
        Optional per-thread `color` (CSS color) overrides the auto-generated avatar color.

      • REASSEMBLE mode — set `fragments` (JSON array of strings, url-encoded, PRE-SCRAMBLED by the author):
          ["fragment one","fragment two", ...]
        Tap fragments in the pool to append them to the assembled line (tap an assembled chip to undo it back
        to the pool); SEND reports `{ submission: "<assembled text, joined by ' '>" }` for the engine to check
        against the puzzle's answer (author writes the answer as the correctly-ordered, space-joined phrase —
        matching works case/space-insensitively, same as any text puzzle).

    Shared params (all optional): title (app name, default "Messages"), contact (subtitle under the app name,
      e.g. "Mia's Tablet"), tag (prompt line under the header, decodeURIComponent), lang "en"|"hr"
      sessionId / userId  passed straight back in the result payload
    Result (Telegram.WebApp.sendData):
      THREADS:      { sessionId, userId, gameId:'phone', choice, timestamp }
      REASSEMBLE:   { sessionId, userId, gameId:'phone', submission, timestamp }
      give up:      { sessionId, userId, gameId:'phone', success:false, outcome:'abandoned', timestamp }

    Forward-looking note: this shell's visual language (status bar, thread list, bubble transcript) is meant to
    double as the in-fiction "home" for the engine's live directMessaging/playerNotes features later — but this
    file is a static, self-contained mini-game; it does not talk to those systems.
  -->
  <style>
    :root {
      --bg: #0b0d12; --device: #14161c; --panel: #1a1d24; --ink: #e8e6df; --muted: #8b90a0;
      --brass: #c9a24b; --brass-dark: #8a6d2c; --sent: #1f6f5c; --sent-ink: #d8f5ec;
      --recv: #262a33; --danger: #d9534f; --success: #4caf7d; --shadow: rgba(0,0,0,.5);
      --unread: #ff6b5e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 90% at 50% 0%, #191d26 0%, var(--bg) 65%);
      color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; min-height: 100%;
      padding: 18px 14px 24px; user-select: none;
    }

    /* Device shell */
    .device {
      width: 360px; max-width: 94vw; height: 78vh; max-height: 640px; margin: 0 auto;
      background: var(--device); border-radius: 26px; border: 1px solid #262a33;
      box-shadow: 0 18px 40px var(--shadow), inset 0 1px 0 rgba(255,255,255,.04);
      display: flex; flex-direction: column; overflow: hidden; position: relative;
    }
    .statusbar { display: flex; justify-content: space-between; align-items: center;
      padding: 9px 16px 4px; font-size: 12px; font-weight: 600; color: var(--ink); flex: 0 0 auto; }
    .statusbar .icons { display: flex; align-items: center; gap: 4px; opacity: .85; }
    .statusbar svg { display: block; }

    .apphead { flex: 0 0 auto; padding: 6px 14px 12px; text-align: center; position: relative;
      border-bottom: 1px solid #22262f; }
    .apphead .back {
      position: absolute; left: 8px; top: 4px; width: 34px; height: 34px; border: none; background: none;
      color: var(--brass); font-size: 20px; cursor: pointer; display: none; align-items: center; justify-content: center;
    }
    .apphead .back.show { display: flex; }
    .apphead h1 { font-size: 15px; font-weight: 700; }
    .apphead .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .tag { text-align: center; font-size: 12px; color: var(--muted); font-style: italic; padding: 8px 16px 0; line-height: 1.4; }

    .screen { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .screen::-webkit-scrollbar { width: 0; }

    /* Thread list */
    .row {
      display: flex; align-items: center; gap: 11px; padding: 11px 14px; cursor: pointer;
      border-bottom: 1px solid #1f232b; transition: background .1s;
    }
    .row:active { background: #1e222b; }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center;
      justify-content: center; font-size: 18px; color: #fff; font-weight: 700; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .rowbody { flex: 1 1 auto; min-width: 0; }
    .rowtop { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .rowname { font-size: 14.5px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rowtime { font-size: 11px; color: var(--muted); flex: 0 0 auto; }
    .rowpreview { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--unread); flex: 0 0 auto; box-shadow: 0 0 6px var(--unread); }

    /* Transcript */
    .transcript { padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
    .bubblerow { display: flex; }
    .bubblerow.me { justify-content: flex-end; }
    .bubble { max-width: 78%; padding: 9px 12px; border-radius: 16px; font-size: 13.5px; line-height: 1.4; }
    .bubblerow.them .bubble { background: var(--recv); color: var(--ink); border-bottom-left-radius: 4px; }
    .bubblerow.me .bubble { background: var(--sent); color: var(--sent-ink); border-bottom-right-radius: 4px; }
    .btime { font-size: 10px; color: var(--muted); margin-top: 3px; padding: 0 4px; }
    .bubblerow.me + .btime, .bubblerow.me ~ .btime { text-align: right; }

    .selectbar { flex: 0 0 auto; padding: 10px 14px 14px; border-top: 1px solid #22262f; }
    .selectbtn {
      width: 100%; padding: 13px; border: none; border-radius: 12px; cursor: pointer;
      background: linear-gradient(180deg, var(--brass) 0%, var(--brass-dark) 100%);
      color: #1a1406; font-size: 14.5px; font-weight: 800; letter-spacing: .3px;
      box-shadow: 0 3px 0 #5c4a1f; transition: transform .07s, box-shadow .07s;
    }
    .selectbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #5c4a1f; }

    /* Reassemble */
    .reassemble { padding: 14px; display: flex; flex-direction: column; gap: 16px; }
    .assembled {
      min-height: 54px; border-radius: 12px; background: var(--panel); border: 1px dashed #333a46;
      padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start;
    }
    .assembled.empty::before { content: attr(data-hint); color: var(--muted); font-size: 12.5px; font-style: italic; padding: 4px; }
    .pool { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      padding: 8px 12px; border-radius: 10px; background: var(--recv); color: var(--ink);
      font-size: 13px; cursor: pointer; border: 1px solid #2c313c; transition: opacity .12s, transform .07s;
    }
    .chip:active { transform: scale(.96); }
    .chip.used { opacity: .3; pointer-events: none; }
    .assembled .chip { background: var(--sent); color: var(--sent-ink); border-color: transparent; }

    .bottombar { flex: 0 0 auto; padding: 10px 14px 14px; border-top: 1px solid #22262f; display: flex; flex-direction: column; gap: 8px; }

    .giveup { margin-top: 16px; background: none; border: none; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }

    .overlay { position: fixed; inset: 0; background: rgba(6,7,10,.88); backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center; z-index: 20; padding: 24px; }
    .overlay.show { display: flex; }
    .card { background: var(--panel); border: 1px solid #333a46; border-radius: 18px; padding: 28px 24px;
      text-align: center; max-width: 320px; width: 100%; box-shadow: 0 20px 50px var(--shadow); }
    .card .emoji { font-size: 42px; } .card h2 { margin: 12px 0 6px; font-size: 20px; } .card p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="device">
    <div class="statusbar">
      <span>9:41</span>
      <span class="icons">
        <svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="6" width="2.5" height="4" fill="currentColor"/><rect x="4.5" y="4" width="2.5" height="6" fill="currentColor"/><rect x="9" y="2" width="2.5" height="8" fill="currentColor"/><rect x="13.5" y="0" width="2.5" height="10" fill="currentColor"/></svg>
        <svg width="20" height="11" viewBox="0 0 20 11"><rect x="0.5" y="0.5" width="17" height="10" rx="2.5" stroke="currentColor" fill="none"/><rect x="2" y="2" width="13" height="7" rx="1" fill="currentColor"/><rect x="18" y="3.5" width="1.5" height="4" rx="0.5" fill="currentColor"/></svg>
      </span>
    </div>
    <div class="apphead">
      <button class="back" id="back" aria-label="back">‹</button>
      <h1 id="apptitle">Messages</h1>
      <div class="sub" id="appsub"></div>
    </div>
    <div class="tag" id="tag" style="display:none"></div>

    <div class="screen" id="screen"></div>

    <button class="giveup" id="giveup">Give up</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <div class="emoji" id="rEmoji">📲</div>
      <h2 id="rTitle">Sent</h2>
      <p id="rBody"></p>
    </div>
  </div>

  <script>
    // ------- Telegram bootstrap (mirrors padlock.html) -------
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }
    const haptic = (kind) => {
      try {
        if (!tg || !tg.HapticFeedback) return;
        if (kind === 'tick') tg.HapticFeedback.selectionChanged();
        else if (kind === 'ok') tg.HapticFeedback.notificationOccurred('success');
        else if (kind === 'err') tg.HapticFeedback.notificationOccurred('error');
      } catch (e) {}
    };

    // ------- Input params -------
    const q = new URLSearchParams(window.location.search);
    const sessionId = q.get('sessionId');
    const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : q.get('userId');
    let lang = (q.get('lang') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || 'en')
                 .split('-')[0].toLowerCase();

    const STR = {
      en: { app: 'Messages', select: 'THIS IS THE ONE', send: 'SEND', give: 'Give up',
            sent: 'Sent', sentBody: 'Check the chat for the verdict.',
            gaveTitle: 'Left unread', gaveBody: 'You lock the screen.', poolHint: 'Tap fragments below, in order.' },
      hr: { app: 'Poruke', select: 'OVO JE TAJ', send: 'POŠALJI', give: 'Odustani',
            sent: 'Poslano', sentBody: 'Provjeri chat za ishod.',
            gaveTitle: 'Ostalo nepročitano', gaveBody: 'Zaključaš ekran.', poolHint: 'Dodiruj dijelove ispod, redom.' },
    };
    const S = STR[lang] || STR.en;
    function loc(v) { if (v == null) return ''; if (typeof v === 'object') return v[lang] || v.en || Object.values(v)[0] || ''; return String(v); }
    function pjson(name) { try { const raw = q.get(name); return raw ? JSON.parse(decodeURIComponent(raw)) : null; } catch (e) { return null; } }

    document.documentElement.lang = lang;
    document.getElementById('apptitle').textContent = q.get('title') || S.app;
    const contactText = q.get('contact');
    if (contactText) document.getElementById('appsub').textContent = decodeURIComponent(contactText);
    const tagText = q.get('tag');
    if (tagText) { const t = document.getElementById('tag'); t.style.display = ''; t.textContent = decodeURIComponent(tagText); }
    document.getElementById('giveup').textContent = S.give;

    let solved = false;

    // ------- Result reporting (server-authoritative) -------
    // THREADS reports { choice }, REASSEMBLE reports { submission } — the engine validates either the same
    // way it validates an in-chat answer. We never send `success` and never receive the correct thread/text.
    function send(payload) {
      const result = { sessionId, userId, gameId: 'phone', timestamp: Date.now(), ...payload };
      console.log('📤 phone result', result);
      try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'MINIGAME_RESULT', payload: result }, '*'); } catch (e) {}
      try {
        if (tg && typeof tg.sendData === 'function') tg.sendData(JSON.stringify(result));
        else localStorage.setItem('phone_result_latest', JSON.stringify(result));
      } catch (e) { console.error('sendData failed', e); }
    }
    function showOverlay(gaveUp) {
      document.getElementById('rEmoji').textContent = gaveUp ? '🔒' : '📲';
      document.getElementById('rTitle').textContent = gaveUp ? S.gaveTitle : S.sent;
      document.getElementById('rBody').textContent = gaveUp ? S.gaveBody : S.sentBody;
      document.getElementById('overlay').classList.add('show');
    }
    document.getElementById('giveup').addEventListener('click', () => {
      if (solved) return;
      solved = true;
      send({ success: false, outcome: 'abandoned' });
      setTimeout(() => showOverlay(true), 200);
    });

    // ------- Avatar color (deterministic per id, unless a thread supplies its own `color`) -------
    const PALETTE = ['#c9744b', '#4b7ec9', '#4bab7a', '#a25bd1', '#c94b8e', '#b8964b', '#4bb0c9'];
    function colorFor(id) {
      let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
      return PALETTE[h % PALETTE.length];
    }

    // ------- Screen router: swaps #screen content between inbox / thread / reassemble -------
    const screenEl = document.getElementById('screen');
    const backBtn = document.getElementById('back');

    function showScreen(node, { showBack } = {}) {
      screenEl.replaceChildren(node);
      backBtn.classList.toggle('show', !!showBack);
    }

    // ------- THREADS mode -------
    const threads = pjson('threads');

    function renderInbox() {
      backBtn.onclick = null;
      const list = document.createElement('div');
      threads.forEach((th) => {
        const row = document.createElement('div'); row.className = 'row';
        const av = document.createElement('div'); av.className = 'avatar';
        av.style.background = th.color || colorFor(th.id);
        av.textContent = th.avatar || (loc(th.name)[0] || '?').toUpperCase();
        const body = document.createElement('div'); body.className = 'rowbody';
        const top = document.createElement('div'); top.className = 'rowtop';
        const name = document.createElement('span'); name.className = 'rowname'; name.textContent = loc(th.name);
        const time = document.createElement('span'); time.className = 'rowtime'; time.textContent = th.time || '';
        top.append(name, time);
        const prev = document.createElement('div'); prev.className = 'rowpreview'; prev.textContent = loc(th.preview);
        body.append(top, prev);
        row.append(av, body);
        if (th.unread) { const d = document.createElement('span'); d.className = 'dot'; row.append(d); }
        row.addEventListener('click', () => openThread(th));
        list.appendChild(row);
      });
      showScreen(list, { showBack: false });
    }

    function openThread(th) {
      if (!Array.isArray(th.messages) || !th.messages.length) { selectThread(th.id); return; }
      haptic('tick');
      const wrap = document.createElement('div');
      const t = document.createElement('div'); t.className = 'transcript';
      th.messages.forEach((m) => {
        const row = document.createElement('div'); row.className = 'bubblerow ' + (m.from === 'me' ? 'me' : 'them');
        const b = document.createElement('div'); b.className = 'bubble'; b.textContent = loc(m.text);
        row.appendChild(b); t.appendChild(row);
        if (m.time) { const tm = document.createElement('div'); tm.className = 'btime'; tm.style.textAlign = m.from === 'me' ? 'right' : 'left'; tm.textContent = m.time; t.appendChild(tm); }
      });
      wrap.appendChild(t);
      const bar = document.createElement('div'); bar.className = 'selectbar';
      const btn = document.createElement('button'); btn.className = 'selectbtn'; btn.textContent = S.select;
      btn.addEventListener('click', () => selectThread(th.id));
      bar.appendChild(btn); wrap.appendChild(bar);
      showScreen(wrap, { showBack: true });
      backBtn.onclick = renderInbox;
    }

    function selectThread(id) {
      if (solved) return;
      solved = true; haptic('ok');
      send({ choice: id });
      setTimeout(() => showOverlay(false), 400);
    }

    // ------- REASSEMBLE mode -------
    const fragments = pjson('fragments');

    function renderReassemble() {
      backBtn.onclick = null; backBtn.classList.remove('show');
      const wrap = document.createElement('div'); wrap.className = 'reassemble';
      const assembled = document.createElement('div'); assembled.className = 'assembled empty'; assembled.dataset.hint = S.poolHint;
      const pool = document.createElement('div'); pool.className = 'pool';
      const order = []; // indices of fragments, in the order the player has picked them
      const used = new Set();

      function renderAssembled() {
        assembled.replaceChildren();
        assembled.classList.toggle('empty', order.length === 0);
        order.forEach((i) => {
          const chip = document.createElement('div'); chip.className = 'chip'; chip.textContent = fragments[i];
          chip.addEventListener('click', () => { // tap an assembled chip to undo it
            const pos = order.indexOf(i); if (pos >= 0) order.splice(pos, 1);
            used.delete(i); renderAssembled(); renderPool();
          });
          assembled.appendChild(chip);
        });
      }
      function renderPool() {
        pool.replaceChildren();
        fragments.forEach((frag, i) => {
          const chip = document.createElement('div'); chip.className = 'chip' + (used.has(i) ? ' used' : '');
          chip.textContent = frag;
          chip.addEventListener('click', () => { if (used.has(i) || solved) return; used.add(i); order.push(i); haptic('tick'); renderAssembled(); renderPool(); });
          pool.appendChild(chip);
        });
      }
      renderAssembled(); renderPool();
      wrap.append(assembled, pool);

      const bottom = document.createElement('div'); bottom.className = 'bottombar';
      const btn = document.createElement('button'); btn.className = 'selectbtn'; btn.textContent = S.send;
      btn.addEventListener('click', () => {
        if (solved) return;
        solved = true; haptic('ok');
        const submission = order.map((i) => fragments[i]).join(' ');
        send({ submission });
        setTimeout(() => showOverlay(false), 400);
      });
      bottom.appendChild(btn);
      wrap.appendChild(bottom);

      showScreen(wrap, { showBack: false });
    }

    // ------- Boot: pick a mode from whichever param is present -------
    if (Array.isArray(threads) && threads.length) renderInbox();
    else if (Array.isArray(fragments) && fragments.length) renderReassemble();
  </script>
</body>
</html>
