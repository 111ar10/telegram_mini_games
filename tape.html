<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Security Feed</title>

  <!-- Telegram Web App SDK (same as the other mini-games in this repo) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!--
    GENERIC CCTV / TAPE TIMECODE SCRUBBER  (reusable across games — config-driven, SERVER-AUTHORITATIVE)
    ----------------------------------------------------------------------------------------------
    The target timecode is NEVER passed here. PULL FRAME reports whatever the HH:MM counter currently
    shows as `submission` (zero-padded, e.g. "09:45"); the engine checks it against the puzzle's answer
    server-side (same path as an in-chat text answer). Two independent digit reels (hour/minute) give
    exact-minute precision — far easier to land on a narrow answer window than dragging analog hands.

    Params (URL query, all optional):
      label    camera/feed label overlay, e.g. "CAM 04 · JELAČIĆ TRG" (decodeURIComponent)
      lang     "en" | "hr" (else Telegram user lang)      tag  italic subtitle line (decodeURIComponent)
      sessionId / userId  passed straight back in the result payload
    Result (Telegram.WebApp.sendData):
      on PULL FRAME: { sessionId, userId, gameId:'tape', submission, timestamp }
      on give up:    { sessionId, userId, gameId:'tape', success:false, outcome:'abandoned', timestamp }
  -->
  <style>
    :root {
      --bg: #050704; --panel: #0a0f0a; --ink: #cdeecb; --muted: #5f8c63;
      --phosphor: #6dffa0; --phosphor-dim: #2f6b45; --amber: #ffb454;
      --danger: #ff6b5e; --success: #6dffa0; --shadow: rgba(0,0,0,.6);
      --brass: #c9a24b; --brass-dark: #8a6d2c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 90% at 50% 0%, #0d140d 0%, var(--bg) 65%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100%; padding: 20px 16px 28px; user-select: none;
    }
    header { text-align: center; margin-bottom: 4px; }
    h1 { font-size: 18px; font-weight: 700; letter-spacing: .3px; color: var(--ink); }
    .tag { margin-top: 6px; font-size: 12.5px; color: var(--muted); line-height: 1.4; max-width: 340px; font-style: italic; }

    /* Monitor frame */
    .monitor {
      margin: 16px auto 4px; width: 320px; max-width: 90vw; border-radius: 10px;
      background: var(--panel); border: 1px solid #16220f;
      box-shadow: 0 14px 32px var(--shadow), inset 0 0 40px rgba(0,0,0,.6);
      padding: 14px 14px 18px; position: relative; overflow: hidden;
    }
    /* scanline + noise overlay (purely atmospheric — never reveals proximity to the answer) */
    .monitor::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
      background: repeating-linear-gradient(180deg, rgba(255,255,255,.03) 0px, rgba(255,255,255,.03) 1px, transparent 1px, transparent 3px);
      mix-blend-mode: overlay; opacity: .5;
    }
    .monitor::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 6;
      box-shadow: inset 0 0 60px rgba(0,0,0,.55);
    }
    .feedrow { display: flex; justify-content: space-between; align-items: center; font-size: 10.5px;
      letter-spacing: 1.5px; color: var(--phosphor-dim); text-transform: uppercase; margin-bottom: 10px; position: relative; z-index: 2; }
    .feedrow .rec { display: flex; align-items: center; gap: 5px; color: var(--danger); }
    .feedrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 6px var(--danger); animation: blink 1.4s infinite; }
    @keyframes blink { 0%,55%{opacity:1} 56%,100%{opacity:.25} }

    /* Counter (two reel groups) */
    .counter { display: flex; align-items: center; justify-content: center; gap: 6px; position: relative; z-index: 2; margin: 6px 0 4px; }
    .reelgroup { display: flex; gap: 4px; }
    .colon { font-size: 34px; font-weight: 700; color: var(--phosphor); text-shadow: 0 0 10px rgba(109,255,160,.5); line-height: 1; align-self: center; padding-bottom: 2px; }
    .dial { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .arrow {
      width: 40px; height: 26px; border: none; border-radius: 6px; cursor: pointer;
      background: #0f1a10; color: var(--phosphor-dim); font-size: 13px; line-height: 1;
      box-shadow: 0 2px 0 #030503, inset 0 0 0 1px #1c2c19; transition: transform .06s, background .15s, color .15s;
    }
    .arrow:active { transform: translateY(2px); box-shadow: inset 0 0 0 1px #1c2c19; background: #16241a; color: var(--phosphor); }
    .window {
      position: relative; width: 40px; height: 60px; border-radius: 6px; overflow: hidden;
      background: #030503; box-shadow: inset 0 0 0 1px #1c2c19, inset 0 8px 10px -6px rgba(0,0,0,.7), inset 0 -8px 10px -6px rgba(0,0,0,.7);
      touch-action: none;
    }
    .reel { position: absolute; left: 0; right: 0; top: 0; text-align: center; will-change: transform; }
    .reel span {
      display: block; height: 20px; line-height: 20px; font-size: 18px; font-weight: 700;
      color: var(--phosphor-dim); font-variant-numeric: tabular-nums; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      text-shadow: 0 0 4px rgba(47,107,69,.4);
    }
    .reel span.mid { color: var(--phosphor); text-shadow: 0 0 8px rgba(109,255,160,.6); }

    .reellabels { display: flex; justify-content: center; gap: 14px; margin-top: 2px; position: relative; z-index: 2; }
    .reellabels .grp { width: 84px; text-align: center; font-size: 9px; letter-spacing: 3px; color: var(--muted); }

    .pull {
      margin-top: 22px; width: 100%; padding: 15px; border: none; border-radius: 12px; cursor: pointer;
      background: linear-gradient(180deg, var(--brass) 0%, var(--brass-dark) 100%);
      color: #1a1406; font-size: 15px; font-weight: 800; letter-spacing: .6px;
      box-shadow: 0 4px 0 #5c4a1f, 0 8px 18px var(--shadow); transition: transform .07s, box-shadow .07s;
    }
    .pull:active { transform: translateY(3px); box-shadow: 0 1px 0 #5c4a1f; }

    .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 15; }
    .flash.go { animation: flashpop .35s ease-out; }
    @keyframes flashpop { 0%{opacity:.9} 100%{opacity:0} }

    .msg { min-height: 20px; margin-top: 14px; font-size: 14px; text-align: center; }
    .msg.err { color: var(--danger); } .msg.ok { color: var(--success); }
    .giveup { margin-top: 18px; background: none; border: none; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }

    .overlay { position: fixed; inset: 0; background: rgba(2,4,2,.88); backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center; z-index: 20; padding: 24px; }
    .overlay.show { display: flex; }
    .card { background: var(--panel); border: 1px solid #1c2c19; border-radius: 18px; padding: 28px 24px;
      text-align: center; max-width: 320px; width: 100%; box-shadow: 0 20px 50px var(--shadow); }
    .card .emoji { font-size: 42px; } .card h2 { margin: 12px 0 6px; font-size: 20px; color: var(--ink); }
    .card p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Security Feed</h1>
    <div class="tag" id="tag"></div>
  </header>

  <div class="monitor">
    <div class="feedrow">
      <span class="rec"><span class="dot"></span> REC</span>
      <span id="feedlabel">CAM 01</span>
    </div>
    <div class="counter" id="counter"></div>
    <div class="reellabels">
      <div class="grp">HH</div>
      <div class="grp">MM</div>
    </div>
  </div>

  <button class="pull" id="pull">PULL FRAME</button>
  <div class="msg" id="msg"></div>
  <button class="giveup" id="giveup">Give up</button>

  <div class="flash" id="flash"></div>

  <div class="overlay" id="overlay">
    <div class="card">
      <div class="emoji" id="rEmoji">🎞️</div>
      <h2 id="rTitle">Frame pulled</h2>
      <p id="rBody"></p>
    </div>
  </div>

  <script>
    // ------- Telegram bootstrap (mirrors padlock.html) -------
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }
    const haptic = (kind) => {
      try {
        if (!tg || !tg.HapticFeedback) return;
        if (kind === 'tick') tg.HapticFeedback.selectionChanged();
        else if (kind === 'ok') tg.HapticFeedback.notificationOccurred('success');
        else if (kind === 'err') tg.HapticFeedback.notificationOccurred('error');
      } catch (e) {}
    };

    // ------- Input params -------
    const q = new URLSearchParams(window.location.search);
    const sessionId = q.get('sessionId');
    const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : q.get('userId');

    let lang = (q.get('lang') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || 'en')
                 .split('-')[0].toLowerCase();
    const STR = {
      en: { title: 'Security Feed', pull: 'PULL FRAME', give: 'Give up',
            sent: 'Sent', sentBody: 'Check the chat for the verdict.',
            gaveTitle: 'Feed released', gaveBody: 'You step back from the deck.' },
      hr: { title: 'Snimka kamere', pull: 'IZVUCI KADAR', give: 'Odustani',
            sent: 'Poslano', sentBody: 'Provjeri chat za ishod.',
            gaveTitle: 'Snimka puštena', gaveBody: 'Odmakneš se od uređaja.' },
    };
    const S = STR[lang] || STR.en;
    document.documentElement.lang = lang;
    document.getElementById('title').textContent = q.get('title') || S.title;
    document.getElementById('pull').textContent = S.pull;
    document.getElementById('giveup').textContent = S.give;
    const tagText = q.get('tag');
    if (tagText) document.getElementById('tag').textContent = decodeURIComponent(tagText);
    const labelText = q.get('label');
    document.getElementById('feedlabel').textContent = labelText ? decodeURIComponent(labelText) : 'CAM 01';

    // ------- Two independent digit reels: HOUR (mod 24) and MINUTE (mod 60), each 2 digits -------
    let hour = 9, minute = 0; // arbitrary starting position — not a hint, just "not pre-solved"
    let solved = false;
    const counterEl = document.getElementById('counter');

    function mod(n, m) { return ((n % m) + m) % m; }

    function makeReel(getVal, setVal, m) {
      const wrap = document.createElement('div'); wrap.className = 'dial';
      const up = document.createElement('button'); up.className = 'arrow'; up.textContent = '▲';
      const win = document.createElement('div'); win.className = 'window';
      const reel = document.createElement('div'); reel.className = 'reel';
      for (let k = 0; k < 5; k++) reel.appendChild(document.createElement('span'));
      win.appendChild(reel);
      const down = document.createElement('button'); down.className = 'arrow'; down.textContent = '▼';
      wrap.append(up, win, down);

      function render() {
        const d = getVal();
        const cells = reel.children;
        const fmt = (n) => String(mod(n, m)).padStart(2, '0');
        cells[0].textContent = fmt(d - 2); cells[0].className = '';
        cells[1].textContent = fmt(d - 1); cells[1].className = '';
        cells[2].textContent = fmt(d);     cells[2].className = 'mid';
        cells[3].textContent = fmt(d + 1); cells[3].className = '';
        cells[4].textContent = fmt(d + 2); cells[4].className = '';
        reel.style.transform = 'translateY(-20px)';
      }
      function step(delta) {
        if (solved) return;
        setVal(mod(getVal() + delta, m));
        render(); haptic('tick');
      }
      up.addEventListener('click', () => step(1));
      down.addEventListener('click', () => step(-1));
      let startY = null;
      win.addEventListener('pointerdown', (e) => { startY = e.clientY; win.setPointerCapture(e.pointerId); });
      win.addEventListener('pointermove', (e) => {
        if (startY === null) return;
        const dy = e.clientY - startY;
        if (Math.abs(dy) >= 20) { step(dy < 0 ? 1 : -1); startY = e.clientY; }
      });
      win.addEventListener('pointerup', () => { startY = null; });
      win.addEventListener('pointercancel', () => { startY = null; });
      win.addEventListener('wheel', (e) => { e.preventDefault(); step(e.deltaY < 0 ? 1 : -1); }, { passive: false });
      render();
      return wrap;
    }

    // Two-digit reel = one physical reel showing a 2-digit padded number (single mod-N counter),
    // matching a real tape-deck's HH/MM counter wheels.
    const hourGroup = document.createElement('div'); hourGroup.className = 'reelgroup';
    hourGroup.appendChild(makeReel(() => hour, (v) => { hour = v; }, 24));
    const colon = document.createElement('div'); colon.className = 'colon'; colon.textContent = ':';
    const minuteGroup = document.createElement('div'); minuteGroup.className = 'reelgroup';
    minuteGroup.appendChild(makeReel(() => minute, (v) => { minute = v; }, 60));
    counterEl.append(hourGroup, colon, minuteGroup);

    // ------- Result reporting (server-authoritative) -------
    // PULL FRAME reports the counter's HH:MM as `submission`; the engine validates it. We never send
    // `success` and never receive the target timecode. `abandon` uses the legacy shape only to bow out.
    function send(payload) {
      const result = { sessionId, userId, gameId: 'tape', timestamp: Date.now(), ...payload };
      console.log('📤 tape result', result);
      try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'MINIGAME_RESULT', payload: result }, '*'); } catch (e) {}
      try {
        if (tg && typeof tg.sendData === 'function') tg.sendData(JSON.stringify(result));
        else localStorage.setItem('tape_result_latest', JSON.stringify(result));
      } catch (e) { console.error('sendData failed', e); }
    }
    function showOverlay(gaveUp) {
      document.getElementById('rEmoji').textContent = gaveUp ? '📼' : '🎞️';
      document.getElementById('rTitle').textContent = gaveUp ? S.gaveTitle : S.sent;
      document.getElementById('rBody').textContent = gaveUp ? S.gaveBody : S.sentBody;
      document.getElementById('overlay').classList.add('show');
    }

    document.getElementById('pull').addEventListener('click', () => {
      if (solved) return;
      solved = true; // one submission per open; a wrong verdict re-launches the mini-game from chat
      haptic('ok');
      const flash = document.getElementById('flash');
      flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
      const submission = String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
      send({ submission });
      setTimeout(() => showOverlay(false), 500);
    });
    document.getElementById('giveup').addEventListener('click', () => {
      if (solved) return;
      solved = true;
      send({ success: false, outcome: 'abandoned' });
      setTimeout(() => showOverlay(true), 200);
    });
  </script>
</body>
</html>
