<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img">

  <defs>
    <filter id="fibre" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.42" numOctaves="5" seed="19" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.62"/></feComponentTransfer>
    </filter>
    <filter id="blotch" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="41" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
    </filter>
    <filter id="bleed" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="3" result="t"/>
      <feDisplacementMap in="b" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain2">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2"><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="g2" mode="multiply"/>
    </filter>
    <radialGradient id="vig2" cx="48%" cy="50%" r="70%">
      <stop offset="46%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.52"/></radialGradient>
  </defs>
  <rect width="1000" height="1000" fill="#e6e0d2"/>
  <rect width="1000" height="1000" filter="url(#blotch)" opacity="0.5"/>
  <rect width="1000" height="1000" filter="url(#fibre)" opacity="0.42"/>
  <line x1="60" y1="712" x2="940" y2="706" stroke="#8f959b" stroke-width="3" opacity="0.42"/>
  <rect x="502" y="0" width="30" height="1000" fill="#000" opacity="0.05"/>

  <g transform="rotate(-4 500 560)" filter="url(#bleed)">
    <!-- capital: a tall open loop that starts above the line and drops through it -->
    <path d="M232 706 C 176 606, 214 396, 292 358 C 340 334, 352 396, 320 462
             C 292 520, 236 572, 214 636 C 196 690, 236 716, 300 690"
          fill="none" stroke="#22406f" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the illegible middle: compressed, uneven, nothing repeating -->
    <path d="M300 690 C 330 622, 344 596, 356 646 C 368 694, 382 700, 398 640
             C 410 592, 430 596, 436 654 C 442 700, 460 706, 476 652
             C 486 616, 500 604, 512 640"
          fill="none" stroke="#22406f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- one true ascender, taller than everything around it -->
    <path d="M512 640 C 524 560, 556 430, 578 404 C 596 384, 606 404, 594 456
             C 580 520, 556 596, 560 652 C 562 686, 584 692, 606 656"
          fill="none" stroke="#22406f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- tail: it stops caring and just runs out -->
    <path d="M606 656 C 626 606, 646 610, 654 654 C 662 698, 682 700, 700 656
             C 714 622, 736 620, 748 654 C 760 686, 782 686, 812 640"
          fill="none" stroke="#22406f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the underline flourish, swept back under from the right -->
    <path d="M818 634 C 860 646, 852 726, 762 736 C 620 752, 336 748, 196 724"
          fill="none" stroke="#22406f" stroke-width="8" stroke-linecap="round" opacity="0.92"/>
    <!-- a single dot, placed carelessly -->
    <circle cx="446" cy="452" r="9" fill="#22406f"/>
  </g>
  <!-- where the nib pressed hardest, the ink pooled -->
  <g opacity="0.55" filter="url(#bleed)" transform="rotate(-4 500 560)">
    <path d="M214 636 C 196 690, 236 716, 300 690" fill="none" stroke="#12294f" stroke-width="9" stroke-linecap="round"/>
    <path d="M560 652 C 562 686, 584 692, 606 656" fill="none" stroke="#12294f" stroke-width="8" stroke-linecap="round"/>
    <path d="M748 654 C 760 686, 782 686, 812 640" fill="none" stroke="#12294f" stroke-width="7" stroke-linecap="round"/>
  </g>
  <rect width="1000" height="1000" fill="url(#vig2)"/>
  <rect width="1000" height="1000" filter="url(#grain2)" fill="#8b8474" opacity="0.16"/>

</svg>
