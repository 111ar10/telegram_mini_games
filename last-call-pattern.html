<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{margin:0;background:#12171a;color:#e8e6df;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(340px,90vw);text-align:center}.grid{display:grid;grid-template-columns:repeat(3,72px);gap:18px;justify-content:center;margin:28px 0}.dot{border:0;border-radius:50%;height:72px;background:#29333a;color:#fff;font-size:22px}.dot.on{background:#c98e48;color:#201409}.row{min-height:30px;color:#b8c1c5}.go{border:0;border-radius:10px;padding:13px 22px;background:#c98e48;color:#21170b;font-weight:800}.clear{background:none;border:0;color:#b8c1c5;margin-top:18px}</style><main class="box"><h1>Work Vault</h1><p>Draw unlock pattern</p><div class="grid" id="g"></div><div class="row" id="r"></div><button class="go" id="go">Unlock</button><br><button class="clear" id="clear">Clear</button></main><script>const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()}let a=[];const g=document.querySelector('#g'),r=document.querySelector('#r');for(let i=1;i<10;i++){let b=document.createElement('button');b.className='dot';b.textContent=i;b.onclick=()=>{if(!a.includes(i)){a.push(i);b.classList.add('on');r.textContent='• '.repeat(a.length)}};g.append(b)};clear.onclick=()=>{a=[];document.querySelectorAll('.dot').forEach(x=>x.classList.remove('on'));r.textContent=''};go.onclick=()=>{const d=JSON.stringify({gameId:'last-call-pattern',submission:a.join('-'),timestamp:Date.now()});if(tg)tg.sendData(d)};</script>
