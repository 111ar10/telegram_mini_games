<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess Record</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!--
    REUSABLE NARRATIVE CHESS BOARD
    ==============================
    Modes: one_move | guided_sequence | identify_piece | historical_reconstruction.

    Required params:
      mode      interaction mode
      position  FEN position
      sequence  JSON UCI array (or comma string), e.g. ["e2e4","e7e6"]

    Teaching/config params:
      prompt, objective, rule     plain string or localized JSON {hr,en}
      stepLabels, hints           JSON arrays of localized strings
      piece                       pawn|knight|bishop|rook|queen|king (identify mode)
      orientation                 white|black
      installation                screen|magnetic|lifesize
      installationId, activeSquare, sensorMap (sensor id -> square)
      skin                        noir|forest|paper|tech plus shared colour overrides

    Result:
      {submission:"e2e4,e7e6", metrics:{...}}. The engine validates the move string.
      Give-up returns {success:false,outcome:"abandoned"}.

    Physical input:
      postMessage({type:"CHESS_INSTALLATION_INPUT",payload:{installationId,from,to,piece,sensorId,source}})

    V1 legality: ordinary moves, blocking, captures, turn order, king safety. No castling, en passant, promotion.
    Full integration and fabrication notes: CHESS.md.
  -->
  <style>
    :root {
      --bg:#0b0d10; --bg2:#191c22; --panel:#14161c; --panel2:#1a1d24; --ink:#e8e6df; --muted:#969aa6;
      --accent:#c9a24b; --accent2:#8a6d2c; --btnink:#221a06; --border:#303540; --light:#d7c79f;
      --dark:#725a3f; --selected:#4fc3f7; --legal:#71d58b; --danger:#e36a68; --shadow:rgba(0,0,0,.55);
      --square-size:42px;
    }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html, body { min-height:100%; }
    body {
      min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 12px 26px;
      color:var(--ink); background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg) 68%);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; user-select:none;
    }
    header { width:360px; max-width:96vw; text-align:center; }
    h1 { font-size:19px; line-height:1.2; }
    .tag { margin-top:5px; color:var(--muted); font-size:12.5px; line-height:1.42; font-style:italic; }
    .panel { width:360px; max-width:96vw; margin-top:10px; padding:10px 12px; border:1px solid var(--border);
      border-radius:12px; background:color-mix(in srgb,var(--panel) 94%,transparent); box-shadow:0 6px 22px var(--shadow); }
    .objective { font-size:13.5px; line-height:1.45; }
    .rule { margin-top:6px; color:var(--muted); font-size:12px; line-height:1.42; }
    .rule strong { color:var(--accent); }
    .installation { display:none; border-color:color-mix(in srgb,var(--accent) 55%,var(--border)); }
    .installation.show { display:block; }
    .installation .mode { font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); }
    .installation p { margin-top:4px; color:var(--muted); font-size:11.5px; line-height:1.4; }

    .board-shell { position:relative; width:fit-content; max-width:96vw; margin-top:11px; padding:8px; border-radius:15px;
      border:1px solid var(--border); background:var(--panel); box-shadow:0 12px 34px var(--shadow); }
    .board { width:calc(var(--square-size) * 8 + 2px); height:calc(var(--square-size) * 8 + 2px); display:grid;
      grid-template-columns:repeat(8,var(--square-size)); grid-template-rows:repeat(8,var(--square-size)); overflow:hidden;
      border-radius:8px; border:1px solid rgba(255,255,255,.12); }
    .sq { position:relative; display:flex; align-items:center; justify-content:center; border:0; border-radius:0;
      width:var(--square-size); height:var(--square-size); min-width:0; min-height:0; padding:0; overflow:hidden;
      font:inherit; cursor:pointer; touch-action:manipulation; }
    .sq.light { background:var(--light); } .sq.dark { background:var(--dark); }
    .sq.selected { box-shadow:inset 0 0 0 4px var(--selected); z-index:2; }
    .sq.last { box-shadow:inset 0 0 0 3px rgba(255,235,110,.66); }
    .sq.legal::after, .sq.capture::after { content:""; width:24%; aspect-ratio:1; border-radius:50%; background:color-mix(in srgb,var(--legal) 78%,transparent);
      position:absolute; box-shadow:0 0 0 3px rgba(255,255,255,.18); }
    .sq.capture::after { width:64%; background:transparent; border:3px solid color-mix(in srgb,var(--legal) 82%,transparent); box-shadow:none; }
    .piece { position:relative; z-index:1; display:grid; place-items:center; width:78%; height:78%;
      font-family:"Segoe UI Symbol","Noto Sans Symbols 2",serif; font-size:calc(var(--square-size) * .76);
      line-height:1; filter:drop-shadow(0 2px 1px rgba(0,0,0,.42)); pointer-events:none; }
    .piece.white { color:#fff9e8; -webkit-text-stroke:1px rgba(0,0,0,.55); }
    .piece.black { color:#17191d; -webkit-text-stroke:1px rgba(255,255,255,.34); }
    .coord { position:absolute; z-index:3; font:700 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace; opacity:.62; pointer-events:none; }
    .coord.file { right:2px; bottom:1px; } .coord.rank { left:2px; top:1px; }
    .light .coord { color:#5d482f; } .dark .coord { color:#efe1bf; }

    .progress { width:360px; max-width:96vw; margin-top:10px; }
    .progress-line { display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--muted); font-size:11.5px; }
    .bar { height:6px; margin-top:5px; border-radius:999px; overflow:hidden; background:var(--panel2); border:1px solid var(--border); }
    .bar > span { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .25s; }
    .step { margin-top:7px; min-height:18px; color:var(--ink); font-size:12.5px; line-height:1.4; text-align:center; }
    .record { margin-top:6px; color:var(--muted); min-height:17px; font:11.5px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;
      overflow-wrap:anywhere; text-align:center; }
    .msg { width:350px; max-width:94vw; min-height:38px; margin-top:8px; padding:8px 10px; border-radius:10px;
      color:var(--muted); font-size:12.5px; line-height:1.42; text-align:center; }
    .msg.good { color:var(--legal); background:color-mix(in srgb,var(--legal) 9%,transparent); }
    .msg.bad { color:var(--danger); background:color-mix(in srgb,var(--danger) 9%,transparent); }

    .tools { width:360px; max-width:96vw; display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
    button.tool { min-height:42px; padding:8px 6px; border:1px solid var(--border); border-radius:10px; color:var(--ink);
      background:var(--panel2); font-size:12px; font-weight:650; cursor:pointer; }
    button.tool:disabled { opacity:.38; cursor:default; }
    button.tool.assist { border-color:color-mix(in srgb,var(--accent) 45%,var(--border)); color:var(--accent); }
    .confirm { width:330px; max-width:90vw; margin-top:11px; padding:14px; border:0; border-radius:13px;
      background:linear-gradient(180deg,var(--accent),var(--accent2)); color:var(--btnink); font-size:15px; font-weight:850;
      box-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 18px var(--shadow); cursor:pointer; opacity:.34; pointer-events:none; }
    .confirm.ready { opacity:1; pointer-events:auto; }
    .confirm:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.35); }
    .giveup { margin-top:9px; padding:5px; border:0; background:none; color:var(--muted); font-size:12.5px; text-decoration:underline; cursor:pointer; }
    .overlay { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; padding:24px;
      background:rgba(6,7,9,.9); backdrop-filter:blur(3px); }
    .overlay.show { display:flex; }
    .result { width:310px; padding:28px 24px; border:1px solid var(--border); border-radius:18px; text-align:center;
      background:var(--panel); box-shadow:0 20px 50px var(--shadow); }
    .result .emoji { font-size:42px; } .result h2 { margin-top:10px; font-size:20px; }
    .result p { margin-top:6px; color:var(--muted); font-size:13px; line-height:1.5; }
    @media (max-width:360px) { body { padding-left:7px; padding-right:7px; } .board-shell { padding:6px; } .panel { padding:9px 10px; } }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Chess Record</h1>
    <div class="tag" id="tag"></div>
  </header>

  <div class="panel">
    <div class="objective" id="objective"></div>
    <div class="rule" id="rule"></div>
  </div>
  <div class="panel installation" id="installation">
    <div class="mode" id="installationMode"></div>
    <p id="installationNote"></p>
  </div>

  <div class="board-shell"><div class="board" id="board" role="grid" aria-label="Chess board"></div></div>

  <div class="progress">
    <div class="progress-line"><span id="modeLabel"></span><span id="progressText"></span></div>
    <div class="bar"><span id="progressBar"></span></div>
    <div class="step" id="step"></div>
    <div class="record" id="record"></div>
  </div>
  <div class="msg" id="msg" aria-live="polite"></div>

  <div class="tools">
    <button class="tool" id="hintBtn">💡 Hint</button>
    <button class="tool" id="resetBtn">↶ Reset</button>
    <button class="tool assist" id="assistBtn">♿ Assist</button>
  </div>
  <button class="confirm" id="confirm">CONFIRM MOVES</button>
  <button class="giveup" id="giveup">Give up</button>

  <div class="overlay" id="overlay">
    <div class="result">
      <div class="emoji" id="resultEmoji">♟️</div>
      <h2 id="resultTitle"></h2>
      <p id="resultBody"></p>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
    const q = new URLSearchParams(location.search);
    const sessionId = q.get('sessionId');
    const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : q.get('userId');
    let lang = (q.get('lang') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || 'en').split('-')[0].toLowerCase();
    if (!['en', 'hr'].includes(lang)) lang = 'en';

    const SKINS = {
      noir:   { bg:'#0b0d10',bg2:'#191c22',panel:'#14161c',panel2:'#1a1d24',ink:'#e8e6df',muted:'#969aa6',accent:'#c9a24b',accent2:'#8a6d2c',btnink:'#221a06',border:'#303540',light:'#d7c79f',dark:'#725a3f',selected:'#4fc3f7',legal:'#71d58b',danger:'#e36a68' },
      forest: { bg:'#0c130e',bg2:'#16211a',panel:'#16211a',panel2:'#1d2a22',ink:'#eaf3e6',muted:'#93ab98',accent:'#8fd18a',accent2:'#3f7a4a',btnink:'#0d1f12',border:'#2c3f33',light:'#ced7ab',dark:'#587153',selected:'#64c8f2',legal:'#8fe08f',danger:'#ef7770' },
      paper:  { bg:'#e6dcc6',bg2:'#f3ecdc',panel:'#fbf6ea',panel2:'#f2e9d6',ink:'#2b2620',muted:'#7d7059',accent:'#b4642a',accent2:'#7e4218',btnink:'#fdf6e8',border:'#d3c4a5',light:'#eadfbe',dark:'#9d7652',selected:'#2e7ca6',legal:'#3c8858',danger:'#ad3d38' },
      tech:   { bg:'#060a11',bg2:'#101c2b',panel:'#0e1622',panel2:'#142338',ink:'#dbe9ff',muted:'#7d94b5',accent:'#3ec5ff',accent2:'#1a6f9c',btnink:'#04141f',border:'#1d3350',light:'#abc6d7',dark:'#385770',selected:'#ffe45a',legal:'#66f0a3',danger:'#ff6f73' },
    };
    (function applySkin() {
      const skin = Object.assign({}, SKINS[(q.get('skin') || 'noir').toLowerCase()] || SKINS.noir);
      const norm = (v) => /^[0-9a-f]{3,8}$/i.test(v) ? `#${v}` : v;
      Object.keys(skin).forEach((key) => { const value = q.get(key); if (value) skin[key] = norm(decodeURIComponent(value)); });
      Object.entries(skin).forEach(([key, value]) => document.documentElement.style.setProperty(`--${key.toLowerCase()}`, value));
    })();

    const STR = {
      en: {
        title:'Chess Record', prompt:'Move the piece shown by the clue.', rule:'Only the rule needed for this move is in play.',
        ruleLabel:'Rule now:', hint:'💡 Hint', hintsLeft:(n)=>`${n} left`, noHints:'No more hints.', reset:'↶ Reset', assist:'♿ Complete with help',
        confirm:'CONFIRM MOVES', give:'Give up', mode_one_move:'One correct move', mode_guided_sequence:'Guided sequence',
        mode_identify_piece:'Find and move the piece', mode_historical_reconstruction:'Historical reconstruction',
        progress:(a,b)=>`${a} of ${b}`, freeProgress:(a)=>`${a} move${a===1?'':'s'}`, select:'Select a piece to begin.',
        selected:(piece,sq)=>`${piece} on ${sq} selected. Choose its destination.`, legalButWrong:'That move is legal, but it does not match the evidence. Nothing is lost—try another.',
        expectedPiece:(piece)=>`This step asks for the ${piece}. Choose that piece; the other pieces can wait.`,
        wrongTurn:'That piece is not to move in this position.', ownSquare:'That square is occupied by your own piece.',
        pathBlocked:'Another piece blocks that route.', badPattern:(piece)=>`A ${piece} cannot move that way.`, pawnCapture:'A pawn moves straight into an empty square and diagonally only to capture.',
        pawnBlocked:'The pawn cannot move through another piece.', castle:'Castling is not part of this exercise.', promotion:'Promotion is not part of this exercise.',
        kingUnsafe:'That would leave your king in check. Try a different legal square.', noPiece:'There is no piece on that square.', sameSquare:'Choose a different destination.',
        accepted:(move)=>`${move} recorded.`, complete:'Sequence complete. Confirm it below.', assisted:'The safe route has been completed for you. Confirm to continue the story.',
        assistUnavailable:'This puzzle has no configured assisted route. Ask the facilitator or use a hint.', resetDone:'Position reset. You can try again without penalty.',
        sent:'Moves submitted', sentBody:'Return to the game to see what the record unlocks.', gaveTitle:'Board left safely', gaveBody:'You can return and use hints or assisted completion later.',
        magnetic:'Magnetic-board preview', magneticNote:'No sensor hardware is connected here. A reed/Hall bridge may report a destination; the board and assisted route remain the manual fallback.',
        lifesize:'Life-size-board preview', lifesizeNote:'A facilitator or QR bridge may report each safe square. On-screen taps and assisted completion remain available.',
        piece:{p:'pawn',n:'knight',b:'bishop',r:'rook',q:'queen',k:'king'},
        pieceRule:{p:'A pawn moves one square forward; from its starting rank it may move two if clear. It captures one square diagonally.',n:'A knight moves in an L: two squares in one direction, then one sideways. It may jump over pieces.',b:'A bishop moves diagonally any distance while the path is clear.',r:'A rook moves horizontally or vertically any distance while the path is clear.',q:'A queen combines rook and bishop movement.',k:'A king moves one square in any direction and may not step into check.'}
      },
      hr: {
        title:'Šahovski zapis', prompt:'Pomakni figuru koju pokazuje trag.', rule:'Sada vrijedi samo pravilo potrebno za ovaj potez.',
        ruleLabel:'Pravilo sada:', hint:'💡 Savjet', hintsLeft:(n)=>`još ${n}`, noHints:'Nema više savjeta.', reset:'↶ Ponovi', assist:'♿ Dovrši uz pomoć',
        confirm:'POTVRDI POTEZE', give:'Odustani', mode_one_move:'Jedan točan potez', mode_guided_sequence:'Vođeni niz',
        mode_identify_piece:'Pronađi i pomakni figuru', mode_historical_reconstruction:'Povijesna rekonstrukcija',
        progress:(a,b)=>`${a} od ${b}`, freeProgress:(a)=>`${a} ${a===1?'potez':'poteza'}`, select:'Odaberi figuru za početak.',
        selected:(piece,sq)=>`Odabran je ${piece} na polju ${sq}. Odaberi odredište.`, legalButWrong:'Potez je dopušten, ali ne odgovara tragovima. Ništa nije izgubljeno — pokušaj drugi.',
        expectedPiece:(piece)=>`U ovom koraku traži se ${piece}. Odaberi tu figuru; ostale zasad miruju.`,
        wrongTurn:'Ta boja sada nije na potezu.', ownSquare:'Na tom je polju tvoja figura.', pathBlocked:'Druga figura zatvara taj put.',
        badPattern:(piece)=>`${piece.charAt(0).toUpperCase()+piece.slice(1)} se ne kreće tako.`, pawnCapture:'Pijun ide ravno na prazno polje, a ukoso samo kada uzima.',
        pawnBlocked:'Pijun ne može preskočiti drugu figuru.', castle:'Rokada nije dio ove vježbe.', promotion:'Promocija nije dio ove vježbe.',
        kingUnsafe:'Taj bi potez ostavio kralja u šahu. Odaberi drugo dopušteno polje.', noPiece:'Na tom polju nema figure.', sameSquare:'Odaberi drugo odredište.',
        accepted:(move)=>`Zabilježen je potez ${move}.`, complete:'Niz je dovršen. Potvrdi ga ispod ploče.', assisted:'Sigurna ruta dovršena je umjesto tebe. Potvrdi za nastavak priče.',
        assistUnavailable:'Ova zagonetka nema pripremljenu rutu pomoći. Zatraži savjet ili pomoć voditelja.', resetDone:'Pozicija je vraćena. Možeš pokušati ponovno bez kazne.',
        sent:'Potezi su poslani', sentBody:'Vrati se u igru i vidi što je zapis otključao.', gaveTitle:'Ploča je sigurno napuštena', gaveBody:'Možeš se vratiti i iskoristiti savjete ili dovršavanje uz pomoć.',
        magnetic:'Pregled magnetne ploče', magneticNote:'Senzorski hardver ovdje nije spojen. Reed/Hall sučelje može javiti odredište; ploča na ekranu i pomoć ostaju ručna rezerva.',
        lifesize:'Pregled velike ploče', lifesizeNote:'Voditelj ili QR sučelje može javiti svako sigurno polje. Dodir na ekranu i dovršavanje uz pomoć ostaju dostupni.',
        piece:{p:'pijun',n:'skakač',b:'lovac',r:'top',q:'dama',k:'kralj'},
        pieceRule:{p:'Pijun ide jedno polje naprijed; s početnog reda može dva ako je put slobodan. Uzima jedno polje ukoso.',n:'Skakač ide u obliku slova L: dva polja u jednom smjeru pa jedno u stranu. Smije preskakati figure.',b:'Lovac ide ukoso koliko želi dok je put slobodan.',r:'Top ide vodoravno ili okomito koliko želi dok je put slobodan.',q:'Dama spaja kretanje topa i lovca.',k:'Kralj ide jedno polje u bilo kojem smjeru i ne smije stati u šah.'}
      }
    };
    const S = STR[lang];
    document.documentElement.lang = lang;

    function pjson(name) { try { const raw=q.get(name); return raw ? JSON.parse(decodeURIComponent(raw)) : null; } catch (e) { return null; } }
    function loc(value) { if (value == null) return ''; if (typeof value === 'object') return value[lang] || value.en || value.hr || Object.values(value)[0] || ''; return String(value); }
    function ptext(name, fallback='') { const parsed=pjson(name); if (parsed != null) return loc(parsed); const raw=q.get(name); return raw ? decodeURIComponent(raw) : fallback; }
    function normalizeMove(value) { return String(value || '').toLowerCase().replace(/[^a-h1-8qrbn]/g,'').slice(0,5); }
    function parseSequence() {
      const parsed=pjson('sequence');
      const raw=Array.isArray(parsed) ? parsed : (q.get('sequence') || '').split(',').filter(Boolean);
      return raw.map(normalizeMove).filter((m)=>/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(m));
    }
    const mode = ['one_move','guided_sequence','identify_piece','historical_reconstruction'].includes(q.get('mode')) ? q.get('mode') : 'one_move';
    const sequence = parseSequence();
    const orientation = q.get('orientation') === 'black' ? 'black' : 'white';
    const installation = ['magnetic','lifesize'].includes(q.get('installation')) ? q.get('installation') : 'screen';
    const installationId = q.get('installationId') || '';
    const activeSquare = (q.get('activeSquare') || '').toLowerCase();
    const sensorMap = pjson('sensorMap') || {};
    const stepLabels = pjson('stepLabels') || [];
    const hints = pjson('hints') || [];
    const requiredPieceName = (q.get('piece') || '').toLowerCase();
    const pieceCodeByName = { pawn:'p',knight:'n',bishop:'b',rook:'r',queen:'q',king:'k',pijun:'p',skakac:'n','skakač':'n',lovac:'b',top:'r',dama:'q',kralj:'k' };
    const requiredPiece = pieceCodeByName[requiredPieceName] || '';
    const startFen = decodeURIComponent(q.get('position') || '8/8/8/8/8/8/4P3/4K2k w - - 0 1');
    const startedAt = Date.now();

    const PIECES = { wp:'♙',wn:'♘',wb:'♗',wr:'♖',wq:'♕',wk:'♔',bp:'♟',bn:'♞',bb:'♝',br:'♜',bq:'♛',bk:'♚' };
    const FILES = ['a','b','c','d','e','f','g','h'];
    const fileOf=(sq)=>FILES.indexOf(sq[0]), rankOf=(sq)=>Number(sq[1])-1;
    const square=(f,r)=>FILES[f]+String(r+1);
    const opposite=(c)=>c==='w'?'b':'w';

    function parseFen(fen) {
      const parts=fen.trim().split(/\s+/); const rows=(parts[0]||'').split('/'); const board=new Map();
      if (rows.length !== 8) throw new Error('FEN needs eight ranks');
      rows.forEach((row,index)=>{ let file=0; for (const ch of row) {
        if (/\d/.test(ch)) file += Number(ch); else {
          const type=ch.toLowerCase(); if (!'pnbrqk'.includes(type) || file>7) throw new Error('Bad FEN piece');
          board.set(square(file,7-index),{type,color:ch===type?'b':'w'}); file++;
        }
      } if (file!==8) throw new Error('Bad FEN rank'); });
      return {board,turn:parts[1]==='b'?'b':'w'};
    }

    let initial;
    try { initial=parseFen(startFen); } catch (e) { initial=parseFen('7k/8/8/8/8/8/4N3/4K3 w - - 0 1'); }
    let board=new Map([...initial.board].map(([k,v])=>[k,{...v}]));
    let turn=initial.turn, selected=null, moves=[], history=[], completed=false, sent=false;
    let hintsUsed=0, assisted=0, assistMoves=0, illegalAttempts=0, objectiveMisses=0;
    let screenMoves=0, sensorMoves=0, facilitatorMoves=0;

    const boardEl=document.getElementById('board'), msgEl=document.getElementById('msg');
    const titleEl=document.getElementById('title'), objectiveEl=document.getElementById('objective'), ruleEl=document.getElementById('rule');
    const stepEl=document.getElementById('step'), recordEl=document.getElementById('record'), progressText=document.getElementById('progressText');
    const progressBar=document.getElementById('progressBar'), confirmBtn=document.getElementById('confirm');
    const hintBtn=document.getElementById('hintBtn'), resetBtn=document.getElementById('resetBtn'), assistBtn=document.getElementById('assistBtn');
    function fitBoard() {
      const shell=boardEl.parentElement;
      const shellStyle=getComputedStyle(shell), bodyStyle=getComputedStyle(document.body), boardStyle=getComputedStyle(boardEl);
      const viewportWidth=window.visualViewport?.width || window.innerWidth;
      const bodyRoom=viewportWidth-parseFloat(bodyStyle.paddingLeft)-parseFloat(bodyStyle.paddingRight);
      const shellLimit=Math.min(360,viewportWidth*.96,bodyRoom);
      const shellChrome=parseFloat(shellStyle.paddingLeft)+parseFloat(shellStyle.paddingRight)+parseFloat(shellStyle.borderLeftWidth)+parseFloat(shellStyle.borderRightWidth);
      const boardChrome=parseFloat(boardStyle.borderLeftWidth)+parseFloat(boardStyle.borderRightWidth);
      const squareSize=Math.max(24,Math.floor((shellLimit-shellChrome-boardChrome)/8));
      document.documentElement.style.setProperty('--square-size',squareSize+'px');
    }
    window.addEventListener('resize',fitBoard,{passive:true});
    if (window.visualViewport) window.visualViewport.addEventListener('resize',fitBoard,{passive:true});
    fitBoard();

    titleEl.textContent=ptext('title',S.title);
    document.getElementById('tag').textContent=ptext('tag','');
    objectiveEl.textContent=ptext('objective',ptext('prompt',S.prompt));
    const configuredRule=ptext('rule','');
    const inferredRule=requiredPiece ? S.pieceRule[requiredPiece] : S.rule;
    ruleEl.innerHTML=`<strong>${S.ruleLabel}</strong> ${escapeHtml(configuredRule || inferredRule)}`;
    document.getElementById('modeLabel').textContent=S[`mode_${mode}`] || S.mode_one_move;
    hintBtn.textContent=S.hint; resetBtn.textContent=S.reset; assistBtn.textContent=S.assist;
    confirmBtn.textContent=S.confirm; document.getElementById('giveup').textContent=S.give;
    if (!hints.length) hintBtn.disabled=true;
    if (!sequence.length) assistBtn.disabled=true;
    if (installation!=='screen') {
      const box=document.getElementById('installation'); box.classList.add('show');
      document.getElementById('installationMode').textContent=installation==='magnetic'?S.magnetic:S.lifesize;
      document.getElementById('installationNote').textContent=installation==='magnetic'?S.magneticNote:S.lifesizeNote;
    }

    function escapeHtml(value) { return String(value).replace(/[&<>"']/g,(ch)=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch])); }
    function setMsg(text,kind='') { msgEl.textContent=text; msgEl.className=`msg ${kind}`.trim(); }
    function haptic(kind) { try { if (!tg?.HapticFeedback) return; kind==='ok'?tg.HapticFeedback.notificationOccurred('success'):kind==='err'?tg.HapticFeedback.notificationOccurred('error'):tg.HapticFeedback.selectionChanged(); } catch(e){} }
    function moveLabel(uci) { return `${uci.slice(0,2)}–${uci.slice(2,4)}`; }
    function currentExpected() { return sequence[moves.length] || null; }
    function currentInstruction() {
      const item=stepLabels[moves.length];
      if (item!=null) return loc(item);
      const expected=currentExpected();
      if (expected && requiredPiece) return `${S.piece[requiredPiece]} · ${expected.slice(0,2)} → ?`;
      return expected ? `${expected.slice(0,2)} → ?` : (completed?S.complete:S.select);
    }

    function pathClear(from,to,b=board) {
      const ff=fileOf(from),fr=rankOf(from),tf=fileOf(to),tr=rankOf(to); const df=Math.sign(tf-ff),dr=Math.sign(tr-fr);
      let f=ff+df,r=fr+dr; while (f!==tf || r!==tr) { if (b.has(square(f,r))) return false; f+=df; r+=dr; } return true;
    }
    function attacks(piece,from,to,b) {
      const df=fileOf(to)-fileOf(from), dr=rankOf(to)-rankOf(from), adf=Math.abs(df), adr=Math.abs(dr);
      if (piece.type==='p') return adf===1 && dr===(piece.color==='w'?1:-1);
      if (piece.type==='n') return (adf===1&&adr===2)||(adf===2&&adr===1);
      if (piece.type==='k') return Math.max(adf,adr)===1;
      if (piece.type==='b') return adf===adr && adf>0 && pathClear(from,to,b);
      if (piece.type==='r') return ((df===0) !== (dr===0)) && pathClear(from,to,b);
      if (piece.type==='q') return (((adf===adr&&adf>0)||((df===0)!==(dr===0))) && pathClear(from,to,b));
      return false;
    }
    function inCheck(color,b) {
      const king=[...b].find(([,p])=>p.color===color&&p.type==='k'); if (!king) return false;
      for (const [from,piece] of b) if (piece.color!==color && attacks(piece,from,king[0],b)) return true;
      return false;
    }
    function validateMove(from,to,b=board,side=turn) {
      if (!/^[a-h][1-8]$/.test(from)||!/^[a-h][1-8]$/.test(to)) return {ok:false,reason:'noPiece'};
      if (from===to) return {ok:false,reason:'sameSquare'};
      const piece=b.get(from); if (!piece) return {ok:false,reason:'noPiece'};
      if (piece.color!==side) return {ok:false,reason:'wrongTurn'};
      const target=b.get(to); if (target?.color===piece.color) return {ok:false,reason:'ownSquare'};
      if (target?.type==='k') return {ok:false,reason:'kingUnsafe'};
      const df=fileOf(to)-fileOf(from),dr=rankOf(to)-rankOf(from),adf=Math.abs(df),adr=Math.abs(dr);
      let ok=false,reason='badPattern';
      if (piece.type==='p') {
        const dir=piece.color==='w'?1:-1, start=piece.color==='w'?1:6;
        if (df===0 && dr===dir && !target) ok=true;
        else if (df===0 && dr===2*dir && rankOf(from)===start && !target) {
          if (b.has(square(fileOf(from),rankOf(from)+dir))) reason='pawnBlocked'; else ok=true;
        } else if (adf===1 && dr===dir && target && target.color!==piece.color) ok=true;
        else reason='pawnCapture';
        if (ok && (rankOf(to)===0||rankOf(to)===7)) return {ok:false,reason:'promotion',piece};
      } else if (piece.type==='n') ok=(adf===1&&adr===2)||(adf===2&&adr===1);
      else if (piece.type==='k') {
        if (adf===2&&adr===0) return {ok:false,reason:'castle',piece};
        ok=Math.max(adf,adr)===1;
      } else if (piece.type==='b') { ok=adf===adr&&adf>0; if (ok&&!pathClear(from,to,b)) {ok=false;reason='pathBlocked';} }
      else if (piece.type==='r') { ok=((df===0)!==(dr===0)); if (ok&&!pathClear(from,to,b)) {ok=false;reason='pathBlocked';} }
      else if (piece.type==='q') { ok=(adf===adr&&adf>0)||((df===0)!==(dr===0)); if (ok&&!pathClear(from,to,b)) {ok=false;reason='pathBlocked';} }
      if (!ok) return {ok:false,reason,piece};
      const next=new Map([...b].map(([k,v])=>[k,{...v}])); next.delete(from); next.set(to,{...piece});
      if (inCheck(piece.color,next)) return {ok:false,reason:'kingUnsafe',piece};
      return {ok:true,piece,captured:target};
    }
    function legalMoves(from) { const out=[]; for (const f of FILES) for (let r=1;r<=8;r++) { const to=f+r; if (validateMove(from,to).ok) out.push(to); } return out; }
    function reasonText(result) {
      const key=result.reason; if (key==='badPattern') return S.badPattern(S.piece[result.piece?.type]||'piece');
      return S[key] || S.badPattern(S.piece[result.piece?.type]||'piece');
    }

    function countSource(source) {
      if (source==='sensor') sensorMoves++;
      else if (source==='facilitator'||source==='qr') facilitatorMoves++;
      else if (source!=='assist') screenMoves++;
    }
    function acceptMove(from,to,result,source='screen') {
      const piece={...result.piece}, captured=result.captured?{...result.captured}:null, uci=`${from}${to}`;
      board.delete(from); board.set(to,piece); history.push({from,to,piece,captured,turnBefore:turn,source});
      turn=opposite(turn); moves.push(uci); countSource(source); selected=null;
      completed=sequence.length ? moves.length>=sequence.length : moves.length>=1;
      setMsg(completed?S.complete:S.accepted(moveLabel(uci)),completed?'good':''); haptic('tick'); render(); publishState(); return true;
    }
    function attemptMove(from,to,source='screen') {
      if (completed||sent) return false; from=String(from||'').toLowerCase(); to=String(to||'').toLowerCase();
      const result=validateMove(from,to); if (!result.ok) { illegalAttempts++; setMsg(reasonText(result),'bad'); haptic('err'); render(); return false; }
      if (requiredPiece && result.piece.type!==requiredPiece) { objectiveMisses++; setMsg(S.expectedPiece(S.piece[requiredPiece]),'bad'); haptic('err'); return false; }
      const uci=`${from}${to}`, expected=currentExpected();
      if (expected && uci!==expected.slice(0,4)) { objectiveMisses++; setMsg(S.legalButWrong,'bad'); haptic('err'); return false; }
      return acceptMove(from,to,result,source);
    }
    function clickSquare(sq) {
      if (completed||sent) return;
      const piece=board.get(sq);
      if (!selected) {
        if (!piece) { setMsg(S.noPiece,'bad'); return; }
        if (piece.color!==turn) { setMsg(S.wrongTurn,'bad'); return; }
        if (requiredPiece && piece.type!==requiredPiece) { objectiveMisses++; setMsg(S.expectedPiece(S.piece[requiredPiece]),'bad'); return; }
        selected=sq; setMsg(S.selected(S.piece[piece.type],sq)); haptic('tick'); render(); publishState(); return;
      }
      if (piece?.color===turn) {
        if (requiredPiece && piece.type!==requiredPiece) { objectiveMisses++; setMsg(S.expectedPiece(S.piece[requiredPiece]),'bad'); return; }
        selected=sq; setMsg(S.selected(S.piece[piece.type],sq)); render(); publishState(); return;
      }
      attemptMove(selected,sq,'screen');
    }

    function undoAll() {
      board=new Map([...initial.board].map(([k,v])=>[k,{...v}])); turn=initial.turn; selected=null; moves=[]; history=[]; completed=false;
      setMsg(S.resetDone); render(); publishState();
    }
    function assistAll() {
      if (!sequence.length||completed||sent) { if (!sequence.length) setMsg(S.assistUnavailable,'bad'); return false; }
      assisted=1;
      while (moves.length<sequence.length) {
        const expected=currentExpected(), from=expected.slice(0,2),to=expected.slice(2,4),result=validateMove(from,to);
        if (!result.ok) { setMsg(`${S.assistUnavailable} (${moveLabel(expected)})`,'bad'); return false; }
        assistMoves++; acceptMove(from,to,result,'assist');
      }
      setMsg(S.assisted,'good'); render(); return true;
    }

    function renderBoard() {
      boardEl.innerHTML=''; const files=orientation==='white'?FILES:[...FILES].reverse();
      const ranks=orientation==='white'?[8,7,6,5,4,3,2,1]:[1,2,3,4,5,6,7,8];
      const targets=selected?new Set(legalMoves(selected)):new Set(); const last=history[history.length-1];
      for (const rank of ranks) for (const file of files) {
        const sq=file+rank,piece=board.get(sq),button=document.createElement('button');
        const parity=(fileOf(sq)+rankOf(sq))%2; button.type='button'; button.dataset.square=sq;
        button.className=`sq ${parity?'light':'dark'}`; button.setAttribute('role','gridcell');
        if (sq===selected) button.classList.add('selected');
        if (last&&(sq===last.from||sq===last.to)) button.classList.add('last');
        if (targets.has(sq)) button.classList.add(piece?'capture':'legal');
        const pieceName=piece?`${piece.color==='w'?(lang==='hr'?'bijeli':'white'):(lang==='hr'?'crni':'black')} ${S.piece[piece.type]}`:'';
        button.setAttribute('aria-label',`${sq}${pieceName?`, ${pieceName}`:''}`);
        if (piece) button.innerHTML=`<span class="piece ${piece.color==='w'?'white':'black'}">${PIECES[piece.color+piece.type]}</span>`;
        const isBottom=rank===ranks[ranks.length-1],isLeft=file===files[0];
        if (isBottom) button.insertAdjacentHTML('beforeend',`<span class="coord file">${file}</span>`);
        if (isLeft) button.insertAdjacentHTML('beforeend',`<span class="coord rank">${rank}</span>`);
        button.addEventListener('click',()=>clickSquare(sq)); boardEl.appendChild(button);
      }
    }
    function render() {
      renderBoard(); const total=sequence.length||1,done=Math.min(moves.length,total);
      progressText.textContent=sequence.length?S.progress(done,total):S.freeProgress(done);
      progressBar.style.width=`${Math.round(done/total*100)}%`; stepEl.textContent=currentInstruction();
      recordEl.textContent=moves.length?moves.map(moveLabel).join(' · '):'—';
      confirmBtn.classList.toggle('ready',completed); resetBtn.disabled=!moves.length&&!selected; assistBtn.disabled=!sequence.length||completed;
      hintBtn.textContent=hints.length ? (hintsUsed>=hints.length?S.noHints:`${S.hint} (${S.hintsLeft(hints.length-hintsUsed)})`) : S.hint;
    }

    function resultMetrics() { return { moves:moves.length,hintsUsed,assisted,assistMoves,illegalAttempts,objectiveMisses,screenMoves,sensorMoves,facilitatorMoves,timeMs:Date.now()-startedAt }; }
    function send(payload) {
      const result={sessionId,userId,gameId:'chess',timeMs:Date.now()-startedAt,metrics:resultMetrics(),timestamp:Date.now(),...payload};
      window.__lastResult=result; console.log('📤 chess result',result);
      try { if (window.parent&&window.parent!==window) window.parent.postMessage({type:'MINIGAME_RESULT',payload:result},'*'); } catch(e){}
      try { if (tg&&typeof tg.sendData==='function') tg.sendData(JSON.stringify(result)); else localStorage.setItem('chess_result_latest',JSON.stringify(result)); } catch(e){}
    }
    function showResult(gaveUp) {
      document.getElementById('resultEmoji').textContent=gaveUp?'🚪':'♟️';
      document.getElementById('resultTitle').textContent=gaveUp?S.gaveTitle:S.sent;
      document.getElementById('resultBody').textContent=gaveUp?S.gaveBody:S.sentBody;
      document.getElementById('overlay').classList.add('show');
    }
    function confirm() { if (!completed||sent) return false; sent=true; haptic('ok'); send({submission:moves.join(',')}); setTimeout(()=>showResult(false),300); return true; }
    function giveUp() { if (sent) return; sent=true; send({success:false,outcome:'abandoned'}); setTimeout(()=>showResult(true),200); }
    function revealHint() {
      if (!hints.length) return; if (hintsUsed>=hints.length) { setMsg(S.noHints); return; }
      setMsg(loc(hints[hintsUsed++])); render();
    }
    function publishState() {
      const expected=currentExpected(); const payload={installationId,mode,installation,step:moves.length,turn,selected,ready:completed,activeSquare:expected?expected.slice(0,2):(activeSquare||null)};
      try { if (window.parent&&window.parent!==window) window.parent.postMessage({type:'CHESS_INSTALLATION_STATE',payload},'*'); } catch(e){}
    }
    function physicalInput(payload={}) {
      if (installationId&&payload.installationId!==installationId) return false;
      const expected=currentExpected();
      const from=String(payload.from||activeSquare||(expected?expected.slice(0,2):'')).toLowerCase();
      const mapped=payload.sensorId&&sensorMap[payload.sensorId]; const to=String(payload.to||mapped||'').toLowerCase();
      if (payload.piece) {
        const actual=board.get(from),code=pieceCodeByName[String(payload.piece).toLowerCase()]||String(payload.piece).toLowerCase().slice(0,1);
        if (!actual||actual.type!==code) { objectiveMisses++; setMsg(requiredPiece?S.expectedPiece(S.piece[requiredPiece]):S.noPiece,'bad'); return false; }
      }
      return attemptMove(from,to,payload.source||'sensor');
    }
    window.addEventListener('message',(event)=>{ if (event.data?.type==='CHESS_INSTALLATION_INPUT') physicalInput(event.data.payload||{}); });
    hintBtn.addEventListener('click',revealHint); resetBtn.addEventListener('click',undoAll); assistBtn.addEventListener('click',assistAll);
    confirmBtn.addEventListener('click',confirm); document.getElementById('giveup').addEventListener('click',giveUp);

    window.__chess={
      move:(from,to,source='screen')=>attemptMove(from,to,source), assist:assistAll, confirm, reset:undoAll,
      legalMoves, input:physicalInput,
      state:()=>({mode,installation,turn,selected,moves:[...moves],completed,hintsUsed,assisted,assistMoves,illegalAttempts,objectiveMisses,screenMoves,sensorMoves,facilitatorMoves,board:Object.fromEntries([...board].map(([sq,p])=>[sq,p.color+p.type]))})
    };
    setMsg(S.select); render(); publishState();
  </script>
</body>
</html>
