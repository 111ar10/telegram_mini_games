<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>ZGRAĐANIN</title>
  <style>
    :root{color-scheme:light;--ink:#192521;--muted:#65736d;--line:#c8d1cd;--paper:#f3f5f2;--card:#fff;--green:#126747;--red:#a52d29;--amber:#a36500;--blue:#155f83;font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}button{font:inherit}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top{background:#102f26;color:#fff;padding:12px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:2}.logo{font-weight:900;letter-spacing:.08em}.logo small{display:block;font-size:.58rem;font-weight:600;letter-spacing:.03em;opacity:.75}.level{margin-left:auto;background:#f6cf64;color:#322500;border-radius:999px;padding:6px 10px;font-weight:800;font-size:.82rem}.body{width:min(980px,100%);margin:auto;padding:18px 14px 110px;display:grid;gap:14px}.crumb{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}.hero,.notice,.panel,.record,.option{background:var(--card);border:1px solid var(--line);border-radius:10px}.hero{padding:18px}.hero h1{font-size:clamp(1.35rem,5vw,2rem);margin:0 0 6px}.hero p{margin:0;color:var(--muted)}.status{display:inline-block;margin-top:12px;padding:5px 8px;border-radius:4px;background:#e5efeb;color:var(--green);font-size:.8rem;font-weight:800}.notice{padding:13px 14px;border-left:5px solid var(--amber)}.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}.panel{padding:12px}.panel span{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase}.panel strong{display:block;margin-top:4px}.panel[data-tone="danger"] strong{color:var(--red)}.panel[data-tone="good"] strong{color:var(--green)}.records{display:grid;gap:8px}.record{padding:12px;display:grid;grid-template-columns:1fr auto;gap:5px 10px}.record b{font-size:.92rem}.record small{color:var(--muted)}.badge{grid-row:1/3;grid-column:2;align-self:center;padding:4px 7px;border-radius:4px;background:#eef1ef;font-size:.72rem;font-weight:800}.question{font-weight:800;font-size:1.08rem;margin:8px 2px}.options{display:grid;gap:9px}.option{width:100%;padding:13px;text-align:left;color:inherit;cursor:pointer}.option:hover{border-color:var(--green)}.option.selected{border:2px solid var(--green);padding:12px;background:#edf7f2}.option b{display:block}.option small{display:block;color:var(--muted);margin-top:3px}.actions{position:fixed;z-index:3;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}.primary,.secondary{border:0;border-radius:8px;padding:12px 14px;font-weight:800}.primary{background:var(--green);color:#fff;flex:1}.primary:disabled{opacity:.42}.secondary{background:#e9edeb;color:var(--ink)}.hint{display:none;background:#fff8dd;border:1px solid #e3c86c;border-radius:8px;padding:12px}.hint.visible{display:block}.error{color:var(--red)}
    @media (min-width:760px){.body{grid-template-columns:1fr 1fr}.hero,.notice,.panels,.records,.decision,.hint{grid-column:1/-1}.options{grid-template-columns:1fr 1fr}.actions{left:50%;transform:translateX(-50%);width:min(980px,100%)}}
  </style>
</head>
<body><div id="app" class="shell"><div class="top"><div class="logo">ZGRAĐANIN<small id="brand"></small></div><div id="level" class="level"></div></div><main id="main" class="body"><div class="hero">Učitavanje…</div></main></div>
<script>
(() => {
  const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
  const q=new URLSearchParams(location.search); const lang=q.get('lang')==='en'?'en':'hr';
  const t=(v)=>typeof v==='string'?v:(v?.[lang]??v?.hr??v?.en??'');
  const parse=(v)=>{try{return JSON.parse(v)}catch{return v}};
  const state={selected:null,hintsUsed:0,config:null};
  const runtime={}; q.forEach((v,k)=>runtime[k]=parse(v));
  const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function load(){
    let cfg={}; const file=q.get('config');
    if(file){const url=new URL(file,location.href);const res=await fetch(url);if(!res.ok)throw new Error('config '+res.status);cfg=await res.json()}
    cfg={...cfg,...runtime};
    const allowed=Number(cfg.hintsAllowed??0); if(Array.isArray(cfg.hints))cfg.hints=cfg.hints.slice(0,Math.max(0,allowed));
    state.config=cfg; render();
  }
  function render(){const c=state.config;document.documentElement.lang=lang;document.title=t(c.title)||'ZGRAĐANIN';
    document.getElementById('brand').textContent=t(c.brand)||'GRADSKI DIGITALNI PORTAL';document.getElementById('level').textContent=(lang==='hr'?'RAZINA ':'LEVEL ')+(c.level??2);
    const panels=(c.panels||[]).map(x=>`<div class="panel" data-tone="${esc(x.tone||'')}"><span>${esc(t(x.label))}</span><strong>${esc(t(x.value))}</strong></div>`).join('');
    const records=(c.records||[]).map(x=>`<div class="record"><b>${esc(x.id?x.id+' · ':'')}${esc(t(x.title))}</b><small>${esc(t(x.meta))}</small><span class="badge">${esc(t(x.status))}</span></div>`).join('');
    const opts=(c.options||[]).map(x=>`<button class="option${state.selected===x.id?' selected':''}" data-id="${esc(x.id)}"><b>${esc(t(x.label))}</b><small>${esc(t(x.detail))}</small></button>`).join('');
    const hint=(c.hints||[])[Math.max(0,state.hintsUsed-1)];
    document.getElementById('main').innerHTML=`<div class="crumb">${esc(t(c.path)||'Početna / Predmeti / Obrada')}</div><section class="hero"><h1>${esc(t(c.title))}</h1><p>${esc(t(c.subtitle))}</p><span class="status">${esc(t(c.status)||'U OBRADI')}</span></section>${c.notice?`<section class="notice">${esc(t(c.notice))}</section>`:''}${panels?`<section class="panels">${panels}</section>`:''}${records?`<section class="records">${records}</section>`:''}<section class="decision"><div class="question">${esc(t(c.prompt))}</div><div class="options">${opts}</div></section><section class="hint${hint?' visible':''}">${esc(t(hint))}</section>`;
    document.querySelectorAll('.option').forEach(b=>b.onclick=()=>select(b.dataset.id));
    let actions=document.querySelector('.actions');if(actions)actions.remove();actions=document.createElement('div');actions.className='actions';actions.innerHTML=`${(c.hints||[]).length?`<button id="hint" class="secondary">${lang==='hr'?'💡 Natuknica':'💡 Hint'}</button>`:''}<button id="giveup" class="secondary">${lang==='hr'?'Odustani':'Give up'}</button><button id="confirm" class="primary" ${state.selected?'':'disabled'}>${esc(t(c.confirmLabel)||(lang==='hr'?'Predaj zahtjev':'Submit request'))}</button>`;document.body.append(actions);
    actions.querySelector('#confirm').onclick=confirm;actions.querySelector('#giveup').onclick=giveup;const hb=actions.querySelector('#hint');if(hb)hb.onclick=showHint;
  }
  function select(id){state.selected=id;render()}
  function send(payload){const data=JSON.stringify({...payload,sessionId:q.get('sessionId')||undefined,userId:q.get('userId')||undefined,metrics:{hintsUsed:state.hintsUsed}});if(tg?.sendData)tg.sendData(data);else window.__lastZgradaninPayload=JSON.parse(data)}
  function confirm(){if(state.selected)send({choice:state.selected})}
  function giveup(){send({success:false,outcome:'abandoned'})}
  function showHint(){const n=state.config?.hints?.length||0;if(!n)return;state.hintsUsed=Math.min(n,state.hintsUsed+1);render()}
  window.__zgradanin={state,select,confirm,giveup,showHint};
  load().catch(e=>{document.getElementById('main').innerHTML=`<section class="hero error">${lang==='hr'?'Portal se nije mogao učitati.':'The portal could not load.'} (${esc(e.message)})</section>`});
})();
</script></body></html>
