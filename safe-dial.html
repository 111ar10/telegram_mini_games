<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Safe Dial</title>

  <!-- Telegram Web App SDK (same as the other mini-games in this repo) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!--
    GENERIC ROTARY SAFE DIAL  (reusable across games — config-driven, SERVER-AUTHORITATIVE)
    ---------------------------------------------------------------------------------------------------------
    One big dial (0..range-1), turned to a fresh stop N times in sequence — the classic bank-vault/old-strongbox
    trope, distinct from padlock.html's parallel reel dials and sliding-lock.html's independent pin tracks.
    The combination is NEVER sent to this page (same discipline as every other app in this family): the player
    dials from whatever they already know in-fiction, SET locks each turn in, and once every turn is set the
    OPEN handle reports the dialed numbers for the engine to validate — exactly like a typed answer. The
    direction arrow (↻/↺) alternates per turn purely as cosmetic old-safe flavor; it is NOT enforced (no real
    multi-wrap tracking), same pragmatic simplification clock.html already makes for its hands.

    Params (URL query):
      range     values 0..range-1 the dial can stop on, default 100 (a classic 0-99 dial)
      turns     how many stops are dialed in sequence, default 3 (min 2, max 5)
      separator string joining the dialed numbers in the reported submission, default "-" (use "" for a plain
                concatenated code, e.g. two 2-digit turns -> "1892")
      pad       zero-pad width per turn's number; default = digits needed for (range-1), e.g. range:100 -> 2
      doorColor / dialColor / brassColor   hex colors (# optional) — customize the vault's look per game
      title     header title      tag  italic prompt line (decodeURIComponent)      lang  "en" | "hr"
      sessionId / userId  passed straight back in the result payload
    Result (Telegram.WebApp.sendData):
      on OPEN:    { sessionId, userId, gameId:'safe-dial', submission, timestamp }
      give up:    { sessionId, userId, gameId:'safe-dial', success:false, outcome:'abandoned', timestamp }
  -->
  <style>
    :root {
      --bg: #0b0d10; --panel: #14161c; --ink: #e8e6df; --muted: #8b90a0;
      --brass: #c9a24b; --brass-dark: #8a6d2c; --shadow: rgba(0,0,0,.55); --success: #4caf7d;
      --door: #23262d; --dial: #1a1c22;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 90% at 50% 0%, #191c22 0%, var(--bg) 65%);
      color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; min-height: 100%;
      padding: 20px 14px 28px; user-select: none;
    }
    header { text-align: center; margin-bottom: 4px; }
    h1 { font-size: 19px; font-weight: 700; }
    .tag { margin-top: 6px; font-size: 12.5px; color: var(--muted); font-style: italic; max-width: 320px; line-height: 1.4; }

    .vault {
      margin-top: 18px; width: 300px; max-width: 90vw; aspect-ratio: 1; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #33373f, var(--door) 70%);
      box-shadow: 0 16px 34px var(--shadow), inset 0 0 0 6px #14161b, inset 0 0 24px rgba(0,0,0,.5);
      position: relative; display: flex; align-items: center; justify-content: center;
    }
    .rivet { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #0e0f13;
      box-shadow: inset 0 1px 1px rgba(255,255,255,.15); }

    svg#dialSvg { touch-action: none; cursor: grab; }
    svg#dialSvg:active { cursor: grabbing; }
    .tick { stroke: rgba(255,255,255,.35); stroke-width: 1.5; }
    .tick.major { stroke: rgba(255,255,255,.6); stroke-width: 2; }
    .ticklabel { font-size: 9px; fill: rgba(255,255,255,.55); text-anchor: middle; }
    .knob { fill: var(--dial); stroke: rgba(255,255,255,.12); stroke-width: 1; }
    .pointer { fill: var(--brass); }
    .readout { font-size: 26px; font-weight: 800; fill: var(--ink); text-anchor: middle; font-variant-numeric: tabular-nums; }
    .turnhint { font-size: 11px; fill: var(--muted); text-anchor: middle; }

    .dialedrow { margin-top: 16px; display: flex; gap: 8px; }
    .dialedchip { min-width: 30px; padding: 5px 8px; border-radius: 7px; background: var(--panel);
      border: 1px solid #333a46; font-size: 13px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
    .dialedchip.pending { color: var(--muted); border-style: dashed; }

    .setbtn, .openbtn {
      margin-top: 18px; width: 260px; max-width: 84vw; padding: 14px; border: none; border-radius: 14px; cursor: pointer;
      background: linear-gradient(180deg, var(--brass) 0%, var(--brass-dark) 100%); color: #221a06; font-size: 15px;
      font-weight: 800; letter-spacing: .3px; box-shadow: 0 4px 0 #5c4a1f, 0 8px 18px var(--shadow);
      transition: transform .07s, box-shadow .07s;
    }
    .setbtn:active, .openbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #5c4a1f; }
    .openbtn { display: none; }
    .openbtn.ready { display: block; }
    .setbtn.hidden { display: none; }

    .msg { min-height: 18px; margin-top: 12px; font-size: 13px; text-align: center; color: var(--muted); }
    .giveup { margin-top: 8px; background: none; border: none; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }

    .overlay { position: fixed; inset: 0; background: rgba(6,7,9,.88); backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center; z-index: 20; padding: 24px; }
    .overlay.show { display: flex; }
    .card { background: var(--panel); border: 1px solid #333a46; border-radius: 18px; padding: 28px 24px;
      text-align: center; max-width: 320px; width: 100%; box-shadow: 0 20px 50px var(--shadow); }
    .card .emoji { font-size: 42px; } .card h2 { margin: 12px 0 6px; font-size: 20px; } .card p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Safe Dial</h1>
    <div class="tag" id="tag" style="display:none"></div>
  </header>

  <div class="vault" id="vault"></div>
  <div class="dialedrow" id="dialedRow"></div>

  <button class="setbtn" id="setbtn">SET</button>
  <button class="openbtn" id="openbtn">OPEN</button>
  <div class="msg" id="msg"></div>
  <button class="giveup" id="giveup">Give up</button>
  <button class="giveup" id="hintBtn" style="display:none">💡 Hint</button>

  <div class="overlay" id="overlay">
    <div class="card">
      <div class="emoji" id="rEmoji">🔓</div>
      <h2 id="rTitle">Unlocked</h2>
      <p id="rBody"></p>
    </div>
  </div>

  <!-- `type="module"` for the top-level `await` in `loadConfigInto` below. Module scope also means
       nothing here leaks to `window` implicitly, so any test hook must be assigned explicitly. -->
  <script type="module">
    // ------- Hosted config (MINIGAMES.md → "Keep launch URLs small") -------
    // `config` names a JSON file — normally a bare filename beside this app — whose keys stand in for
    // URL params, so a launch carrying a whole hint ladder stays a couple of
    // hundred characters instead of running past the ~2 KB some proxies and older WebViews refuse.
    // A param spelled out in the URL always wins over the file.
    //
    // Non-string values are re-encoded rather than passed through: the readers below expect exactly
    // the `encodeURIComponent(JSON.stringify(x))` shape the engine's `buildWebAppUrl` produces.
    async function loadConfigInto(params) {
      const configParam = params.get('config');
      if (!configParam) return; // no `config` → nothing awaited, behaviour identical to before
      const configUrl = new URL(configParam, window.location.href).href;
      try {
        const res = await fetch(configUrl);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        for (const [k, v] of Object.entries(await res.json())) {
          if (params.has(k)) continue;
          params.set(k, typeof v === 'string' ? v : encodeURIComponent(JSON.stringify(v)));
        }
      } catch (e) {
        console.error('config: failed to load', configUrl, e);
      }
      // ------- Hint gate (engine-emitted `hintsAllowed`) -------
      // A sidecar is a static file, so a hint ladder inside one cannot trim itself the way
      // `gateWebAppHints` trims an inline `hints` param. The launch carries the count this
      // difficulty earned; slicing to it here is what keeps the solution rung out of reach on
      // normal/hard. No-op when the ladder came from the URL — the engine already cut that one.
      const allowedRaw = params.get('hintsAllowed');
      if (allowedRaw !== null) {
        const allowed = Math.max(0, parseInt(allowedRaw, 10) || 0);
        const rawHints = params.get('hints');
        if (rawHints) {
          try {
            let all;
            try { all = JSON.parse(decodeURIComponent(rawHints)); } catch (e) { all = JSON.parse(rawHints); }
            if (Array.isArray(all) && all.length > allowed) {
              params.set('hints', encodeURIComponent(JSON.stringify(all.slice(0, allowed))));
            }
          } catch (e) { /* not a JSON array — leave whatever the content authored */ }
        }
      }
    }

    // ------- Telegram bootstrap (mirrors padlock.html) -------
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }
    const haptic = (kind) => {
      try {
        if (!tg || !tg.HapticFeedback) return;
        if (kind === 'tick') tg.HapticFeedback.selectionChanged();
        else if (kind === 'ok') tg.HapticFeedback.notificationOccurred('success');
        else if (kind === 'err') tg.HapticFeedback.notificationOccurred('error');
      } catch (e) {}
    };

    const q = new URLSearchParams(window.location.search);
    await loadConfigInto(q);
    const sessionId = q.get('sessionId');
    const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : q.get('userId');
    let lang = (q.get('lang') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || 'en')
                 .split('-')[0].toLowerCase();

    const STR = {
      en: { title: 'Safe Dial', set: 'SET', open: 'OPEN', give: 'Give up',
            sent: 'Sent', sentBody: 'Check the chat for the verdict.',
            gaveTitle: 'Left locked', gaveBody: 'You step back from the vault.',
            turn: (i, n) => `Turn ${i} of ${n}`, hint: '💡 Hint', noMoreHints: '💡 No more hints' },
      hr: { title: 'Sef', set: 'POSTAVI', open: 'OTVORI', give: 'Odustani',
            sent: 'Poslano', sentBody: 'Provjeri chat za ishod.',
            gaveTitle: 'Ostalo zaključano', gaveBody: 'Odmakneš se od sefa.',
            turn: (i, n) => `Okret ${i} od ${n}`, hint: '💡 Savjet', noMoreHints: '💡 Nema više savjeta' },
    };
    const S = STR[lang] || STR.en;
    document.documentElement.lang = lang;
    document.getElementById('title').textContent = q.get('title') ? decodeURIComponent(q.get('title')) : S.title;
    document.getElementById('setbtn').textContent = S.set;
    document.getElementById('openbtn').textContent = S.open;
    document.getElementById('giveup').textContent = S.give;
    const tagText = q.get('tag');
    if (tagText) { const t = document.getElementById('tag'); t.style.display = ''; t.textContent = decodeURIComponent(tagText); }

    // ------- In-app hints (optional; duplicated from the puzzle's own hints) -------
    let hints = []; try { hints = JSON.parse(decodeURIComponent(q.get('hints') || '[]')); } catch (e) {}
    let hintsRevealed = 0;
    const msgEl = document.getElementById('msg');
    const hintBtn = document.getElementById('hintBtn');
    if (hints.length) {
      hintBtn.style.display = '';
      hintBtn.textContent = `${S.hint} (${hints.length})`;
      hintBtn.addEventListener('click', () => {
        const h = hints[Math.min(hintsRevealed, hints.length - 1)];
        hintsRevealed = Math.min(hintsRevealed + 1, hints.length);
        hintBtn.textContent = hintsRevealed >= hints.length ? S.noMoreHints : `${S.hint} (${hints.length - hintsRevealed} left)`;
        msgEl.textContent = typeof h === 'string' ? h : (h[lang] || h.en || '');
        msgEl.className = 'msg';
      });
    }

    function hex(v, fallback) { if (!v) return fallback; return v.startsWith('#') ? v : ('#' + v); }
    const doorColor = hex(q.get('doorColor'), null);
    const dialColor = hex(q.get('dialColor'), null);
    const brassColor = hex(q.get('brassColor'), null);
    if (doorColor) document.documentElement.style.setProperty('--door', doorColor);
    if (dialColor) document.documentElement.style.setProperty('--dial', dialColor);
    if (brassColor) { document.documentElement.style.setProperty('--brass', brassColor); document.documentElement.style.setProperty('--brass-dark', brassColor); }

    const range = Math.max(10, parseInt(q.get('range') || '100', 10));
    const turns = Math.max(2, Math.min(5, parseInt(q.get('turns') || '3', 10)));
    const separator = q.get('separator') != null ? q.get('separator') : '-';
    const padWidth = q.get('pad') != null ? parseInt(q.get('pad'), 10) : String(range - 1).length;

    let solved = false;

    // ------- Result reporting (server-authoritative, same discipline as padlock.html) -------
    function send(payload) {
      const result = { sessionId, userId, gameId: 'safe-dial', timestamp: Date.now(), metrics: { hintsUsed: hintsRevealed }, ...payload };
      console.log('📤 safe-dial result', result);
      try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'MINIGAME_RESULT', payload: result }, '*'); } catch (e) {}
      try {
        if (tg && typeof tg.sendData === 'function') tg.sendData(JSON.stringify(result));
        else localStorage.setItem('safe-dial_result_latest', JSON.stringify(result));
      } catch (e) { console.error('sendData failed', e); }
    }
    function showOverlay(gaveUp) {
      document.getElementById('rEmoji').textContent = gaveUp ? '🔒' : '🗝️';
      document.getElementById('rTitle').textContent = gaveUp ? S.gaveTitle : S.sent;
      document.getElementById('rBody').textContent = gaveUp ? S.gaveBody : S.sentBody;
      document.getElementById('overlay').classList.add('show');
    }
    document.getElementById('giveup').addEventListener('click', () => {
      if (solved) return;
      solved = true;
      send({ success: false, outcome: 'abandoned' });
      setTimeout(() => showOverlay(true), 200);
    });

    // ------- Vault door rivets (cosmetic) -------
    const vault = document.getElementById('vault');
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2;
      const r = document.createElement('div'); r.className = 'rivet';
      r.style.left = `calc(50% + ${Math.cos(ang) * 46}% - 4px)`;
      r.style.top = `calc(50% + ${Math.sin(ang) * 46}% - 4px)`;
      vault.appendChild(r);
    }

    // ------- Dial (SVG) -------
    const SIZE = 240, CX = 120, CY = 120, R = 100;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('id', 'dialSvg'); svg.setAttribute('width', '84%'); svg.setAttribute('viewBox', `0 0 ${SIZE} ${SIZE}`);
    vault.appendChild(svg);

    const majorEvery = Math.max(1, Math.round(range / 10));
    for (let v = 0; v < range; v++) {
      const ang = (v / range) * Math.PI * 2 - Math.PI / 2;
      const isMajor = v % majorEvery === 0;
      const rOuter = R, rInner = isMajor ? R - 12 : R - 7;
      const x1 = CX + Math.cos(ang) * rOuter, y1 = CY + Math.sin(ang) * rOuter;
      const x2 = CX + Math.cos(ang) * rInner, y2 = CY + Math.sin(ang) * rInner;
      const line = document.createElementNS(svg.namespaceURI, 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1); line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('class', 'tick' + (isMajor ? ' major' : ''));
      svg.appendChild(line);
      if (isMajor) {
        const lx = CX + Math.cos(ang) * (rInner - 12), ly = CY + Math.sin(ang) * (rInner - 12);
        const label = document.createElementNS(svg.namespaceURI, 'text');
        label.setAttribute('x', lx); label.setAttribute('y', ly + 3); label.setAttribute('class', 'ticklabel');
        label.textContent = v; svg.appendChild(label);
      }
    }

    const knob = document.createElementNS(svg.namespaceURI, 'circle');
    knob.setAttribute('cx', CX); knob.setAttribute('cy', CY); knob.setAttribute('r', R - 34); knob.setAttribute('class', 'knob');
    svg.appendChild(knob);

    const pointer = document.createElementNS(svg.namespaceURI, 'polygon');
    pointer.setAttribute('class', 'pointer');
    svg.appendChild(pointer);

    const readout = document.createElementNS(svg.namespaceURI, 'text');
    readout.setAttribute('x', CX); readout.setAttribute('y', CY + 8); readout.setAttribute('class', 'readout');
    svg.appendChild(readout);

    const turnHint = document.createElementNS(svg.namespaceURI, 'text');
    turnHint.setAttribute('x', CX); turnHint.setAttribute('y', CY + 30); turnHint.setAttribute('class', 'turnhint');
    svg.appendChild(turnHint);

    let value = 0;
    const dialed = [];

    function renderPointer() {
      const ang = (value / range) * Math.PI * 2 - Math.PI / 2;
      const rTip = R - 20, rBaseHalf = 7;
      const tipX = CX + Math.cos(ang) * rTip, tipY = CY + Math.sin(ang) * rTip;
      const baseAng1 = ang + Math.PI / 2, baseAng2 = ang - Math.PI / 2;
      const rBase = R - 40;
      const b1x = CX + Math.cos(ang) * rBase + Math.cos(baseAng1) * rBaseHalf;
      const b1y = CY + Math.sin(ang) * rBase + Math.sin(baseAng1) * rBaseHalf;
      const b2x = CX + Math.cos(ang) * rBase + Math.cos(baseAng2) * rBaseHalf;
      const b2y = CY + Math.sin(ang) * rBase + Math.sin(baseAng2) * rBaseHalf;
      pointer.setAttribute('points', `${tipX},${tipY} ${b1x},${b1y} ${b2x},${b2y}`);
      readout.textContent = String(value).padStart(padWidth, '0');
    }
    function updateHint() {
      const turnNo = dialed.length + 1;
      const dir = turnNo % 2 === 1 ? '↻' : '↺';
      turnHint.textContent = `${dir} ${S.turn(turnNo, turns)}`;
    }
    function renderDialedRow() {
      const row = document.getElementById('dialedRow');
      row.innerHTML = '';
      for (let i = 0; i < turns; i++) {
        const chip = document.createElement('div');
        chip.className = 'dialedchip' + (i >= dialed.length ? ' pending' : '');
        chip.textContent = i < dialed.length ? String(dialed[i]).padStart(padWidth, '0') : '···';
        row.appendChild(chip);
      }
    }

    function angleToValue(clientX, clientY) {
      const rect = svg.getBoundingClientRect();
      const x = (clientX - rect.left) * (SIZE / rect.width) - CX;
      const y = (clientY - rect.top) * (SIZE / rect.height) - CY;
      let ang = Math.atan2(y, x) + Math.PI / 2;
      if (ang < 0) ang += Math.PI * 2;
      return Math.floor((ang / (Math.PI * 2)) * range) % range;
    }

    let dragging = false;
    svg.addEventListener('pointerdown', (e) => {
      if (solved || dialed.length >= turns) return;
      dragging = true; svg.setPointerCapture(e.pointerId);
      value = angleToValue(e.clientX, e.clientY); renderPointer(); haptic('tick');
    });
    svg.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const nv = angleToValue(e.clientX, e.clientY);
      if (nv !== value) { value = nv; renderPointer(); haptic('tick'); }
    });
    svg.addEventListener('pointerup', () => { dragging = false; });
    svg.addEventListener('pointercancel', () => { dragging = false; });

    document.getElementById('setbtn').addEventListener('click', () => {
      if (solved || dialed.length >= turns) return;
      dialed.push(value);
      haptic('ok');
      renderDialedRow();
      if (dialed.length >= turns) {
        document.getElementById('setbtn').classList.add('hidden');
        document.getElementById('openbtn').classList.add('ready');
        turnHint.textContent = '';
      } else {
        value = 0; renderPointer(); updateHint();
      }
    });

    document.getElementById('openbtn').addEventListener('click', () => {
      if (solved) return;
      solved = true; haptic('ok');
      const submission = dialed.map((v) => String(v).padStart(padWidth, '0')).join(separator);
      send({ submission });
      setTimeout(() => showOverlay(false), 500);
    });

    renderPointer(); updateHint(); renderDialedRow();

    // test hook (mirrors the rest of the family)
    window.__safeDial = {
      setValue: (v) => { value = ((v % range) + range) % range; renderPointer(); },
      set: () => document.getElementById('setbtn').click(),
      dialAndSet: (v) => { window.__safeDial.setValue(v); document.getElementById('setbtn').click(); },
      open: () => document.getElementById('openbtn').click(),
      dialed,
    };
  </script>
</body>
</html>
