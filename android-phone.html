<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Phone</title>

  <!-- Telegram Web App SDK (same as the other mini-games in this repo) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!--
    GENERIC ANDROID-PHONE SIMULATOR  (reusable across games — config-driven, MODULAR, SERVER-AUTHORITATIVE)
    ---------------------------------------------------------------------------------------------------------
    A phone shell (status bar + screen router) with EIGHT screens, each independently reachable via `screen=`
    so a puzzle can deep-link straight into one, or leave it unset to start at a real home screen with an app
    grid. Distinct from phone.html (which is a single-purpose messaging-inbox picker/reassembler) — this file
    simulates the DEVICE, not one app.

    TWO WAYS TO USE IT.
      (1) Fixed mode — no `apps` param: the original Phone / Contacts / Messages (+ Gallery) grid. Every
          caller that predates the catalog keeps working byte-for-byte.
      (2) Catalog mode — pass `apps`: YOU author the device. The grid is your app list, in your order, and
          `owned` says which of them the player has actually opened. The rest render dimmed with a padlock.
          `owned` is meant to be fed the engine's `{{items}}` token, so the page draws the player's REAL
          phone rather than a fixed set piece. See docs/GAME-TYPES-AND-MINIGAMES.md §11.3.

      • home      — app-icon grid. Shown when `screen` is unset. Tapping an icon navigates client-side (no
                    reload). A locked icon opens its passcode screen if this launch is the one asking for it
                    (`lockApp`), otherwise it just shakes: seeing a door you cannot open yet is the point.
      • list      — rows of "icon / primary / secondary / timestamp". ONE shape for every list a phone has —
                    a call log, a drafts folder, a search history, a calendar. A row carrying `body` is
                    tappable and opens as a note (back returns to the list, not to home).
      • note      — a single document: optional `meta` line above pre-wrapped body text.
                    Rows nest: a row carrying `rows` is a FOLDER and opens another list, so one `list`
                    app is a whole file explorer. A row carrying `requires` is drawn only when that id
                    is in `owned` — absent rather than padlocked, for a folder that must stay hidden
                    until the player has earned it.
      • agenda    — a calendar, grouped by day with a time gutter and a coloured bar per entry, the way
                    a phone calendar reads. `days: [{ label, today?, empty?, entries: [...] }]`; an entry is
                    `{ from, to?, title, note?, color?, repeat?, body?, requires? }` and one carrying `body`
                    opens as a note. A day with no entries still draws its header — an empty evening is
                    information.
      • thread    — ONE SMS conversation, read-only: left/right bubbles, optional per-message time, date
                    dividers, and a dashed "ghost" bubble for a message that was typed and never sent.
                    The conversation you READ, as against `messages`, which is the one you WRITE. Reports
                    nothing on its own — pair with `confirmLabel` for an "I read it" beat. A `list` row may
                    carry a `thread` too, which makes one list app a whole SMS inbox: conversations → bubbles.
      • player    — a voice-memo player: play button, waveform, running time, and a `transcript` that
                    reveals line by line AS IT PLAYS. Deliberately paced — a recording you have to sit
                    through lands differently from a wall of text you skim in a second.
      • lock      — passcode entry for ONE app (`lockApp`). Reports `{ submission: "<typed>" }`; the page
                    never receives the passcode. Text or numeric keyboard via the app's `lockMode`.
      • dialer    — numeric keypad + a real, typeable readout (tap the keys OR type on a physical/soft
                    keyboard — both write into the same field). CALL reports `{ submission: "<digits>" }`.
      • contacts  — a phonebook list (name + number). Tapping a contact opens the dialer pre-filled with
                    their number (default — a "look the number up, then dial" flow); or, if the contact has
                    a `note`, opens that note instead, which makes the screen a phonebook you READ rather
                    than one you dial from; or, if `directCall` is set, immediately reports
                    `{ submission: "<contact id>" }` — a "who do you call" puzzle shape instead of a
                    "what number do you dial" one. A catalog app may carry its own `contacts` array, the
                    same way a gallery app carries its own roll.
      • messages  — compose a text message. Typed text + SEND reports `{ submission: "<text>" }`
                    (server-authoritative, same contract as any derived-text puzzle). If `phrases` is given,
                    tapping one immediately reports `{ choice: "<phrase id>" }` instead (a pick-the-right-line
                    puzzle, same contract as phone.html's THREADS mode / evidence.html's CHOICE mode) — use
                    `freeText=false` to hide the typing box and make phrases the only option.
      • gallery   — photo grid (only shown as a home icon when `gallery` is non-empty). Tap a tile to open a
                    full-screen viewer (prev/next/close). PURE VIEWER — never reports anything on its own; use
                    `confirmLabel` (below) if a puzzle needs "I looked, confirmed" as its result. A tile with no
                    `img` renders as a colored placeholder card (emoji + caption) — lets you seed flavor/decoy
                    photos before a real image asset exists.
      confirmLabel  optional, decodeURIComponent: if set, shows a persistent accent CONFIRM button (any screen)
                    that reports client-trusted `{ success:true, outcome:'confirmed' }` — for non-scored
                    "examine this and confirm" interactions (e.g. a dead-end prop), same discipline as
                    evidence.html's CONFIRM mode / torn-note.html's IMAGE mode.
    As with every other app in this family: the CORRECT number/contact/message is never sent to this page —
    only phonebook/phrase/gallery data the player is meant to see. The player reports what they actually did;
    the engine (same path as a typed answer) decides — except `confirmLabel`, which is deliberately client-
    trusted (there is nothing to validate for a pure "I looked" beat).

    Params (URL query):
      screen      "home" (default) | "dialer" | "contacts" | "messages" | "gallery" | an app id from `apps`
      config      URL (normally a bare filename beside this file) of a JSON object whose keys stand in for
                  any param below — real JSON, not url-encoded strings. A param spelled out in the URL WINS
                  over the file, so ONE hosted device catalog serves every launch that differs only by
                  `lockApp` / `screen` / `owned`. That is how a multi-app phone stays under the 2048-char
                  URL ceiling `content:check` warns at. Same contract as phone.html / board.html /
                  org-chart.html. NOTE: with `config` the page renders only once the fetch resolves, and
                  the file must be deployed BEFORE a puzzle is repointed at it.
      apps        JSON array, url-encoded — the device's app catalog, drawn in order:
                    [{"id":"dnevnik_poziva","icon":"📞","label":{"hr":"Pozivi","en":"Calls"},
                      "screen":"list","rows":[{"icon":"☎️","primary":"…","secondary":"…","meta":"21:40",
                                              "body":"…optional, makes the row tappable…"}]},
                     {"id":"glasovna","icon":"🎙","label":"…","screen":"player","seconds":41,
                      "transcript":["line one","line two"]},
                     {"id":"galerija","icon":"🖼","label":"…","screen":"gallery","gallery":[…]}]
                  `screen` per app: list | note | player | thread | gallery | dialer | contacts | messages.
                  An app may carry its own `gallery`, `contacts` or `thread` array; `list` rows may carry
                  `body` (opens a note) or `thread` (opens bubbles).
                  Every label/primary/secondary/meta/body/transcript entry may be a {en,hr} object.
      owned       Comma-separated app ids the player has unlocked — feed it `{{items}}`. Anything not in
                  the list renders locked. Omit in fixed mode.
      lockApp     App id THIS launch is asking the passcode for. That icon opens the lock screen (and the
                  page boots straight into it); every other locked app only shakes. One launch reports one
                  submission, so it can only ever ask about one lock.
      lockPrompt  decodeURIComponent — the line shown on that lock screen (or per-app `lockPrompt`).
      contacts    JSON array, url-encoded: [{"id":"petra","name":"Petra","number":"091 234 5678",
                                            "note":"…optional; makes the row open as a note…"}, ...]
                  used by the contacts screen, as the dialer's contact-tap prefill source, and (optionally,
                  cosmetic only) as the messages screen's "To:" selector.
      directCall  contacts screen only: "true" → tapping a contact calls immediately instead of opening the dialer
      phrases     JSON array, messages screen only: [{"id":"...", "label":"..."}] (label may be a {en,hr} object)
      freeText    messages screen only: "false" hides the typing box (phrases-only puzzle). Default shown.
      to          messages screen only: contact id (from `contacts`) or plain text — cosmetic "To:" label
      gallery     JSON array, url-encoded: [{"id":"p1","img":"https://…","backImg":"https://…","caption":"…","backCaption":"…"}, ...] — `img` optional;
                  omit it for a placeholder card (add `"emoji":"🏖️"` to customize the placeholder glyph).
      confirmLabel  see above (decodeURIComponent; label may not be a {en,hr} object — plain string only)
      title       header/app title      tag  italic prompt line (decodeURIComponent)      lang  "en" | "hr"
      sessionId / userId  passed straight back in the result payload
    Result (Telegram.WebApp.sendData):
      dialer CALL:            { sessionId, userId, gameId:'android-phone', submission, timestamp }
      contacts (directCall):  { sessionId, userId, gameId:'android-phone', submission, timestamp }
      messages (typed) SEND:  { sessionId, userId, gameId:'android-phone', submission, timestamp }
      messages (phrase tap):  { sessionId, userId, gameId:'android-phone', choice, timestamp }
      lock screen UNLOCK:     { sessionId, userId, gameId:'android-phone', submission, timestamp }
      confirmLabel tap:       { sessionId, userId, gameId:'android-phone', success:true, outcome:'confirmed', timestamp }
      give up:                { sessionId, userId, gameId:'android-phone', success:false, outcome:'abandoned', timestamp }
  -->
  <style>
    :root {
      --bg: #0b0d10; --device: #14161c; --panel: #1a1d24; --ink: #e8e6df; --muted: #8b90a0;
      --accent: #34a853; --accent-dark: #1e7a38; --danger: #ea4335; --shadow: rgba(0,0,0,.5);
      --recv: #262a33; --key: #1e222b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 90% at 50% 0%, #191d26 0%, var(--bg) 65%);
      color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; min-height: 100%;
      padding: 18px 14px 24px; user-select: none;
    }

    .device {
      width: 360px; max-width: 94vw; height: 78vh; max-height: 660px; margin: 0 auto;
      background: var(--device); border-radius: 26px; border: 1px solid #262a33;
      box-shadow: 0 18px 40px var(--shadow), inset 0 1px 0 rgba(255,255,255,.04);
      display: flex; flex-direction: column; overflow: hidden; position: relative;
    }
    .statusbar { display: flex; justify-content: space-between; align-items: center;
      padding: 9px 16px 4px; font-size: 12px; font-weight: 600; color: var(--ink); flex: 0 0 auto; }
    .statusbar .icons { display: flex; align-items: center; gap: 4px; opacity: .85; }

    .apphead { flex: 0 0 auto; padding: 6px 14px 10px; text-align: center; position: relative; }
    .apphead .back {
      position: absolute; left: 8px; top: 2px; width: 34px; height: 34px; border: none; background: none;
      color: var(--accent); font-size: 20px; cursor: pointer; display: none; align-items: center; justify-content: center;
    }
    .apphead .back.show { display: flex; }
    .apphead h1 { font-size: 15px; font-weight: 700; }
    .tag { text-align: center; font-size: 12px; color: var(--muted); font-style: italic; padding: 0 16px 8px; line-height: 1.4; }

    .screen { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
    .screen::-webkit-scrollbar { width: 0; }

    /* Home */
    .applist { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 28px 20px; }
    .appicon { display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; background: none; border: none; color: var(--ink); }
    .appicon .glyph { width: 54px; height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px;
      background: linear-gradient(160deg, #2a2f3a 0%, #20242d 100%); box-shadow: 0 4px 10px rgba(0,0,0,.35); }
    .appicon span { font-size: 11px; color: var(--muted); }
    /* A locked app is SHOWN, not hidden — seeing what you can't open yet is the whole motivation. */
    .appicon.locked .glyph { opacity: .32; filter: grayscale(1); }
    .appicon.locked span { opacity: .5; }
    .appicon .lockbadge { position: absolute; right: -5px; bottom: -3px; font-size: 14px; line-height: 1;
      filter: none; opacity: 1; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
    .appicon .iconwrap { position: relative; display: block; line-height: 0; }
    @keyframes shake { 10%, 90% { transform: translateX(-2px); } 30%, 70% { transform: translateX(4px); } 50% { transform: translateX(-4px); } }
    .appicon.shaking { animation: shake .4s ease; }

    /* List screen — one shape for a call log, a drafts folder, a search history, a calendar */
    .rowlist { display: flex; flex-direction: column; padding: 6px 0 18px; }
    .row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 16px; text-align: left;
      background: none; border: none; border-bottom: 1px solid rgba(255,255,255,.05); color: var(--ink); width: 100%; }
    .row .rglyph { flex: 0 0 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 16px; background: var(--panel); }
    .row .rbody { flex: 1 1 auto; min-width: 0; }
    .row .rprimary { font-size: 14px; font-weight: 600; }
    .row .rsecondary { font-size: 12px; color: var(--muted); margin-top: 2px; word-break: break-word; }
    .row .rmeta { flex: 0 0 auto; font-size: 11px; color: var(--muted); padding-top: 3px; }
    .row.tap { cursor: pointer; }
    .row.tap:active { background: rgba(255,255,255,.04); }

    /* Note / document screen */
    .note { padding: 18px 18px 26px; font-size: 14px; line-height: 1.62; white-space: pre-wrap; word-break: break-word; }
    .note .nmeta { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
    .note i { color: var(--muted); }
    .note code { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px;
      background: #22262f; border-radius: 4px; padding: 1px 4px; }

    /* Agenda (a calendar that looks like one) */
    .agenda { padding: 6px 0 18px; }
    .agday { position: sticky; top: 0; z-index: 2; background: var(--panel);
      padding: 9px 14px 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
      color: var(--muted); border-bottom: 1px solid #22262f; }
    .agday.today { color: var(--accent); }
    .agempty { padding: 10px 14px 12px 78px; font-size: 12px; color: #6b7080; font-style: italic; }
    .agrow { display: flex; gap: 10px; padding: 9px 14px; align-items: stretch; }
    .agtime { flex: 0 0 58px; text-align: right; font-size: 11.5px; color: var(--muted);
      font-variant-numeric: tabular-nums; line-height: 1.35; padding-top: 1px; }
    .agtime b { display: block; color: var(--ink); font-weight: 600; font-size: 12.5px; }
    .agbar { flex: 0 0 3px; border-radius: 2px; background: var(--accent); }
    .agbody { flex: 1 1 auto; min-width: 0; }
    .agtitle { font-size: 13.5px; line-height: 1.35; }
    .agnote { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
    /* A tappable entry is a <button>: strip the UA chrome or it lands as a white box in a dark app. */
    .agrow.tap { cursor: pointer; background: none; border: none; color: inherit; font: inherit;
      text-align: left; width: 100%; -webkit-appearance: none; appearance: none; }
    .agrow.tap:active { background: #1e222b; }

    /* Thread (an SMS conversation, read-only) */
    .thread { display: flex; flex-direction: column; gap: 7px; padding: 14px 12px 20px; }
    .threadsep { align-self: center; font-size: 10.5px; color: var(--muted); padding: 8px 0 3px; letter-spacing: .03em; }
    .bubblerow { display: flex; }
    .bubblerow.them { justify-content: flex-start; }
    .bubblerow.me { justify-content: flex-end; }
    .bubble { max-width: 78%; padding: 9px 12px 7px; border-radius: 16px; font-size: 14px; line-height: 1.5;
      word-break: break-word; white-space: pre-wrap; }
    .bubblerow.them .bubble { background: var(--recv); color: var(--ink); border-bottom-left-radius: 5px; }
    .bubblerow.me .bubble { background: var(--accent-dark); color: #fff; border-bottom-right-radius: 5px; }
    .bubble .btime { display: block; margin-top: 4px; font-size: 10px; color: var(--muted); text-align: right;
      font-variant-numeric: tabular-nums; }
    .bubblerow.me .bubble .btime { color: rgba(255,255,255,.62); }
    .bubble.unsent { border: 1px dashed #4a5262; background: none; color: var(--muted); }

    /* Voice-memo player */
    .player { padding: 26px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .player .playbtn { width: 74px; height: 74px; border-radius: 50%; border: none; cursor: pointer; font-size: 28px;
      background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
    .player .playbtn:disabled { background: var(--key); }
    .wave { display: flex; align-items: center; justify-content: center; gap: 3px; height: 42px; width: 100%; }
    .wave i { display: block; width: 3px; border-radius: 2px; background: var(--key); transition: background .15s, height .15s; }
    .wave i.on { background: var(--accent); }
    .player .elapsed { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
    .transcript { width: 100%; font-size: 14px; line-height: 1.6; white-space: pre-wrap; min-height: 3.2em; }
    .transcript .pending { color: transparent; }

    /* Passcode screen for one locked app */
    .lockwrap { padding: 26px 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    .lockwrap .bigglyph { font-size: 40px; }
    .lockwrap .prompt { font-size: 13px; color: var(--muted); line-height: 1.55; }
    .lockinput { width: 100%; text-align: center; font-size: 19px; letter-spacing: .04em; padding: 12px 10px; border-radius: 12px;
      border: 1px solid #2f3542; background: var(--panel); color: var(--ink); }
    .lockinput:focus { outline: none; border-color: var(--accent); }
    .unlockbtn { width: 100%; padding: 13px; border-radius: 12px; border: none; cursor: pointer; font-size: 15px; font-weight: 600;
      background: var(--accent); color: #fff; }
    .unlockbtn:disabled { background: var(--key); color: var(--muted); }

    /* Dialer */
    .readout-wrap { padding: 20px 20px 6px; text-align: center; }
    .readout { width: 100%; background: none; border: none; color: var(--ink); font-size: 26px; font-weight: 600;
      text-align: center; font-variant-numeric: tabular-nums; letter-spacing: 1px; outline: none;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readout::placeholder { color: var(--muted); font-size: 15px; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 6px 20px; flex: 1 1 auto; align-content: start; }
    .key {
      aspect-ratio: 1.6; border: none; border-radius: 14px; background: var(--key); color: var(--ink);
      font-size: 19px; font-weight: 600; cursor: pointer; transition: background .1s;
    }
    .key:active { background: #2a2f3a; }
    .key .sub { display: block; font-size: 8px; color: var(--muted); letter-spacing: 1px; margin-top: 1px; }
    .dialbar { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 12px 20px 16px; flex: 0 0 auto; }
    .backspace { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; width: 44px; height: 44px; }
    .callbtn {
      width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--accent); color: #fff;
      font-size: 24px; cursor: pointer; box-shadow: 0 6px 16px rgba(52,168,83,.4); transition: transform .07s;
    }
    .callbtn:active { transform: scale(.94); }

    /* Contacts / rows */
    .row {
      display: flex; align-items: center; gap: 11px; padding: 11px 14px; cursor: pointer;
      border-bottom: 1px solid #1f232b; transition: background .1s;
    }
    .row:active { background: #1e222b; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center;
      justify-content: center; font-size: 15px; color: #fff; font-weight: 700; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .rowbody { flex: 1 1 auto; min-width: 0; }
    .rowname { font-size: 14px; font-weight: 700; color: var(--ink); }
    .rownum { font-size: 12px; color: var(--muted); margin-top: 1px; font-family: ui-monospace, monospace; }

    /* Messages */
    .msgto { padding: 12px 14px 0; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
    .chip { flex: 0 0 auto; padding: 6px 12px; border-radius: 20px; background: var(--recv); color: var(--muted);
      font-size: 12.5px; cursor: pointer; border: 1px solid transparent; }
    .chip.active { background: rgba(52,168,83,.16); color: var(--ink); border-color: var(--accent); }
    .phraselist { display: flex; flex-direction: column; gap: 8px; padding: 4px 14px 10px; }
    .phrase { text-align: left; background: var(--recv); color: var(--ink); border: 1px solid #2c313c; border-radius: 12px;
      padding: 11px 13px; font-size: 13.5px; cursor: pointer; line-height: 1.35; }
    .phrase:active { background: #20242d; }
    .composebar { margin-top: auto; display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid #22262f; }
    .composeinput { flex: 1 1 auto; background: var(--recv); border: 1px solid #2c313c; border-radius: 18px; color: var(--ink);
      font-size: 13.5px; padding: 10px 14px; resize: none; max-height: 80px; font-family: inherit; outline: none; }
    .sendbtn { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--accent);
      color: #fff; font-size: 16px; cursor: pointer; }
    .sendbtn:active { transform: scale(.94); }

    /* Gallery */
    .gallerygrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px; }
    .gtile { position: relative; aspect-ratio: 1; border-radius: 11px; overflow: hidden; cursor: pointer;
      background: linear-gradient(160deg, #2a2f3a 0%, #20242d 100%); border: none; padding: 0; }
    .gtile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gtile .glyph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; }
    .gtile .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 5px 4px; font-size: 9px; color: #fff;
      background: linear-gradient(0deg, rgba(0,0,0,.65), transparent); text-align: left; }

    .lightbox { position: absolute; inset: 0; background: rgba(6,7,10,.94); z-index: 15;
      display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .lightbox.show { display: flex; }
    .lightbox .lbclose { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
    .lightbox .lbimg { max-width: 100%; max-height: 60%; border-radius: 10px; object-fit: contain; }
    .lightbox .lbglyph { font-size: 64px; width: 100%; max-width: 220px; aspect-ratio: 1; border-radius: 16px;
      background: linear-gradient(160deg, #2a2f3a 0%, #20242d 100%); display: flex; align-items: center; justify-content: center; }
    .lightbox .lbcap { margin-top: 14px; color: var(--ink); font-size: 13px; text-align: center; max-width: 260px; }
    .lightbox .lbnav { display: flex; align-items: center; gap: 30px; margin-top: 16px; }

    // ------- LIST -------
    // One screen shape for every "rows of text with a timestamp" app a phone has: the call log, the
    // drafts folder, the search history, the calendar, a file manager. A row opens as a note (`body`),
    // as a conversation (`thread`), or as ANOTHER LIST (`rows`) — which is what makes this a file
    // explorer: folders nest to any depth and each level backs out to its parent, not to the home grid.
    function renderList(a, back) {
      const wrap = document.createElement('div'); wrap.className = 'rowlist';
      let drawn = 0;
      (a.rows || []).forEach((r) => {
        // A row may be conditional: `requires` names an id that must be in `owned` for the row to exist.
        // Not dimmed and not padlocked — ABSENT. A padlock advertises that there is something to find;
        // a hidden folder must not, or it isn't hidden.
        if (r.requires && !owned.has(r.requires)) return;
        drawn++;
        const tappable = !!(r.body || r.rows || r.thread || r.img || r.document);
        const row = document.createElement(tappable ? 'button' : 'div');
        row.className = 'row' + (tappable ? ' tap' : '');
        if (tappable) row.type = 'button';
        const g = document.createElement('div'); g.className = 'rglyph'; g.textContent = r.icon || '•';
        const body = document.createElement('div'); body.className = 'rbody';
        const p = document.createElement('div'); p.className = 'rprimary'; p.textContent = loc(r.primary);
        body.appendChild(p);
        if (r.secondary) { const s2 = document.createElement('div'); s2.className = 'rsecondary'; s2.textContent = loc(r.secondary); body.appendChild(s2); }
        row.append(g, body);

        const meta = r.savedAt != null ? loc(r.savedAt)
                   : r.meta != null ? loc(r.meta)

        if (meta) { const m = document.createElement('div'); m.className = 'rmeta'; m.textContent = meta; row.appendChild(m); }
        if (tappable) row.addEventListener('click', () => {
          // Back always returns HERE, one level up, rather than to the home grid — the difference between
          // a file explorer and a set of unrelated screens.
          const backHere = () => renderList(a, back);
          if (r.rows) renderList(r, backHere);
          else if (r.thread) renderThread(r.thread, loc(r.primary), backHere);
          else renderNote({ label: r.primary, meta: r.savedAt || r.meta, body: r.body, img: r.img, document: r.document, qrLink: r.qrLink, qrBounds: r.qrBounds, file: /\.(pdf|docx|csv|md|txt|eml|jpg|png)$/i.test(loc(r.primary)) }, backHere);
        });

      });

      showScreen(wrap, { title: loc(a.label) || loc(a.primary) || S.title, showBack: true });
      if (typeof back === 'function') backBtn.onclick = back;
    }

    // ------- NOTE / document -------
/**
     * Authored markup inside a note body.
     *
     * Everything else on this phone is plain text, but note bodies are written in the same house style
     * as the rest of the game — an italic aside in the narrator's voice — and `textContent` turned
     * every one of those into a literal `<i>` on screen.
     *
     * Escape the whole string first, then re-allow a fixed tag set. NOT innerHTML on authored text:
     * `apps` can arrive from a URL param in another game, and this page must not care who wrote it.
     */
    function richText(el, str) {
      const esc = String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      el.innerHTML = esc.replace(/&lt;(\/?)(i|b|code)&gt;/g, '<$1$2>');
    }

    function renderNote(a, parent) {
      const wrap = document.createElement('div'); wrap.className = 'note' + (a.file ? ' document' : '');
      const safeAsset = (value) => {
        try { const u = new URL(loc(value), window.location.href); return ['http:', 'https:'].includes(u.protocol) ? u.href : null; } catch { return null; }
      };
      if (a.img && safeAsset(a.img)) {
        const img = document.createElement('img'); img.className = 'fileimage'; img.src = safeAsset(a.img); img.alt = loc(a.label);
        const full = document.createElement('div'); full.className='filepreview';
        const imageLink=document.createElement('a');imageLink.href=img.src;imageLink.target='_blank';imageLink.rel='noopener noreferrer';imageLink.appendChild(img);full.appendChild(imageLink);
        if(a.qrLink && a.qrBounds && safeAsset(a.qrLink)) { const qr=document.createElement('a');qr.className='receiptqr';qr.href=safeAsset(a.qrLink);qr.target='_blank';qr.rel='noopener noreferrer';qr.setAttribute('aria-label','QR');for(const k of ['left','top','width','height'])qr.style[k]=a.qrBounds[k]+'%';full.appendChild(qr); }
        img.onerror = () => { img.remove(); const error = document.createElement('p'); error.textContent = S.fileError; wrap.prepend(error); }; wrap.appendChild(full);
      }
      if (a.document && safeAsset(a.document)) {
        const link = document.createElement('a'); link.className = 'filedownload'; link.href = safeAsset(a.document); link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = S.openFile; wrap.appendChild(link);
      }
      if (a.meta) { const m = document.createElement('div'); m.className = 'nmeta'; m.textContent = loc(a.meta); wrap.appendChild(m); }
      const b = document.createElement('div'); richText(b, loc(a.body)); wrap.appendChild(b);
      showScreen(wrap, { title: loc(a.label) || S.title, showBack: true });
      // A note reached from somewhere other than home goes BACK there, not to the grid: from a list row
      // to its list, from a contact card to the phonebook. `parent` is either the app to re-render or a
      // plain function for callers whose "back" isn't a list.
      if (typeof parent === 'function') backBtn.onclick = parent;
      else if (parent) backBtn.onclick = () => renderList(parent);
    }

    function renderWeek(a, back, start) {
      const first=new Date(start+'T12:00:00Z');

      const dayAt=n=>new Date(first.getTime()+n*86400000);
      const wrap=document.createElement('div');wrap.className='week';
      const bar=document.createElement('div');bar.className='weektoolbar';
      const previous=document.createElement('button');previous.textContent='‹';previous.setAttribute('aria-label',S.previousWeek);
      const next=document.createElement('button');next.textContent='›';next.setAttribute('aria-label',S.nextWeek);
      const title=document.createElement('strong');title.textContent=first.toLocaleDateString(lang,{month:'long',year:'numeric',timeZone:'UTC'});
      previous.onclick=()=>renderWeek(a,back,dateKey(dayAt(-7)));next.onclick=()=>renderWeek(a,back,dateKey(dayAt(7)));const schedule=document.createElement('button');schedule.className='schedule-toggle';schedule.textContent=lang==='hr'?'Raspored':'Schedule';schedule.onclick=()=>renderAgenda({...a,weekStart:null},()=>renderWeek(a,back,start));bar.append(previous,title,schedule,next);
      const scroll=document.createElement('div');scroll.className='weekscroll';
      const head=document.createElement('div');head.className='weekhead';head.appendChild(document.createElement('span'));
      const grid=document.createElement('div');grid.className='weekbody';
      for(let hour=0;hour<24;hour++){const tick=document.createElement('span');tick.className='weekhour';tick.style.top=(hour*40)+'px';tick.textContent=String(hour).padStart(2,'0')+':00';grid.appendChild(tick);}
      for(let day=0;day<7;day++){
        const date=dayAt(day);const data=(a.days||[]).find(d=>d.date===dateKey(date));

        label.append(document.createTextNode(date.toLocaleDateString(lang,{weekday:'short',timeZone:'UTC'})));const num=document.createElement('b');num.textContent=String(date.getUTCDate());label.appendChild(num);head.appendChild(label);
        const line=document.createElement('div');line.className='weekline';line.style.left=(day*100/7)+'%';grid.appendChild(line);

        });

    // ------- AGENDA (a calendar) -------
    // `days: [{ label, today?, entries: [{ from, to?, title, note?, color?, repeat?, body? }] }]`.
    // A day with no entries still draws its header and says so — an empty evening is information in a
    // game about a week somebody did not finish. An entry carrying `body` opens as a note.
    function renderAgenda(a, back) {

      (a.days || []).forEach((d) => {

            ));

    // ------- THREAD (one SMS conversation, read-only) -------
    // A conversation you READ, as distinct from the `messages` screen, which is a conversation you WRITE.
    // Reports nothing on its own — pair it with `confirmLabel` when a puzzle needs an "I read it" beat.
    // Entries: { from: "me" | "them", text, time } and { sep: "…" } for a date divider. An entry marked
    // `unsent: true` draws as a dashed ghost bubble — the message that was typed and never sent.
    function renderThread(entries, title, back) {
      const wrap = document.createElement('div'); wrap.className = 'thread';
      (entries || []).filter((m) => !m.requires || owned.has(m.requires)).forEach((m) => {
        if (m.sep) {
          const sep = document.createElement('div'); sep.className = 'threadsep'; sep.textContent = loc(m.sep);

        }

        row.className = 'bubblerow ' + (m.from === 'me' ? 'me' : 'them');
        const b = document.createElement('div'); b.className = 'bubble' + (m.unsent ? ' unsent' : '');
        const txt = document.createElement('div'); txt.textContent = loc(m.text); b.appendChild(txt);
        if (m.time || m.status) { const tm=document.createElement('span');tm.className='btime';if(m.time){const clock=document.createElement('span');clock.textContent=loc(m.time);tm.append(clock)}const state=deliveryState(m.status);if(state&&state.glyph){const ticks=document.createElement('span');ticks.className='ticks '+state.cls;ticks.textContent=state.glyph;ticks.title=state.label;ticks.setAttribute('aria-label',state.label);tm.append(ticks)}b.appendChild(tm); }
        row.appendChild(b); wrap.appendChild(row);

    // ------- PLAYER (voice memo) -------
    // Deliberately paced: the transcript reveals line by line as it "plays", because a recording you
    // have to sit through lands differently from a wall of text you can skim in a second.
    function renderPlayer(a, back) {
      const wrap = document.createElement('div'); wrap.className = 'player';
      const btn = document.createElement('button'); btn.className = 'playbtn'; btn.textContent = '▶';
      const wave = document.createElement('div'); wave.className = 'wave';
      const BARS = 44;
      for (let i = 0; i < BARS; i++) {
        const bar = document.createElement('i');
        // A fixed pseudo-random profile, so the waveform looks like audio and not like a bar chart.
        bar.style.height = `${8 + ((Math.sin(i * 1.7) + Math.sin(i * 0.6)) + 2) * 8}px`;
        wave.appendChild(bar);
      }
      const elapsed = document.createElement('div'); elapsed.className = 'elapsed';
      const lines = Array.isArray(a.transcript) ? a.transcript : (a.transcript ? [a.transcript] : []);
      // `seconds` is the recording's FICTIONAL length — what the counter shows. `playSeconds` is how
      // long the player actually sits there, capped by default: a 0:41 memo that really takes 41
      // seconds to get through is honest and unplayable inside a Telegram sheet. The counter still
      // runs 0:00 → 0:41, just faster than real time.
      const total = Number(a.seconds) || Math.max(6, lines.length * 3);
      const playFor = Number(a.playSeconds) || Math.min(total, 14);
      const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
      elapsed.textContent = `0:00 / ${fmt(total)}`;
      const tr = document.createElement('div'); tr.className = 'transcript';
      const spans = lines.map((l) => { const s = document.createElement('div'); s.className = 'pending'; s.textContent = loc(l); tr.appendChild(s); return s; });
      wrap.append(btn, wave, elapsed, tr);

      let t = 0, timer = null;
      btn.addEventListener('click', () => {
        if (timer) return;
        haptic('tick');
        timer = setInterval(() => {
          t += 0.25;
          const frac = Math.min(1, t / playFor);
          elapsed.textContent = `${fmt(frac * total)} / ${fmt(total)}`;
          wave.querySelectorAll('i').forEach((bar, i) => bar.classList.toggle('on', i / BARS <= frac));
          // First line lands early — a blank screen for the opening third reads as a broken player,
          // not as suspense.
          spans.forEach((s, i) => { if (frac >= (i + 0.35) / spans.length) s.classList.remove('pending'); });
          if (frac >= 1) { clearInterval(timer); timer = null; btn.textContent = '↻'; spans.forEach((s) => s.classList.remove('pending')); t = 0; }
        }, 250);
      });
      showScreen(wrap, { title: loc(a.label) || S.title, showBack: true });
      if (typeof back === 'function') backBtn.onclick = back;
    }

    // ------- LOCK (passcode for one app) -------
    // Server-authoritative like every other input here: the page never receives the passcode, it reports
    // what the player typed and the engine grades it exactly as it would a typed in-chat answer.
    function renderLock(a) {
      const wrap = document.createElement('div'); wrap.className = 'lockwrap';
      const glyph = document.createElement('div'); glyph.className = 'bigglyph'; glyph.textContent = a.icon || '🔒';
      const prompt = document.createElement('div'); prompt.className = 'prompt';
      prompt.textContent = lockPrompt || loc(a.lockPrompt) || '';
      const input = document.createElement('input'); input.className = 'lockinput'; input.type = 'text';
      input.autocomplete = 'off'; input.autocapitalize = 'none'; input.spellcheck = false;
      input.inputMode = a.lockMode === 'numeric' ? 'numeric' : 'text';
      const go = document.createElement('button'); go.className = 'unlockbtn'; go.textContent = S.unlock; go.disabled = true;
      input.addEventListener('input', () => { go.disabled = !input.value.trim(); });
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !go.disabled) go.click(); });
      go.addEventListener('click', () => {
        if (solved) return;
        const text = input.value.trim(); if (!text) return;
        solved = true; haptic('ok');
        send({ submission: text });
        setTimeout(() => showOverlay('sent'), 300);
      });
      wrap.append(glyph, prompt, input, go);
      showScreen(wrap, { title: loc(a.label) || S.title, showBack: true });
      setTimeout(() => input.focus(), 60);
    }

    // ------- GALLERY (pure viewer — never reports on its own) -------
    // A catalog app may carry its OWN roll (`renderGallery(a.gallery, …)`); with no arguments this is
    // the top-level `gallery` param, exactly as before.
    let shownGallery = gallery;
    function renderGallery(roll, title) {

      const grid = document.createElement('div'); grid.className = 'gallerygrid';
      shownGallery.forEach((g, i) => {
        const tile = document.createElement('button'); tile.className = 'gtile'; tile.type = 'button';

        } else {

        }
        if (g.caption) { const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = loc(g.caption); tile.appendChild(cap); }
        tile.addEventListener('click', () => openLightbox(i));

      });
      showScreen(grid, { title: title || S.gallery, showBack: true });
    }

    let lbIndex = 0;

      const g = shownGallery[lbIndex];

      if (src) { const img = document.createElement('img'); img.className = 'lbimg'; img.src = src; media.appendChild(img); }
      else { const glyph = document.createElement('div'); glyph.className = 'lbglyph'; glyph.textContent = g.emoji || '🖼️'; media.appendChild(glyph); }
      document.getElementById('lbcap').textContent = lbShowingBack && g.backCaption ? loc(g.backCaption) : (g.caption ? loc(g.caption) : '');
      flip.hidden = !g.backImg;

    document.getElementById('lbprev').addEventListener('click', () => { lbIndex = (lbIndex - 1 + shownGallery.length) % shownGallery.length; lbShowingBack = false; renderLightbox(); haptic('tick'); });
    document.getElementById('lbflip').addEventListener('click', () => { lbShowingBack = !lbShowingBack; renderLightbox(); haptic('tick'); });
    document.getElementById('lbnext').addEventListener('click', () => { lbIndex = (lbIndex + 1) % shownGallery.length; lbShowingBack = false; renderLightbox(); haptic('tick'); });

    const sudokuSolution=[1,2,3,4,5,6,4,5,6,1,2,3,2,3,4,5,6,1,5,6,1,2,3,4,3,4,5,6,1,2,6,1,2,3,4,5];
    const sudokuGiven={0:1,2:3,5:6,7:5,9:1,12:2,16:6,19:6,22:3,25:4,28:1,30:6,33:3,35:5};

    function renderSudoku(a) {
      const st=sudokuState, wrap=document.createElement('div');wrap.className='sudoku';const hero=document.createElement('header');hero.className='sudokuhero';hero.innerHTML='<strong>MINI SUDOKU</strong><span>'+(lang==='hr'?'Dnevni izazov · 1–6':'Daily challenge · 1–6')+'</span><div class="sudokuprogress"><i></i></div>';const progress=hero.querySelector('i');

      const intro=document.createElement('p');intro.textContent=lang==='hr'?'Svaki redak, stupac i okvir 2×3 sadrži brojeve 1–6 bez ponavljanja.':'Every row, column and 2×3 box contains 1–6 with no repeats.';
      const grid=document.createElement('div');grid.className='sudokugrid';const cells=[];
      const related=(i,j)=>Math.floor(i/6)===Math.floor(j/6)||i%6===j%6||(Math.floor(i/12)===Math.floor(j/12)&&Math.floor((i%6)/3)===Math.floor((j%6)/3));
      const draw=()=>{progress.style.width=(st.values.filter(Boolean).length/36*100)+'%';cells.forEach((b,i)=>{b.replaceChildren();b.classList.toggle('selected',st.selected===i);b.classList.toggle('related',st.selected!==null&&related(i,st.selected));b.classList.toggle('same',st.selected!==null&&st.values[i]&&st.values[i]===st.values[st.selected]);if(st.values[i])b.textContent=st.values[i];else if(st.notes[i].size){const n=document.createElement('span');n.className='cellnotes';for(let x=1;x<=6;x++)n.append(Object.assign(document.createElement('i'),{textContent:st.notes[i].has(x)?x:''}));b.append(n)}});remaining.forEach((b,n)=>{const count=st.values.filter(v=>v===n+1).length;b.querySelector('small').textContent=String(6-count)})};
      for(let i=0;i<36;i++){const b=document.createElement('button');b.className=sudokuGiven[i]?'fixed':'';b.disabled=Boolean(sudokuGiven[i]);b.onclick=()=>{st.selected=i;draw()};cells.push(b);grid.append(b)}
      const remaining=[];const keypad=document.createElement('div');keypad.className='sudokupad';for(let n=1;n<=6;n++){const b=document.createElement('button');b.innerHTML=n+'<small></small>';b.onclick=()=>place(n);remaining.push(b);keypad.append(b)}
      const tools=document.createElement('div');tools.className='sudokutools';const tool=(hr,en,icon,fn)=>{const b=document.createElement('button');const glyph=document.createElement('span');glyph.textContent=icon;const label=document.createElement('small');label.textContent=lang==='hr'?hr:en;b.append(glyph,label);b.onclick=fn;tools.append(b);return b};
      const note=tool('Bilješke','Notes','\u270e',()=>{st.noteMode=!st.noteMode;note.classList.toggle('active',st.noteMode)});
      tool('Poništi','Undo','\u21b6',()=>{const h=st.history.pop();if(h){st.values[h.i]=h.value;st.notes[h.i]=new Set(h.notes);st.selected=h.i;draw()}});
      tool('Izbriši','Erase','\u232b',()=>{if(st.selected===null||sudokuGiven[st.selected])return;const i=st.selected;st.history.push({i,value:st.values[i],notes:[...st.notes[i]]});st.values[i]=0;st.notes[i].clear();draw()});
      tool('Očisti','Clear','\u27f3',()=>{for(let i=0;i<36;i++)if(!sudokuGiven[i]){st.values[i]=0;st.notes[i].clear()}st.history=[];st.mistakes=0;st.started=Date.now();st.done=false;updateStats();draw()});
      tool('Pomoć','Hint','\u2726',()=>{const i=st.values.findIndex((v,j)=>!sudokuGiven[j]&&v!==sudokuSolution[j]);if(i>=0){st.history.push({i,value:st.values[i],notes:[...st.notes[i]]});st.values[i]=sudokuSolution[i];st.notes[i].clear();st.selected=i;st.hints++;draw();updateStats();check()}});
      const status=document.createElement('p');status.className='sudokustatus';
      function place(n){const i=st.selected;if(i===null||sudokuGiven[i]||st.done)return;st.history.push({i,value:st.values[i],notes:[...st.notes[i]]});if(st.noteMode){if(st.notes[i].has(n))st.notes[i].delete(n);else st.notes[i].add(n);st.values[i]=0}else{st.notes[i].clear();st.values[i]=n;if(n!==sudokuSolution[i]){st.mistakes++;cells[i].animate([{background:'#f8d7da'},{background:''}],{duration:500})}}draw();updateStats();check()}
      function check(){if(st.values.every((v,i)=>v===sudokuSolution[i])){st.done=true;status.textContent=(lang==='hr'?'Riješeno za ':'Solved in ')+timer.textContent+(lang==='hr'?'.':'.');haptic('ok')}}
      wrap.append(hero,stats,intro,grid,keypad,tools,status);showScreen(wrap,{title:loc(a.label),showBack:true});backBtn.onclick=renderHome;draw();check();
    }

    const calculatorRuntime=[];
    function renderCalculator(a) {
      const wrap=document.createElement('div');wrap.className='calculator';const tape=document.createElement('div');tape.className='calctape';const history=document.createElement('div');history.className='calchistory';const display=document.createElement('output');display.className='calcdisplay';let current='0',stored=null,operator=null,fresh=true,memory=0;
      const show=()=>display.textContent=current;const number=()=>Number(current.replace(',','.'));
      const calculate=()=>{if(stored===null||!operator)return number();const b=number(),ops={'+':(a,b)=>a+b,'−':(a,b)=>a-b,'×':(a,b)=>a*b,'÷':(a,b)=>b===0?NaN:a/b};return ops[operator](stored,b)};
      const setValue=v=>{current=Number.isFinite(v)?String(Math.round((v+Number.EPSILON)*1e12)/1e12).replace('.',','):'Greška';fresh=true;show()};const drawTape=()=>{tape.replaceChildren();const h=document.createElement('h3');h.textContent=lang==='hr'?'Povijest':'History';tape.append(h);for(const x of [...calculatorRuntime,...(a.history||[]).filter(x=>!x.requires||owned.has(x.requires))]){const p=document.createElement('p');if(x.requires)p.className='storycalc';const ex=document.createElement('span');ex.textContent=loc(x.expression);const tm=document.createElement('time');tm.textContent=loc(x.time);p.append(ex,tm);tape.append(p)}};
      const press=k=>{if(/^\d$/.test(k)){if(fresh||current==='0'||current==='Greška'){current=k;fresh=false}else if(current.replace(/[-,]/g,'').length<14)current+=k;show();return}if(k===','){if(fresh||current==='Greška'){current='0,';fresh=false}else if(!current.includes(','))current+=',';show();return}if(k==='C'){current='0';stored=null;operator=null;fresh=true;history.textContent='';show();return}if(k==='⌫'){if(!fresh){current=current.length>1?current.slice(0,-1):'0';show()}return}if(k==='±'){if(current!=='0'&&current!=='Greška')current=current.startsWith('-')?current.slice(1):'-'+current;show();return}if(k==='%'){setValue(number()/100);return}if(k==='MC'){memory=0;return}if(k==='MR'){setValue(memory);return}if(k==='M+'||k==='M−'){memory+=(k==='M+'?1:-1)*number();fresh=true;return}if(['+','−','×','÷'].includes(k)){if(operator&&!fresh){const v=calculate();setValue(v);stored=v}else stored=number();operator=k;fresh=true;history.textContent=current+' '+k;return}if(k==='='){if(!operator)return;const equation=history.textContent+' '+current+' =';const v=calculate();setValue(v);history.textContent=equation;calculatorRuntime.unshift({expression:equation+' '+current,time:new Date().toLocaleTimeString(lang,{hour:'2-digit',minute:'2-digit'})});drawTape();stored=null;operator=null}};
      const pad=document.createElement('div');pad.className='calcpad';['MC','MR','M+','M−','C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0',',','='].forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=['MC','MR','M+','M−'].includes(k)?'memory':['C','⌫','%','±'].includes(k)?'utility':['÷','×','−','+','='].includes(k)?'operator':'';b.onclick=()=>press(k);pad.append(b)});wrap.append(tape,history,display,pad);drawTape();showScreen(wrap,{title:loc(a.label),showBack:true});backBtn.onclick=renderHome;show();
    }

    const alarmEnabled=new Map();
    function renderClock(a) {
      const wrap=document.createElement('div');wrap.className='clockapp';const tabs=document.createElement('div');tabs.className='clocktabs';const body=document.createElement('div');body.className='clockbody';let cleanup=()=>{};
      const open=(id)=>{cleanup();body.replaceChildren();[...tabs.children].forEach(b=>b.classList.toggle('active',b.dataset.id===id));if(id==='alarms')renderAlarms();if(id==='world')renderWorld();if(id==='stopwatch')renderStopwatch();if(id==='timer')renderTimer()};
      [['alarms','Alarm','Alarm'],['world','Svijet','World clock'],['stopwatch','Štoperica','Stopwatch'],['timer','Odbrojavanje','Countdown']].forEach(([id,hr,en])=>{const b=document.createElement('button');b.dataset.id=id;b.textContent=lang==='hr'?hr:en;b.onclick=()=>open(id);tabs.append(b)});
      const renderAlarms=()=>{(a.alarms||[]).forEach((x,i)=>{if(!alarmEnabled.has(i))alarmEnabled.set(i,x.enabled);const row=document.createElement('label');row.className='alarmrow';const info=document.createElement('span');info.innerHTML='<b>'+x.time+'</b><small>'+loc(x.label)+' · '+loc(x.days)+'</small>';const toggle=document.createElement('input');toggle.type='checkbox';toggle.checked=alarmEnabled.get(i);toggle.onchange=()=>alarmEnabled.set(i,toggle.checked);row.append(info,toggle);body.append(row)})};
      const renderWorld=()=>{const list=[['Zagreb','Europe/Zagreb'],['London','Europe/London'],['New York','America/New_York'],['Tokyo','Asia/Tokyo']];const draw=()=>{body.replaceChildren();for(const [city,zone]of list){const row=document.createElement('div');row.className='worldrow';row.innerHTML='<b>'+city+'</b><time>'+new Date().toLocaleTimeString(lang,{timeZone:zone,hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</time>';body.append(row)}};draw();const t=setInterval(draw,1000);cleanup=()=>clearInterval(t)};
      const renderStopwatch=()=>{let elapsed=0,start=0,timerId=null,laps=[];const out=document.createElement('output');out.className='bigtime';const lapbox=document.createElement('div');const draw=()=>out.textContent=new Date(elapsed+(timerId?performance.now()-start:0)).toISOString().slice(14,22);draw();const controls=document.createElement('div');controls.className='clockcontrols';const make=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;controls.append(b)};make(lang==='hr'?'Pokreni / pauza':'Start / pause',()=>{if(timerId){elapsed+=performance.now()-start;clearInterval(timerId);timerId=null}else{start=performance.now();timerId=setInterval(draw,31)}draw()});make(lang==='hr'?'Krug':'Lap',()=>{if(!timerId)return;laps.unshift(out.textContent);lapbox.innerHTML=laps.map((x,i)=>'<p>'+(lang==='hr'?'Krug ':'Lap ')+(laps.length-i)+' <b>'+x+'</b></p>').join('')});make(lang==='hr'?'Poništi':'Reset',()=>{elapsed=0;start=performance.now();laps=[];lapbox.replaceChildren();draw()});body.append(out,controls,lapbox);cleanup=()=>timerId&&clearInterval(timerId)};
      const renderTimer=()=>{let remain=300000,end=0,timerId=null;const out=document.createElement('output');out.className='bigtime';const draw=()=>{if(timerId)remain=Math.max(0,end-Date.now());out.textContent=new Date(remain).toISOString().slice(14,19);if(!remain&&timerId){clearInterval(timerId);timerId=null;haptic('ok')}};const presets=document.createElement('div');presets.className='timerpresets';[1,5,10,20].forEach(n=>{const b=document.createElement('button');b.textContent=n+' min';b.onclick=()=>{if(timerId)clearInterval(timerId);timerId=null;remain=n*60000;draw()};presets.append(b)});const controls=document.createElement('div');controls.className='clockcontrols';const startBtn=document.createElement('button');startBtn.textContent=lang==='hr'?'Pokreni / pauza':'Start / pause';startBtn.onclick=()=>{if(timerId){remain=Math.max(0,end-Date.now());clearInterval(timerId);timerId=null}else if(remain){end=Date.now()+remain;timerId=setInterval(draw,250)}draw()};const reset=document.createElement('button');reset.textContent=lang==='hr'?'Poništi':'Reset';reset.onclick=()=>{if(timerId)clearInterval(timerId);timerId=null;remain=300000;draw()};controls.append(startBtn,reset);body.append(out,presets,controls);draw();cleanup=()=>timerId&&clearInterval(timerId)};
      wrap.append(tabs,body);showScreen(wrap,{title:loc(a.label),showBack:true});backBtn.onclick=()=>{cleanup();renderHome()};open('alarms');
    }

    // ------- DIALER -------
    function renderDialer() {
      const wrap = document.createElement('div'); wrap.style.display = 'flex'; wrap.style.flexDirection = 'column'; wrap.style.flex = '1';
      const readoutWrap = document.createElement('div'); readoutWrap.className = 'readout-wrap';
      const input = document.createElement('input');
      input.className = 'readout'; input.type = 'tel'; input.inputMode = 'tel'; input.placeholder = '';
      input.value = dialerPrefill; dialerPrefill = '';
      readoutWrap.appendChild(input);

      const pad = document.createElement('div'); pad.className = 'keypad';
      const keys = [['1', ''], ['2', 'ABC'], ['3', 'DEF'], ['4', 'GHI'], ['5', 'JKL'], ['6', 'MNO'], ['7', 'PQRS'], ['8', 'TUV'], ['9', 'WXYZ'], ['*', ''], ['0', '+'], ['#', '']];
      keys.forEach(([k, sub]) => {
        const b = document.createElement('button'); b.className = 'key'; b.type = 'button';
        b.innerHTML = k + (sub ? `<span class="sub">${sub}</span>` : '');
        // Deliberately NOT calling input.focus() here: on a real device this would pop the software
        // keyboard over the custom keypad on every tap. Typing still works fully — the field just doesn't
        // grab focus (and the keyboard) until the player deliberately taps into it themselves.
        b.addEventListener('click', () => { input.value += k; haptic('tick'); });
        pad.appendChild(b);
      });

      const bar = document.createElement('div'); bar.className = 'dialbar';
      const back = document.createElement('button'); back.className = 'backspace'; back.type = 'button'; back.textContent = '⌫';
      back.addEventListener('click', () => { input.value = input.value.slice(0, -1); haptic('tick'); });
      const call = document.createElement('button'); call.className = 'callbtn'; call.type = 'button'; call.textContent = '📞';
      call.addEventListener('click', () => {
        if (solved) return;
        solved = true; haptic('ok');
        send({ submission: input.value });
        setTimeout(() => showOverlay('sent'), 400);
      });
      bar.append(back, call);

      wrap.append(readoutWrap, pad, bar);
      showScreen(wrap, { title: S.call, showBack: true });
      // no auto-focus on entry either, for the same reason — landing on this screen shouldn't pop the
      // keyboard unasked; the player can tap the readout directly whenever they want to type.
    }

    // ------- CONTACTS -------
    // A catalog app may carry its OWN phonebook (`a.contacts`), exactly as a gallery app carries its own
    // roll; with no argument this is the top-level `contacts` param, as before. A contact with a `note`
    // opens that note instead of dialling — which turns the screen from "look the number up and call it"
    // into a phonebook you READ, the shape a found phone actually wants.
    function renderContacts(roll, title) {
      const book = Array.isArray(roll) && roll.length ? roll : contacts;
      const list = document.createElement('div');
      const search=document.createElement('input');search.type='search';search.className='booksearch';search.placeholder=S.searchContacts;search.setAttribute('aria-label',S.searchContacts);list.appendChild(search);search.oninput=()=>{for(const row of list.querySelectorAll('.row'))row.hidden=!row.textContent.toLocaleLowerCase(lang).includes(search.value.toLocaleLowerCase(lang));};
      if (!book.length) { const empty = document.createElement('div'); empty.className = 'tag'; empty.textContent = S.noContacts; list.appendChild(empty); }
      book.forEach((c) => {
        const row = document.createElement('button'); row.type='button'; row.className = 'row';
        const av = document.createElement('div'); av.className = 'avatar'; av.style.background = c.color || colorFor(c.id);
        const photo=loc(c.photo);if(photo){av.classList.add('contactphoto');const pic=document.createElement('img');pic.src=photo;pic.alt='';av.append(pic)}else av.textContent = ((loc(c.name) || loc(c.number))[0] || '#').toUpperCase();
        const body = document.createElement('div'); body.className = 'rowbody';
        const name = document.createElement('div'); name.className = 'rowname'; name.textContent = loc(c.name) || loc(c.number);
        const num = document.createElement('div'); num.className = 'rownum'; num.textContent = loc(c.number);
        body.append(name, num);
        row.append(av, body);
        row.addEventListener('click', () => {
          if (directCall) {
            if (solved) return;
            solved = true; haptic('ok');
            send({ submission: c.id });
            setTimeout(() => showOverlay('sent'), 400);
          } else if (c.note) {
            renderNote({ label: loc(c.name) || loc(c.number), meta: c.number, body: c.note, img: c.photo }, () => renderContacts(roll, title));
          } else {
            dialerPrefill = c.number || '';
            renderDialer();
          }
        });
        list.appendChild(row);
      });
      showScreen(list, { title: title || S.contacts, showBack: true });
    }

    // ------- MESSAGES -------
    function renderMessages() {
      const wrap = document.createElement('div'); wrap.style.display = 'flex'; wrap.style.flexDirection = 'column'; wrap.style.flex = '1';

      let activeContact = null;
      const toParam = q.get('to');
      if (contacts.length) activeContact = contacts.find((c) => c.id === toParam) || contacts[0];

      if (contacts.length > 1) {
        const toWrap = document.createElement('div'); toWrap.className = 'msgto';
        const label = document.createElement('div'); label.className = 'tag'; label.style.padding = '0 0 4px'; label.style.textAlign = 'left'; label.textContent = S.to + ':';
        const chips = document.createElement('div'); chips.className = 'chips';
        contacts.forEach((c) => {
          const chip = document.createElement('div'); chip.className = 'chip' + (c.id === activeContact.id ? ' active' : '');
          chip.textContent = loc(c.name);
          chip.addEventListener('click', () => { activeContact = c; [...chips.children].forEach((el) => el.classList.remove('active')); chip.classList.add('active'); });
          chips.appendChild(chip);
        });
        toWrap.append(label, chips);
        wrap.appendChild(toWrap);
      } else if (activeContact) {
        const label = document.createElement('div'); label.className = 'msgto tag'; label.style.textAlign = 'left';
        label.textContent = S.to + ': ' + loc(activeContact.name);
        wrap.appendChild(label);
      }

      if (Array.isArray(phrases) && phrases.length) {
        const list = document.createElement('div'); list.className = 'phraselist';
        phrases.forEach((ph) => {
          const b = document.createElement('button'); b.className = 'phrase'; b.textContent = loc(ph.label);
          b.addEventListener('click', () => {
            if (solved) return;
            solved = true; haptic('ok');
            send({ choice: ph.id });
            setTimeout(() => showOverlay('sent'), 400);
          });
          list.appendChild(b);
        });
        wrap.appendChild(list);
      }

      if (freeText) {
        const bar = document.createElement('div'); bar.className = 'composebar';
        const ta = document.createElement('textarea'); ta.className = 'composeinput'; ta.rows = 1; ta.placeholder = S.typeMsg;
        const send_ = document.createElement('button'); send_.className = 'sendbtn'; send_.textContent = '➤';
        send_.addEventListener('click', () => {
          if (solved) return;
          const text = ta.value.trim(); if (!text) return;
          solved = true; haptic('ok');
          send({ submission: text });
          setTimeout(() => showOverlay('sent'), 400);
        });
        bar.append(ta, send_);
        wrap.appendChild(bar);
      }

      showScreen(wrap, { title: S.messages, showBack: true });
    }

    // ------- Boot -------
    // `screen` deep-links into one screen, as before. With an `apps` catalog the home grid IS the point,
    // so the default lands there; and when a lock puzzle launched us (`lockApp`) we go straight to that
    // app's passcode screen — the player already knows which door they are at, and making them hunt for
    // the icon first would be friction, not atmosphere. Back still returns to the grid.
    const initial = q.get('screen');
    const lockTarget = lockApp ? apps.find((a) => a.id === lockApp) : null;
    if (initial === 'dialer') renderDialer();
    else if (initial === 'contacts') renderContacts();
    else if (initial === 'messages') renderMessages();
    else if (initial === 'gallery') renderGallery();
    else if (initial === 'home' || !initial) { renderHome(); if (lockTarget && !owned.has(lockTarget.id)) renderLock(lockTarget); }
    else {
      // `screen` may also name a catalog app id — a puzzle that wants to open straight into one.
      const target = apps.find((a) => a.id === initial);
      if (target) openApp(target); else renderHome();
    }

    // test hook
    window.__androidPhone = {
      renderHome, renderDialer, renderContacts, renderMessages, renderGallery, openLightbox,
      renderList, renderNote, renderPlayer, renderLock, renderThread, openApp,
      state: () => ({ apps, owned: [...owned], lockApp }),
    };
  })();
  </script>
</body>
