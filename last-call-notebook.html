<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Notebook</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#30251d;--paper:#f5edda;--line:#d7c7a8;--red:#b35142;--cover:#36554d;--cover2:#1d332e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#141b1a;color:#eee;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:16px}.book{width:min(390px,100%);min-height:620px;position:relative}.page,.cover{min-height:575px;border-radius:8px;box-shadow:0 18px 42px #0008;overflow:hidden}.cover{background:linear-gradient(140deg,var(--cover),var(--cover2));border:1px solid #10251f;display:grid;place-content:center;text-align:center;padding:36px;color:#eadbb8;position:relative}.cover:before{content:"";position:absolute;inset:12px;border:1px solid #c8ad71aa;border-radius:3px}.cover h1{font:700 30px Georgia,serif;margin:0;letter-spacing:.04em}.cover p{font:italic 15px Georgia,serif;color:#c9b78f}.cover button{margin-top:90px}.page{background:repeating-linear-gradient(var(--paper),var(--paper) 29px,var(--line) 30px);color:var(--ink);padding:27px 27px 48px;font:16px/1.65 Georgia,serif;position:relative}.page:before{content:"";position:absolute;top:0;bottom:0;left:31px;border-left:1px solid #d9877c88}.page>*{position:relative;margin-left:14px}.meta{font:12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.09em;color:#88755f}.page h2{font-size:22px;margin-top:8px;line-height:1.15}.page p{white-space:pre-line}.page .red{color:var(--red);font-style:italic}.page .strike{text-decoration:line-through;color:#766c61}.page .pageNo{position:absolute;right:20px;bottom:13px;color:#876;font:12px system-ui}.nav{margin-top:14px;display:flex;justify-content:space-between;align-items:center}.nav button,.cover button,.action{border:0;border-radius:10px;padding:12px 16px;background:#e3d2ae;color:#3a2b1e;font-weight:700;cursor:pointer}.nav button{background:#334c45;color:#fff}.nav button:disabled{opacity:.35}.nav small{color:#b9b2a5}.insert{background:#fff9e9;border:1px dashed #b19262;padding:14px;box-shadow:2px 3px 5px #7654;transform:rotate(-1deg)}.hidden{display:none}.crease{border-top:2px dashed #ae8b67;margin:20px 0 8px;transform:rotate(-12deg)}.hiddenPath{display:none}.folded .hiddenPath{display:block}.folded .foldBtn{display:none}.caption{font-size:13px;color:#766653}.bookmark{display:inline-block;background:#d4b26e;padding:2px 8px;font:12px system-ui;color:#332716}.notice{margin-top:8px;font:13px system-ui;color:#ddc997;min-height:20px}.gridmark{display:block;width:154px;height:154px;margin:22px auto}.gridmark .guide{stroke:#50483d;stroke-width:1.4;fill:none;opacity:.68}.gridmark .route{stroke:#b34f42;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.gridmark circle{fill:#48423c}.gridmark .start{fill:#b34f42}
</style></head><body><main class="book"><section id="cover" class="cover"><h1 id="title"></h1><button id="open">Open notebook</button><div class="notice" id="notice"></div></section><section id="reader" class="hidden"><article class="page" id="page"></article><nav class="nav"><button id="prev">‹</button><small id="count"></small><button id="next">›</button></nav></section></main><script>
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()}const lang=(new URLSearchParams(location.search).get('lang')||'en').toLowerCase().startsWith('hr')?'hr':'en';
const L={en:{title:'Notebook',open:'Open notebook',prev:'Previous',next:'Next',fold:'Fold the corner back',insert:'Lift the loose receipt',restored:'You ease it out.',folded:'The graphite line continues around the edge; a small arrow marks its beginning.'},hr:{title:'Bilježnica',open:'Otvori bilježnicu',prev:'Prethodna',next:'Sljedeća',fold:'Presavij kut natrag',insert:'Podigni labavi račun',restored:'Pažljivo ga izvučeš.',folded:'Grafitna se crta nastavlja uz rub; mala strelica označava početak.'}}[lang];
const pattern='<svg class="gridmark" viewBox="0 0 150 150" aria-label="nine dot grid"><path class="guide" d="M25 25H125V125H25Z M25 25L125 125M125 25L25 125"/><g>'+[25,75,125].flatMap(y=>[25,75,125].map(x=>'<circle cx="'+x+'" cy="'+y+'" r="6"/>')).join('')+'</g></svg>';
const route='<svg class="gridmark" viewBox="0 0 150 150" aria-label="drawn path"><path class="guide" d="M25 25H125V125H25Z M25 25L125 125M125 25L25 125"/><path class="route" d="M25 25H125V125H25Z"/><path class="route" d="M18 25l10-6m-10 6 10 6"/><g>'+[25,75,125].flatMap(y=>[25,75,125].map((x,i)=>'<circle class="'+(x===25&&y===25?'start':'')+'" cx="'+x+'" cy="'+y+'" r="6"/>')).join('')+'</g></svg>';
const pages={en:[
['Inside cover','If found — Tomislav 091 442 8061\n\nThe number is written twice. The second time, more firmly.'],
['Friday list','☐ return library book\n☐ milk\n☐ tell M. I cannot make Tuesday\n☐ charge recorder\n☐ buy batteries'],
['Bus notes','109 — wait for the second one; the first is always full.\n\nA rough sketch of a stop, a bench, and an arrow pointing toward the kiosk.'],
['Names to remember','Mum: no lilies.\nToma: rice, not pasta.\nIvana: takes coffee black but complains if it is bad.\n\n<span class="strike">Buy a plant.</span>'],
['Laundry / weather','Blue shirt still on radiator.\nWind after five. Take the small umbrella, not the good one.\n\nA smudged square of newsprint is pasted here: an advertisement for a lost cat.'],
['Loose receipt','A café receipt is caught under the spiral at the top.\n\nOn the reverse: <span class="red">“ask for the quiet table next time”</span><div id="receipt" class="hidden insert">CITY LIBRARY CAFÉ\nTea · 1\nReceipt 4821\nThursday · 18:06\n\nNo name.</div><button class="action" id="insertBtn">'+L.insert+'</button>'],
['Questions for myself','What needs doing before Monday?\nWhat can wait?\nWho still needs an answer?\n\nThe third line is underlined twice.'],
['Margins','A left-handed column of shorthand, crossed out so hard the paper has gone soft.\n\nAt the bottom: <span class="bookmark">blue tab</span> <span class="red">“Use the blue pencil first.”</span>'],
['Folded corner','A small nine-dot grid is drawn in the corner. The paper is bent along a diagonal crease.'+pattern+'<div class="crease"></div><div class="hiddenPath">'+route+'</div><button class="action foldBtn" id="foldBtn">'+L.fold+'</button><div class="caption" id="foldNote"></div>'],
['Thursday','The cracked mug. The neighbour’s radio at 06:40. A pigeon on the balcony.\n\nThe kettle clicks off twice before she reaches it.'],
['Recipes','Lentils: more lemon than seems reasonable.\nRice: wash it first.\nSoup: call Mum and ask what she used to put in it.'],
['Back page','A telephone number has been written, then erased until only the pressure remains.']
],hr:[
['Unutarnja korica','Ako nađete — Tomislav 091 442 8061\n\nBroj je napisan dvaput. Drugi put čvršće.'],
['Popis za petak','☐ vratiti knjigu u knjižnicu\n☐ mlijeko\n☐ javiti M. da ne mogu u utorak\n☐ napuniti diktafon\n☐ kupiti baterije'],
['Bilješke o autobusu','109 — čekaj drugi; prvi je uvijek pun.\n\nGruba skica stanice, klupe i strelice prema kiosku.'],
['Imena za zapamtiti','Mama: ne ljiljane.\nToma: riža, ne tjestenina.\nIvana: pije crnu kavu, ali se žali ako je loša.\n\n<span class="strike">Kupi biljku.</span>'],
['Rublje / vrijeme','Plava košulja još je na radijatoru.\nVjetar poslije pet. Uzmi mali kišobran, ne dobri.\n\nZalijepljen je mali oglas iz novina: izgubljena mačka.'],
['Labavi račun','Račun iz kafića zapeo je pod spiralom pri vrhu.\n\nNa poleđini piše: <span class="red">„idući put traži tihi stol”</span><div id="receipt" class="hidden insert">KAFIĆ GRADSKE KNJIŽNICE\nČaj · 1\nRačun 4821\nČetvrtak · 18:06\n\nNema imena.</div><button class="action" id="insertBtn">'+L.insert+'</button>'],
['Pitanja sebi','Što treba napraviti prije ponedjeljka?\nŠto može čekati?\nTko još čeka odgovor?\n\nTreća rečenica podvučena je dvaput.'],
['Margine','Stupac stenografije lijevom rukom, toliko precrtan da je papir omekšao.\n\nPri dnu: <span class="bookmark">plava oznaka</span> <span class="red">„Prvo upotrijebi plavu olovku.”</span>'],
['Presavijeni kut','U kutu je nacrtana mreža od devet točaka. Papir je savijen po dijagonalnoj crti.'+pattern+'<div class="crease"></div><div class="hiddenPath">'+route+'</div><button class="action foldBtn" id="foldBtn">'+L.fold+'</button><div class="caption" id="foldNote"></div>'],
['Četvrtak','Napuknuta šalica. Susjedov radio u 06:40. Golub na balkonu.\n\nKuhalo za vodu klikne dvaput prije nego što dođe do njega.'],
['Recepti','Leća: više limuna nego što se čini razumno.\nRiža: prvo je isperi.\nJuha: nazovi mamu i pitaj što je stavljala u nju.'],
['Stražnja korica','Broj telefona napisan je pa izbrisan dok nije ostao samo pritisak olovke.']
]};
let n=-1;const all=pages[lang];const page=document.getElementById('page');function render(){if(n<0){cover.classList.remove('hidden');reader.classList.add('hidden');return}cover.classList.add('hidden');reader.classList.remove('hidden');const x=all[n];page.innerHTML='<div class="meta">'+(n===0?'inside cover':'page '+(n+1))+'</div><h2>'+x[0]+'</h2><p>'+x[1]+'</p><span class="pageNo">'+(n+1)+' / '+all.length+'</span>';count.textContent=(n+1)+' / '+all.length;prev.disabled=n===0;next.disabled=n===all.length-1;const ib=document.getElementById('insertBtn');if(ib)ib.onclick=()=>{document.getElementById('receipt').classList.remove('hidden');ib.remove();notice.textContent=L.restored};const fb=document.getElementById('foldBtn');if(fb)fb.onclick=()=>{page.classList.add('folded');document.getElementById('foldNote').textContent=L.folded};}open.onclick=()=>{n=0;render()};prev.onclick=()=>{n=Math.max(0,n-1);render()};next.onclick=()=>{n=Math.min(all.length-1,n+1);render()};title.textContent=L.title;open.textContent=L.open;prev.textContent='‹ '+L.prev;next.textContent=L.next;render();
</script></body></html>
