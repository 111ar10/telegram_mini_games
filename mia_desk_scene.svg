<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a7362"/>
      <stop offset="1" stop-color="#6f5b4c"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a30"/>
      <stop offset="1" stop-color="#5a3d27"/>
    </linearGradient>
    <linearGradient id="deskFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3220"/>
      <stop offset="1" stop-color="#3a2718"/>
    </linearGradient>
    <linearGradient id="mirrorGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aab8c2"/>
      <stop offset="1" stop-color="#7c8b96"/>
    </linearGradient>
  </defs>

  <!-- wall -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wall)"/>
  <!-- faint wall texture lines -->
  <g stroke="#00000012" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="0" y1="220" x2="800" y2="220"/>
  </g>

  <!-- POSTER (hotspot: poster) tilted slightly -->
  <g transform="rotate(-2 176 168)">
    <rect x="48" y="48" width="256" height="184" rx="4" fill="#c76b4a"/>
    <rect x="48" y="48" width="256" height="184" rx="4" fill="none" stroke="#00000030" stroke-width="2"/>
    <rect x="66" y="70" width="220" height="26" fill="#f2e6c9" opacity=".85"/>
    <rect x="66" y="104" width="140" height="10" fill="#f2e6c9" opacity=".55"/>
    <rect x="66" y="122" width="180" height="10" fill="#f2e6c9" opacity=".55"/>
    <circle cx="230" cy="170" r="34" fill="#e8b23d" opacity=".8"/>
    <path d="M280 48 L304 48 L304 76 Z" fill="#8a4a30"/>
  </g>

  <!-- MIRROR (hotspot: mirror) top right -->
  <g>
    <rect x="536" y="40" width="216" height="230" rx="14" fill="#5c3d24"/>
    <rect x="552" y="56" width="184" height="198" rx="8" fill="url(#mirrorGlass)"/>
    <rect x="552" y="56" width="184" height="198" rx="8" fill="#ffffff" opacity=".06"/>
    <!-- polaroid tucked in the corner -->
    <g transform="rotate(-8 560 250)">
      <rect x="520" y="210" width="84" height="96" fill="#f5f2ea"/>
      <rect x="528" y="216" width="68" height="60" fill="#5b7a8a"/>
      <rect x="528" y="216" width="68" height="60" fill="#2f4a56" opacity=".35"/>
    </g>
  </g>

  <!-- desk top surface (thin band where the books/lamp sit) -->
  <rect x="0" y="300" width="800" height="46" fill="url(#deskTop)"/>
  <rect x="0" y="300" width="800" height="4" fill="#ffffff" opacity=".08"/>

  <!-- small lamp (decorative only, not a hotspot) -->
  <g>
    <rect x="486" y="248" width="10" height="54" fill="#2a2a2a"/>
    <ellipse cx="491" cy="248" rx="34" ry="16" fill="#e8c96b"/>
    <ellipse cx="491" cy="300" rx="16" ry="6" fill="#2a2a2a"/>
  </g>
  <!-- pen holder (decorative) -->
  <rect x="420" y="272" width="30" height="30" rx="3" fill="#3d5a4a"/>
  <line x1="428" y1="250" x2="424" y2="274" stroke="#c9a24b" stroke-width="4" stroke-linecap="round"/>
  <line x1="440" y1="246" x2="438" y2="274" stroke="#7bb0d8" stroke-width="4" stroke-linecap="round"/>

  <!-- BOOKS stack (hotspot: books) sitting on the desk top -->
  <g>
    <rect x="272" y="252" width="150" height="20" rx="2" fill="#7a3b3b"/>
    <rect x="278" y="230" width="132" height="22" rx="2" fill="#3b5a7a"/>
    <rect x="284" y="206" width="112" height="24" rx="2" fill="#7a6a3b"/>
  </g>

  <!-- desk front panel -->
  <rect x="0" y="346" width="800" height="254" fill="url(#deskFront)"/>
  <rect x="0" y="346" width="800" height="6" fill="#000000" opacity=".2"/>

  <!-- DRAWER (hotspot: drawer) inset in the desk front, containing the diary hotspot once opened -->
  <g>
    <rect x="240" y="408" width="320" height="132" rx="6" fill="#2f2015" stroke="#1c130c" stroke-width="3"/>
    <rect x="240" y="408" width="320" height="132" rx="6" fill="#ffffff" opacity=".03"/>
    <!-- handle -->
    <rect x="372" y="466" width="56" height="14" rx="7" fill="#c9a24b"/>
    <circle cx="380" cy="473" r="5" fill="#8a6d2c"/>
    <circle cx="420" cy="473" r="5" fill="#8a6d2c"/>
    <!-- keyhole hint -->
    <circle cx="400" cy="430" r="6" fill="#0e0a06"/>
    <rect x="397" y="430" width="6" height="12" fill="#0e0a06"/>
  </g>

  <!-- CHAIR (hotspot: chair) bottom-left, partially in frame -->
  <g transform="translate(30,420)">
    <rect x="0" y="0" width="150" height="18" rx="4" fill="#4a3220"/>
    <rect x="0" y="18" width="150" height="120" rx="6" fill="#5a3d27"/>
    <rect x="10" y="-96" width="130" height="96" rx="10" fill="#5a3d27"/>
    <rect x="10" y="-96" width="130" height="96" rx="10" fill="#000000" opacity=".12"/>
    <rect x="6" y="130" width="14" height="70" fill="#2a1c10"/>
    <rect x="130" y="130" width="14" height="70" fill="#2a1c10"/>
  </g>

  <!-- floor -->
  <rect x="0" y="588" width="800" height="12" fill="#241a12"/>
</svg>
