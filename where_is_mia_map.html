  <script>
/*
 * map-engine.js — a modular GPS map viewer for Telegram web_app mini-games.
 * =========================================================================
 * ONE engine, many games. A game is just an HTML file that:
 *   1. loads the Telegram Web App SDK,
 *   2. defines `window.MAP_CONFIG = { ... }`,
 *   3. includes this script.
 *
 * Features
 *   - Raster or SVG map background (any image), sized to a virtual "world".
 *   - Optional SVG/PNG overlay layered on top (a different art style per game).
 *   - "You are here" marker from the real GPS (navigator.geolocation), projected
 *     onto the map via a 2-point georeference (similarity: translate+rotate+scale).
 *   - Location pinpoints (POIs) that can be locked/unlocked; unlocked ones are
 *     tappable and can auto-unlock when the player physically arrives.
 *   - Pinch / wheel zoom and drag pan, "fit map" and "find me" buttons.
 *   - Same result contract as the other mini-games: postMessage (emulator) +
 *     tg.sendData (Telegram) + localStorage fallback.
 *
 * The engine builds all of its own DOM into `#mapgame` (or <body>), so a game
 * file needs almost no markup. See map-builder.html to author configs visually.
 *
 * URL params understood: sessionId, userId, lang, unlocked=key1,key2 (force-unlock).
 */
(function () {
  'use strict';

  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  const haptic = (k) => { try { if (!tg || !tg.HapticFeedback) return;
    if (k === 'tick') tg.HapticFeedback.selectionChanged();
    else if (k === 'ok') tg.HapticFeedback.notificationOccurred('success');
    else if (k === 'err') tg.HapticFeedback.notificationOccurred('error'); } catch (e) {} };

  const CFG = window.MAP_CONFIG || {};
  const q = new URLSearchParams(location.search);

  /* ---- locale ---- */
  const DEF = CFG.defaultLang || 'en';
  let lang = (q.get('lang') ||
    (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) ||
    DEF).split('-')[0].toLowerCase();
  const L = (v) => {
    if (v == null) return '';
    if (typeof v === 'string' || typeof v === 'number') return String(v);
    return v[lang] ?? v[DEF] ?? Object.values(v)[0] ?? '';
  };

  const sessionId = q.get('sessionId');
  const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : q.get('userId');
  const forcedUnlocked = new Set((q.get('unlocked') || '').split(',').map((s) => s.trim()).filter(Boolean));

  /* ---- theme ---- */
  const T = Object.assign({
    bg: '#0c1220', panel: '#12233a', ink: '#e8e6df', muted: '#8b93a6',
    accent: '#7cc0ff', player: '#4c9dff', locked: '#5a6478', unlocked: '#4caf7d', reach: '#ffd166',
  }, CFG.theme || {});

  const map = CFG.map || {};
  const IMG_W = map.width || 1000;
  const IMG_H = map.height || 1000;

  /* =========================================================================
   * Georeference: image px  <->  lat/lng, via a 2-point similarity transform.
   * With two known correspondences (image pixel + real lat/lng) we recover
   * translation + rotation + uniform scale — enough for any north-agnostic,
   * not-to-scale stylised map. Uses a local equirectangular projection.
   * Complex-number form:  world = a * z + b,  where z = x - i*y (y flipped so
   * "up" is positive to match world-North), world = E + i*N (metres).
   * ========================================================================= */
  function buildGeo(cal) {
    const c = (cal || []).filter((p) => [p.lat, p.lng, p.x, p.y].every((n) => typeof n === 'number' && isFinite(n)));
    if (c.length < 2) return null;
    const lat0 = c[0].lat, lng0 = c[0].lng;
    const mPerLat = 110540, mPerLng = 111320 * Math.cos(lat0 * Math.PI / 180);
    const toW = (lat, lng) => ({ E: (lng - lng0) * mPerLng, N: (lat - lat0) * mPerLat });
    const p1 = c[0], p2 = c[1];
    const w1 = toW(p1.lat, p1.lng), w2 = toW(p2.lat, p2.lng);
    const z1 = { re: p1.x, im: -p1.y }, z2 = { re: p2.x, im: -p2.y };
    const dw = { re: w2.E - w1.E, im: w2.N - w1.N };
    const dz = { re: z2.re - z1.re, im: z2.im - z1.im };
    const den = dz.re * dz.re + dz.im * dz.im || 1e-9;
    // a = dw / dz  (complex division)
    const a = { re: (dw.re * dz.re + dw.im * dz.im) / den, im: (dw.im * dz.re - dw.re * dz.im) / den };
    const az1 = { re: a.re * z1.re - a.im * z1.im, im: a.re * z1.im + a.im * z1.re };
    const b = { re: w1.E - az1.re, im: w1.N - az1.im };
    const aden = a.re * a.re + a.im * a.im || 1e-9;
    const mPerPx = Math.sqrt(aden);
    return {
      mPerPx, pxPerM: 1 / mPerPx,
      llToXY(lat, lng) {                       // world -> z = (world - b)/a
        const w = toW(lat, lng);
        const n = { re: w.E - b.re, im: w.N - b.im };
        const z = { re: (n.re * a.re + n.im * a.im) / aden, im: (n.im * a.re - n.re * a.im) / aden };
        return { x: z.re, y: -z.im };
      },
      xyToLL(x, y) {                           // world = a*z + b
        const z = { re: x, im: -y };
        const az = { re: a.re * z.re - a.im * z.im, im: a.re * z.im + a.im * z.re };
        const E = az.re + b.re, N = az.im + b.im;
        return { lat: lat0 + N / mPerLat, lng: lng0 + E / mPerLng };
      },
      distM(aLat, aLng, bLat, bLng) {
        return Math.hypot((bLng - aLng) * mPerLng, (bLat - aLat) * mPerLat);
      },
    };
  }
  const geo = buildGeo(CFG.calibration);

  // Resolve a pin's world (image) x,y: prefer explicit x/y, else project lat/lng.
  function pinXY(p) {
    if (typeof p.x === 'number' && typeof p.y === 'number') return { x: p.x, y: p.y };
    if (geo && typeof p.lat === 'number' && typeof p.lng === 'number') return geo.llToXY(p.lat, p.lng);
    return { x: IMG_W / 2, y: IMG_H / 2 };
  }
  function pinLL(p) {
    if (typeof p.lat === 'number' && typeof p.lng === 'number') return { lat: p.lat, lng: p.lng };
    if (geo && typeof p.x === 'number' && typeof p.y === 'number') return geo.xyToLL(p.x, p.y);
    return null;
  }

  /* =========================================================================
   * DOM scaffold
   * ========================================================================= */
  const mount = document.getElementById('mapgame') || document.body;
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

  const style = document.createElement('style');
  style.textContent = `
    :root{
      --mg-bg:${T.bg};--mg-panel:${T.panel};--mg-ink:${T.ink};--mg-muted:${T.muted};
      --mg-accent:${T.accent};--mg-player:${T.player};--mg-locked:${T.locked};--mg-unlocked:${T.unlocked};--mg-reach:${T.reach};
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;}
    body{background:var(--mg-bg);color:var(--mg-ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;}
    #mg-root{position:fixed;inset:0;overflow:hidden;}
    #mg-viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--mg-bg);}
    #mg-viewport.drag{cursor:grabbing;}
    #mg-world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;width:${IMG_W}px;height:${IMG_H}px;}
    #mg-base,#mg-overlay{position:absolute;left:0;top:0;width:${IMG_W}px;height:${IMG_H}px;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none;}
    #mg-overlay{opacity:${map.overlayOpacity ?? 1};${map.overlayBlend ? 'mix-blend-mode:' + map.overlayBlend + ';' : ''}}
    .mg-pin{position:absolute;transform-origin:50% 50%;pointer-events:auto;cursor:pointer;}
    .mg-pin .body{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);}
    .mg-pin .glyph{width:34px;height:34px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);
      display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.85);}
    .mg-pin .glyph>span{transform:rotate(-45deg);font-size:17px;line-height:1;}
    .mg-pin .tip{width:0;height:0;}
    .mg-pin .cap{margin-top:5px;font-size:12px;font-weight:700;color:var(--mg-ink);background:rgba(6,10,18,.72);
      padding:2px 7px;border-radius:7px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.4);}
    .mg-pin.locked .glyph{background:var(--mg-locked);border-color:rgba(255,255,255,.35);}
    .mg-pin.locked .cap{opacity:.6;}
    .mg-pin.unlocked .glyph{background:var(--mg-unlocked);}
    .mg-pin.reach .glyph{background:var(--mg-reach);animation:mg-pulse 1.3s ease-in-out infinite;}
    @keyframes mg-pulse{0%,100%{box-shadow:0 3px 8px rgba(0,0,0,.45),0 0 0 0 rgba(255,209,102,.55);}50%{box-shadow:0 3px 8px rgba(0,0,0,.45),0 0 0 10px rgba(255,209,102,0);}}
    #mg-player{position:absolute;transform-origin:50% 50%;pointer-events:none;}
    #mg-player .dot{width:18px;height:18px;border-radius:50%;background:var(--mg-player);border:3px solid #fff;
      box-shadow:0 0 0 2px rgba(76,157,255,.5),0 2px 6px rgba(0,0,0,.5);transform:translate(-50%,-50%);}
    #mg-player .heading{position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-50%,-50%);}
    #mg-accuracy{position:absolute;border-radius:50%;background:rgba(76,157,255,.14);border:1px solid rgba(76,157,255,.4);
      transform:translate(-50%,-50%);pointer-events:none;}
    .mg-header{position:absolute;top:0;left:0;right:0;padding:14px 16px calc(14px + env(safe-area-inset-top,0));
      background:linear-gradient(180deg,rgba(6,10,18,.82),rgba(6,10,18,0));pointer-events:none;z-index:5;}
    .mg-header h1{font-size:16px;font-weight:800;letter-spacing:.2px;}
    .mg-header .sub{margin-top:3px;font-size:12px;color:var(--mg-muted);max-width:70%;line-height:1.4;}
    .mg-ctrls{position:absolute;right:12px;bottom:calc(18px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:9px;z-index:6;}
    .mg-btn{width:46px;height:46px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:var(--mg-panel);
      color:var(--mg-ink);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 12px rgba(0,0,0,.4);cursor:pointer;user-select:none;transition:transform .1s,background .15s;}
    .mg-btn:active{transform:scale(.92);}
    .mg-btn.find{color:var(--mg-player);font-size:20px;}
    .mg-btn.find.on{background:var(--mg-player);color:#fff;}
    .mg-legend{position:absolute;left:12px;bottom:calc(18px + env(safe-area-inset-bottom,0));z-index:6;display:flex;flex-direction:column;gap:5px;
      background:rgba(6,10,18,.6);padding:8px 10px;border-radius:11px;font-size:11px;color:var(--mg-muted);max-width:44vw;}
    .mg-legend .row{display:flex;align-items:center;gap:7px;}
    .mg-legend .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
    .mg-sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
      background:var(--mg-panel);border-radius:20px 20px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom,0));
      box-shadow:0 -12px 40px rgba(0,0,0,.5);border-top:1px solid rgba(255,255,255,.08);}
    .mg-sheet.show{transform:translateY(0);}
    .mg-sheet .grip{width:38px;height:4px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 14px;}
    .mg-sheet .st{display:flex;align-items:center;gap:10px;}
    .mg-sheet .st .em{font-size:26px;}
    .mg-sheet h2{font-size:18px;font-weight:800;}
    .mg-sheet .dist{margin-left:auto;font-size:12px;color:var(--mg-muted);font-variant-numeric:tabular-nums;}
    .mg-sheet p{margin-top:11px;font-size:14px;color:var(--mg-ink);line-height:1.5;}
    .mg-sheet .act{margin-top:16px;width:100%;padding:14px;border:none;border-radius:13px;background:var(--mg-unlocked);
      color:#062015;font-size:15px;font-weight:800;cursor:pointer;}
    .mg-toast{position:absolute;left:50%;top:64px;transform:translate(-50%,-16px);z-index:30;opacity:0;transition:all .25s;
      background:rgba(6,10,18,.92);color:var(--mg-ink);padding:9px 15px;border-radius:11px;font-size:13px;
      box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none;max-width:80vw;text-align:center;}
    .mg-toast.show{opacity:1;transform:translate(-50%,0);}
  `;
  document.head.appendChild(style);

  const root = el('div'); root.id = 'mg-root';
  const viewport = el('div'); viewport.id = 'mg-viewport';
  const world = el('div'); world.id = 'mg-world';
  root.appendChild(viewport); viewport.appendChild(world);

  if (map.image) { const base = el('img'); base.id = 'mg-base'; base.src = map.image; base.alt = 'map'; base.draggable = false; world.appendChild(base); }
  if (map.overlay) { const ov = el('img'); ov.id = 'mg-overlay'; ov.src = map.overlay; ov.alt = 'overlay'; ov.draggable = false; world.appendChild(ov); }

  const accuracy = el('div'); accuracy.id = 'mg-accuracy'; accuracy.style.display = 'none'; world.appendChild(accuracy);
  const pinsLayer = el('div'); pinsLayer.id = 'mg-pins'; world.appendChild(pinsLayer);
  const player = el('div'); player.id = 'mg-player'; player.style.display = 'none';
  player.appendChild(el('div', 'dot')); world.appendChild(player);

  // header
  const header = el('div', 'mg-header');
  header.appendChild(el('h1', null, L(CFG.title) || 'Map'));
  if (CFG.intro) header.appendChild(el('div', 'sub', L(CFG.intro)));
  root.appendChild(header);

  // toast
  const toast = el('div', 'mg-toast'); root.appendChild(toast);
  let toastT = null;
  function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove('show'), 2200); }

  // controls
  const ctrls = el('div', 'mg-ctrls');
  const btnFind = el('div', 'mg-btn find', '◎'); btnFind.title = 'Find me';
  const btnIn = el('div', 'mg-btn', '+');
  const btnOut = el('div', 'mg-btn', '−');
  const btnFit = el('div', 'mg-btn', '⤢'); btnFit.title = 'Fit map';
  ctrls.append(btnFind, btnIn, btnOut, btnFit);
  root.appendChild(ctrls);

  // bottom sheet (pin detail)
  const sheet = el('div', 'mg-sheet');
  sheet.innerHTML = `<div class="grip"></div>
    <div class="st"><span class="em" id="mg-sh-em">📍</span><h2 id="mg-sh-title"></h2><span class="dist" id="mg-sh-dist"></span></div>
    <p id="mg-sh-body"></p>`;
  root.appendChild(sheet);
  const sheetAct = el('button', 'act'); sheetAct.style.display = 'none'; sheet.appendChild(sheetAct);

  mount.appendChild(root);

  /* =========================================================================
   * Pins
   * ========================================================================= */
  const pins = (CFG.pins || []).map((p, i) => {
    const node = el('div', 'mg-pin');
    node.innerHTML = `<div class="body"><div class="glyph"><span>${p.icon || '📍'}</span></div>${
      (CFG.showLabels ?? true) && (p.label != null) ? `<div class="cap"></div>` : ''}</div>`;
    const cap = node.querySelector('.cap'); if (cap) cap.textContent = L(p.label);
    pinsLayer.appendChild(node);
    const st = { def: p, node, key: p.key || ('pin' + i), unlocked: !p.locked || forcedUnlocked.has(p.key), reached: false };
    node.addEventListener('click', (e) => { e.stopPropagation(); openPin(st); });
    return st;
  });
  function applyPinState(st) {
    st.node.classList.toggle('locked', !st.unlocked && !st.reach);
    st.node.classList.toggle('unlocked', st.unlocked);
    st.node.classList.toggle('reach', !!st.reach && !st.unlocked);
    // hide fully-locked pins if the game wants a fog-of-war reveal
    st.node.style.display = (!st.unlocked && (st.def.hideWhenLocked ?? CFG.hideLockedPins)) ? 'none' : '';
  }

  /* =========================================================================
   * View transform (pan / zoom)
   * ========================================================================= */
  const view = { tx: 0, ty: 0, scale: 1 };
  let minScale = 0.2, maxScale = Math.max(2, map.maxScale || 6);
  function fitScale() { return Math.min(viewport.clientWidth / IMG_W, viewport.clientHeight / IMG_H); }
  function applyView() {
    world.style.transform = `translate(${view.tx}px,${view.ty}px) scale(${view.scale})`;
    const inv = 1 / view.scale;
    for (const st of pins) { st.node.style.transform = `scale(${inv})`; }
    player.style.transform = `scale(${inv})`;
  }
  function clampScale(s) { return Math.max(minScale, Math.min(maxScale, s)); }
  // zoom keeping world-point under screen-point (sx,sy) fixed
  function zoomAt(sx, sy, next) {
    next = clampScale(next);
    const wx = (sx - view.tx) / view.scale, wy = (sy - view.ty) / view.scale;
    view.scale = next; view.tx = sx - wx * next; view.ty = sy - wy * next; applyView();
  }
  function centerOnWorld(wx, wy, scale) {
    if (scale) view.scale = clampScale(scale);
    view.tx = viewport.clientWidth / 2 - wx * view.scale;
    view.ty = viewport.clientHeight / 2 - wy * view.scale;
    applyView();
  }
  function fitMap() {
    const f = fitScale(); minScale = f * 0.85; view.scale = clampScale(f);
    view.tx = (viewport.clientWidth - IMG_W * view.scale) / 2;
    view.ty = (viewport.clientHeight - IMG_H * view.scale) / 2;
    applyView();
  }
  function positionPins() { for (const st of pins) { const { x, y } = pinXY(st.def); st.node.style.left = x + 'px'; st.node.style.top = y + 'px'; applyPinState(st); } }

  /* ---- pointer pan / pinch ---- */
  const pointers = new Map();
  let panStart = null, pinchStart = null;
  viewport.addEventListener('pointerdown', (e) => {
    viewport.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    viewport.classList.add('drag');
    if (pointers.size === 1) panStart = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty, moved: 0 };
    else if (pointers.size === 2) { panStart = null; pinchStart = pinchSnapshot(); }
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size >= 2 && pinchStart) {
      const now = pinchSnapshot();
      const ratio = now.dist / pinchStart.dist;
      view.scale = clampScale(pinchStart.scale * ratio);
      const wx = (pinchStart.midWx), wy = (pinchStart.midWy);
      view.tx = now.mx - wx * view.scale; view.ty = now.my - wy * view.scale;
      applyView();
    } else if (panStart) {
      view.tx = panStart.tx + (e.clientX - panStart.x);
      view.ty = panStart.ty + (e.clientY - panStart.y);
      panStart.moved += Math.abs(e.movementX) + Math.abs(e.movementY);
      applyView();
    }
  });
  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = null;
    if (pointers.size === 1) { const p = [...pointers.values()][0]; panStart = { x: p.x, y: p.y, tx: view.tx, ty: view.ty, moved: 999 }; }
    if (pointers.size === 0) { viewport.classList.remove('drag'); panStart = null; }
  };
  viewport.addEventListener('pointerup', endPointer);
  viewport.addEventListener('pointercancel', endPointer);
  function pinchSnapshot() {
    const [a, b] = [...pointers.values()];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    return { mx, my, dist, scale: view.scale, midWx: (mx - view.tx) / view.scale, midWy: (my - view.ty) / view.scale };
  }
  // tap on empty map closes the sheet
  viewport.addEventListener('click', () => { if (!panStart || panStart.moved < 6) closeSheet(); });

  // wheel zoom (desktop / emulator)
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = viewport.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, view.scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
  }, { passive: false });

  btnIn.addEventListener('click', () => zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, view.scale * 1.4));
  btnOut.addEventListener('click', () => zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, view.scale / 1.4));
  btnFit.addEventListener('click', fitMap);

  /* =========================================================================
   * Pin detail sheet
   * ========================================================================= */
  const shTitle = sheet.querySelector('#mg-sh-title'), shBody = sheet.querySelector('#mg-sh-body'),
        shEm = sheet.querySelector('#mg-sh-em'), shDist = sheet.querySelector('#mg-sh-dist');
  let openKey = null;
  function openPin(st) {
    openKey = st.key;
    shEm.textContent = st.def.icon || '📍';
    shTitle.textContent = L(st.def.label) || st.key;
    shBody.textContent = L(st.def.note) || L(st.def.description) || '';
    updateSheetDistance();
    sheetAct.style.display = 'none';
    if (st.unlocked && st.def.action) {
      sheetAct.style.display = ''; sheetAct.textContent = L(st.def.action.label) || 'Open';
      sheetAct.onclick = () => runPinAction(st);
    }
    sheet.classList.add('show');
    emit('pin_tap', { key: st.key, unlocked: st.unlocked });
  }
  function closeSheet() { sheet.classList.remove('show'); openKey = null; }
  function updateSheetDistance() {
    if (!openKey || !last) { shDist.textContent = ''; return; }
    const st = pins.find((p) => p.key === openKey); if (!st) return;
    const ll = pinLL(st.def); if (!ll || !geo) { shDist.textContent = ''; return; }
    const d = geo.distM(last.lat, last.lng, ll.lat, ll.lng);
    shDist.textContent = d < 1000 ? Math.round(d) + ' m' : (d / 1000).toFixed(1) + ' km';
  }
  function runPinAction(st) {
    const a = st.def.action || {};
    emit('pin_action', { key: st.key, action: a.type || 'open' });
    if (a.type === 'result') { sendResult(Object.assign({ outcome: 'success', pin: st.key }, a.payload || {})); showToast(L(a.toast) || 'Done'); }
    else if (a.url && tg && tg.openLink) tg.openLink(a.url);
    else if (a.url) window.open(a.url, '_blank');
  }

  /* =========================================================================
   * Result / event contract (matches the other mini-games)
   * ========================================================================= */
  function sendResult(payload) {
    const result = Object.assign({ sessionId, userId, gameId: CFG.gameId || 'map', timestamp: Date.now() }, payload);
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'MINIGAME_RESULT', payload: result }, '*'); } catch (e) {}
    try { if (tg && typeof tg.sendData === 'function') tg.sendData(JSON.stringify(result));
          else localStorage.setItem((CFG.gameId || 'map') + '_result_latest', JSON.stringify(result)); } catch (e) {}
    return result;
  }
  function emit(type, data) {
    const ev = Object.assign({ sessionId, userId, gameId: CFG.gameId || 'map', type }, data);
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'MINIGAME_EVENT', payload: ev }, '*'); } catch (e) {}
  }

  /* =========================================================================
   * Geolocation — the "you are here" marker + arrival detection
   * ========================================================================= */
  let last = null, follow = false, watchId = null;
  const unlockRadius = CFG.unlockRadius || 30; // metres

  function placePlayer(lat, lng, accM) {
    if (!geo) return;
    const { x, y } = geo.llToXY(lat, lng);
    // clamp marker to map so it never floats far outside; flag off-map
    const cx = Math.max(0, Math.min(IMG_W, x)), cy = Math.max(0, Math.min(IMG_H, y));
    player.style.left = cx + 'px'; player.style.top = cy + 'px'; player.style.display = '';
    player.classList.toggle('off', cx !== x || cy !== y);
    if (accM && geo.pxPerM) {
      const rpx = Math.max(6, accM * geo.pxPerM);
      accuracy.style.display = ''; accuracy.style.left = x + 'px'; accuracy.style.top = y + 'px';
      accuracy.style.width = accuracy.style.height = (rpx * 2) + 'px';
    }
  }
  function onGeo(pos) {
    last = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
    placePlayer(last.lat, last.lng, last.acc);
    if (follow) centerOnWorld(...Object.values(geo.llToXY(last.lat, last.lng)));
    checkArrivals();
    updateSheetDistance();
    emit('location', { lat: last.lat, lng: last.lng, accuracy: last.acc });
  }
  function onGeoErr(err) {
    btnFind.classList.remove('on'); follow = false;
    showToast(err && err.code === 1 ? (lang === 'hr' ? 'Lokacija odbijena' : 'Location permission denied')
                                    : (lang === 'hr' ? 'Lokacija nedostupna' : 'Location unavailable'));
  }
  function startGeo() {
    if (!('geolocation' in navigator)) { showToast(lang === 'hr' ? 'GPS nije podržan' : 'GPS not supported'); return; }
    if (watchId == null) watchId = navigator.geolocation.watchPosition(onGeo, onGeoErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 });
  }
  function checkArrivals() {
    if (!last || !geo) return;
    for (const st of pins) {
      const ll = pinLL(st.def); if (!ll) continue;
      const d = geo.distM(last.lat, last.lng, ll.lat, ll.lng);
      const near = d <= (st.def.radius || unlockRadius);
      if (near && !st.unlocked && (st.def.unlockOnArrive ?? CFG.unlockOnArrive)) {
        st.unlocked = true; st.reach = false; applyPinState(st); haptic('ok');
        showToast((lang === 'hr' ? 'Otključano: ' : 'Unlocked: ') + (L(st.def.label) || st.key));
        emit('pin_unlocked', { key: st.key });
        if (st.def.action && st.def.action.type === 'result') runPinAction(st);
      } else if (near && !st.unlocked) {
        if (!st.reach) { st.reach = true; applyPinState(st); }
      } else if (st.reach) { st.reach = false; applyPinState(st); }
    }
  }
  btnFind.addEventListener('click', () => {
    startGeo(); follow = true; btnFind.classList.add('on');
    if (last && geo) centerOnWorld(...Object.values(geo.llToXY(last.lat, last.lng)), Math.max(view.scale, map.findZoom || 1.5));
  });
  // stop following as soon as the user drags
  viewport.addEventListener('pointerdown', () => { if (follow) { follow = false; btnFind.classList.remove('on'); } });

  /* =========================================================================
   * Legend + boot
   * ========================================================================= */
  if (CFG.legend !== false) {
    const lg = el('div', 'mg-legend');
    lg.innerHTML =
      `<div class="row"><span class="sw" style="background:var(--mg-player)"></span>${lang === 'hr' ? 'Ti' : 'You'}</div>` +
      `<div class="row"><span class="sw" style="background:var(--mg-unlocked)"></span>${lang === 'hr' ? 'Otključano' : 'Unlocked'}</div>` +
      (pins.some((p) => !p.unlocked) ? `<div class="row"><span class="sw" style="background:var(--mg-locked)"></span>${lang === 'hr' ? 'Zaključano' : 'Locked'}</div>` : '');
    root.appendChild(lg);
  }

  function boot() {
    positionPins(); fitMap();
    // Center priority: ?here=<pinKey> (player's current place, from the bot) › CFG.start › fit.
    const hereKey = q.get('here');
    const herePin = hereKey && pins.find((p) => p.key === hereKey);
    if (herePin) { const { x, y } = pinXY(herePin.def); centerOnWorld(x, y, Math.max(view.scale, map.findZoom || 1.4)); }
    else if (CFG.start && geo) centerOnWorld(...Object.values(geo.llToXY(CFG.start.lat, CFG.start.lng)), CFG.start.zoom || view.scale);
    if (CFG.autoLocate ?? true) startGeo();
  }
  // wait for the base image to size correctly (natural dims may differ from configured)
  const baseImg = document.getElementById('mg-base');
  if (baseImg && !baseImg.complete) baseImg.addEventListener('load', boot, { once: true });
  boot();
  window.addEventListener('resize', () => { const s = view.scale; fitMap(); if (s > fitScale()) view.scale = s; applyView(); });

  /* ---- test / host API ---- */
  window.__mapgame = {
    view, pins, geo, CFG,
    setLocation(lat, lng, acc) { onGeo({ coords: { latitude: lat, longitude: lng, accuracy: acc || 12 } }); },
    unlock(key) { const st = pins.find((p) => p.key === key); if (st) { st.unlocked = true; applyPinState(st); } },
    fitMap, zoomAt, centerOnWorld, sendResult,
  };
})();

  </script>
</body>
</html>
