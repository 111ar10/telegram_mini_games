<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sliding Lock</title>

  <!-- Telegram Web App SDK (same as the other mini-games in this repo) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!--
    GENERIC SLIDING PIN-LOCK  (reusable across games — config-driven, MODULAR, SERVER-AUTHORITATIVE)
    ---------------------------------------------------------------------------------------------------------
    N independent pins, each on its own track with a fixed number of discrete notches; drag a pin (or tap
    anywhere on its track) to snap it to the nearest notch. Every pin starts at notch 0, so UNLOCK is always
    available — there is no "ready" gate to wait for, same as padlock.html's PULL. The target notch for each
    pin is NEVER sent to this page (same discipline as every other app in this family) — the player sets pins
    from whatever they already know in-fiction, taps UNLOCK, and the app reports the pins' current positions
    for the engine to validate, exactly like a typed answer.

    Params (URL query):
      pins        JSON array, url-encoded (REQUIRED): [{ "id":"p1", "positions":8, "labels":["0",...,"7"],
                    "color":"#c9a24b" }, ...]
                  - positions: how many discrete notches this pin has (min 2)
                  - labels: optional array (length = positions) shown at/reported for each notch; falls back to
                    the plain notch index ("0","1","2",...) if omitted — lets you build a numeric combination
                    ("3-7-2") or an arbitrary one (colors, letters, symbols) with the same mechanic.
                  - color: optional pin color (default brass)
      orientation "vertical" (default) — pins slide up/down, classic tumbler look
                  "horizontal" — pins slide left/right, slide-switch bank look
      title       header title      tag  italic prompt line (decodeURIComponent)      lang  "en" | "hr"
      sessionId / userId  passed straight back in the result payload
    Result (Telegram.WebApp.sendData):
      on UNLOCK: { sessionId, userId, gameId:'sliding-lock', submission, timestamp }
        submission is "<id>:<label>,<id>:<label>,..." in the SAME order as your `pins` array (not re-sorted —
        pin order is usually meaningful, like left-to-right combination digits). Write the puzzle's `answer`
        to match this exact format.
      give up: { sessionId, userId, gameId:'sliding-lock', success:false, outcome:'abandoned', timestamp }
  -->
  <style>
    :root {
      --bg: #0b0d10; --panel: #14161c; --ink: #e8e6df; --muted: #8b90a0;
      --brass: #c9a24b; --brass-dark: #8a6d2c; --shadow: rgba(0,0,0,.55); --danger: #d9534f; --success: #4caf7d;
      --track: #1e2129; --notch: rgba(255,255,255,.16);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 90% at 50% 0%, #191c22 0%, var(--bg) 65%);
      color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; min-height: 100%;
      padding: 18px 12px 26px; user-select: none;
    }
    header { text-align: center; margin-bottom: 4px; }
    h1 { font-size: 18px; font-weight: 700; }
    .tag { margin-top: 6px; font-size: 12.5px; color: var(--muted); font-style: italic; max-width: 340px; line-height: 1.4; }

    .board {
      margin-top: 12px; width: 320px; max-width: 94vw; border-radius: 14px; background: var(--panel);
      border: 1px solid #262b34; box-shadow: 0 16px 36px var(--shadow), inset 0 0 30px rgba(0,0,0,.4);
      touch-action: none;
    }
    svg.panel { width: 100%; height: auto; display: block; }
    .trackhit { fill: transparent; cursor: pointer; }
    .notch { fill: var(--notch); }
    .pinhit { cursor: grab; }
    .pinhit:active { cursor: grabbing; }
    .pinbody { stroke: rgba(0,0,0,.4); stroke-width: 1; }
    .pinlabel { font-size: 11px; font-weight: 800; fill: #0a0b0d; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .pinid { font-size: 9px; letter-spacing: 1px; fill: var(--muted); text-anchor: middle; text-transform: uppercase; }

    .unlock {
      margin-top: 18px; width: 300px; max-width: 88vw; padding: 14px; border: none; border-radius: 13px;
      background: linear-gradient(180deg, var(--brass) 0%, var(--brass-dark) 100%); color: #221a06; font-size: 15px;
      font-weight: 800; letter-spacing: .3px; box-shadow: 0 4px 0 #5c4a1f, 0 8px 18px var(--shadow);
      cursor: pointer; transition: transform .07s, box-shadow .07s;
    }
    .unlock:active { transform: translateY(3px); box-shadow: 0 1px 0 #5c4a1f; }

    .msg { min-height: 18px; margin-top: 12px; font-size: 13px; text-align: center; color: var(--muted); }
    .giveup { margin-top: 14px; background: none; border: none; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }

    .overlay { position: fixed; inset: 0; background: rgba(6,7,9,.88); backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center; z-index: 20; padding: 24px; }
    .overlay.show { display: flex; }
    .card { background: var(--panel); border: 1px solid #333a46; border-radius: 18px; padding: 28px 24px;
      text-align: center; max-width: 320px; width: 100%; box-shadow: 0 20px 50px var(--shadow); }
    .card .emoji { font-size: 42px; } .card h2 { margin: 12px 0 6px; font-size: 20px; } .card p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Sliding Lock</h1>
    <div class="tag" id="tag" style="display:none"></div>
  </header>

  <div class="board">
    <svg class="panel" id="panel" viewBox="0 0 320 380" aria-label="sliding lock"></svg>
  </div>

  <button class="unlock" id="unlock">UNLOCK</button>
  <div class="msg" id="msg"></div>
  <button class="giveup" id="giveup">Give up</button>

  <div class="overlay" id="overlay">
    <div class="card">
      <div class="emoji" id="rEmoji">🔓</div>
      <h2 id="rTitle">Sent</h2>
      <p id="rBody"></p>
    </div>
  </div>

  <script>
    // ------- Telegram bootstrap (mirrors padlock.html) -------
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }
    const haptic = (kind) => {
      try {
        if (!tg || !tg.HapticFeedback) return;
        if (kind === 'tick') tg.HapticFeedback.selectionChanged();
        else if (kind === 'ok') tg.HapticFeedback.notificationOccurred('success');
        else if (kind === 'err') tg.HapticFeedback.notificationOccurred('error');
      } catch (e) {}
    };

    // ------- Input params -------
    const q = new URLSearchParams(window.location.search);
    const sessionId = q.get('sessionId');
    const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : q.get('userId');
    let lang = (q.get('lang') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || 'en')
                 .split('-')[0].toLowerCase();

    const STR = {
      en: { title: 'Sliding Lock', give: 'Give up', unlock: 'UNLOCK',
            sent: 'Sent', sentBody: 'Check the chat for the verdict.',
            gaveTitle: 'Left locked', gaveBody: 'You step back from the panel.' },
      hr: { title: 'Klizna brava', give: 'Odustani', unlock: 'OTKLJUČAJ',
            sent: 'Poslano', sentBody: 'Provjeri chat za ishod.',
            gaveTitle: 'Ostalo zaključano', gaveBody: 'Odmakneš se od panela.' },
    };
    const S = STR[lang] || STR.en;
    function pjson(name) { try { const raw = q.get(name); return raw ? JSON.parse(decodeURIComponent(raw)) : null; } catch (e) { return null; } }

    document.documentElement.lang = lang;
    document.getElementById('title').textContent = q.get('title') || S.title;
    document.getElementById('unlock').textContent = S.unlock;
    document.getElementById('giveup').textContent = S.give;
    const tagText = q.get('tag');
    if (tagText) { const t = document.getElementById('tag'); t.style.display = ''; t.textContent = decodeURIComponent(tagText); }

    const pinsCfg = (pjson('pins') || []).filter((p) => p && p.id && p.positions >= 2);
    const orientation = q.get('orientation') === 'horizontal' ? 'horizontal' : 'vertical';

    let solved = false;

    // ------- Result reporting (server-authoritative) -------
    // UNLOCK reports every pin's current label at its current notch — the engine validates it. We never send
    // `success` and never receive the target combination.
    function send(payload) {
      const result = { sessionId, userId, gameId: 'sliding-lock', timestamp: Date.now(), ...payload };
      console.log('📤 sliding-lock result', result);
      try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'MINIGAME_RESULT', payload: result }, '*'); } catch (e) {}
      try {
        if (tg && typeof tg.sendData === 'function') tg.sendData(JSON.stringify(result));
        else localStorage.setItem('sliding-lock_result_latest', JSON.stringify(result));
      } catch (e) { console.error('sendData failed', e); }
    }
    function showOverlay(gaveUp) {
      document.getElementById('rEmoji').textContent = gaveUp ? '🔒' : '🔓';
      document.getElementById('rTitle').textContent = gaveUp ? S.gaveTitle : S.sent;
      document.getElementById('rBody').textContent = gaveUp ? S.gaveBody : S.sentBody;
      document.getElementById('overlay').classList.add('show');
    }
    document.getElementById('giveup').addEventListener('click', () => {
      if (solved) return;
      solved = true;
      send({ success: false, outcome: 'abandoned' });
      setTimeout(() => showOverlay(true), 200);
    });

    // ------- Track geometry: each pin gets a fixed cross-axis position and a min..max range along its own axis -------
    // TRACK_END < the viewBox's own width (320) on purpose: vertical gets its clearance for free from the
    // viewBox being taller (380) than TRACK_END, but horizontal's along-axis IS the 320-wide dimension, so
    // TRACK_END must leave its own margin there or the last notch clips flush against the panel edge.
    const MARGIN = 46, TRACK_START = 60, TRACK_END = 296;
    function trackLayout() {
      const n = pinsCfg.length;
      const cross = pinsCfg.map((_, i) => n === 1 ? 160 : MARGIN + ((320 - 2 * MARGIN) / (n - 1)) * i);
      return cross;
    }
    const crossPos = trackLayout();

    function notchPos(pinIdx, notchIdx) {
      const cfg = pinsCfg[pinIdx];
      const along = cfg.positions === 1 ? TRACK_START : TRACK_START + ((TRACK_END - TRACK_START) / (cfg.positions - 1)) * notchIdx;
      const c = crossPos[pinIdx];
      return orientation === 'vertical' ? { x: c, y: along } : { x: along, y: c };
    }

    // ------- SVG scaffold -------
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('panel');
    function mk(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
    const tracksG = mk('g', { id: 'tracks' }); svg.appendChild(tracksG);
    const pinsG = mk('g', { id: 'pins' }); svg.appendChild(pinsG);

    const state = pinsCfg.map(() => 0); // current notch index per pin, starts at 0
    const pinEls = [];

    pinsCfg.forEach((cfg, i) => {
      const color = cfg.color || '#c9a24b';
      // track: a thin line + notch ticks + an invisible wide hit-strip for tap-to-jump
      const p0 = notchPos(i, 0), p1 = notchPos(i, cfg.positions - 1);
      tracksG.appendChild(mk('line', { x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y, stroke: 'var(--track)', 'stroke-width': 10, 'stroke-linecap': 'round' }));
      for (let k = 0; k < cfg.positions; k++) {
        const np = notchPos(i, k);
        tracksG.appendChild(mk('circle', { class: 'notch', cx: np.x, cy: np.y, r: 3 }));
      }
      const hitW = orientation === 'vertical' ? 30 : (TRACK_END - TRACK_START) + 20;
      const hitH = orientation === 'vertical' ? (TRACK_END - TRACK_START) + 20 : 30;
      const hitX = orientation === 'vertical' ? p0.x - hitW / 2 : Math.min(p0.x, p1.x) - 10;
      const hitY = orientation === 'vertical' ? Math.min(p0.y, p1.y) - 10 : p0.y - hitH / 2;
      const trackHit = mk('rect', { class: 'trackhit', x: hitX, y: hitY, width: hitW, height: hitH, rx: 8 });
      tracksG.appendChild(trackHit);

      const idLabel = mk('text', { class: 'pinid', x: orientation === 'vertical' ? p0.x : hitX - 4, y: orientation === 'vertical' ? p0.y - 22 : p1.y });
      // set via inline style, not setAttribute: the .pinid CSS class's own text-anchor:middle rule beats a
      // same-property presentation attribute in the cascade, so setAttribute here would be silently ignored.
      if (orientation === 'horizontal') { idLabel.style.textAnchor = 'end'; idLabel.style.dominantBaseline = 'central'; }
      idLabel.textContent = cfg.id;
      tracksG.appendChild(idLabel);

      const pin = mk('g', { class: 'pin' });
      const body = mk('circle', { class: 'pinbody', r: 13, fill: color });
      const label = mk('text', { class: 'pinlabel' }); label.textContent = labelFor(cfg, 0);
      const hit = mk('circle', { class: 'pinhit', r: 20, fill: 'transparent' });
      pin.append(body, label, hit);
      pinsG.appendChild(pin);
      pinEls.push({ pin, body, label, hit, cfg });
      placePin(i, 0, false);

      bindTrackTap(i, trackHit);
      bindPinDrag(i, hit);
    });

    function labelFor(cfg, idx) {
      if (Array.isArray(cfg.labels) && cfg.labels[idx] != null) return String(cfg.labels[idx]);
      return String(idx);
    }
    function placePin(i, notchIdx, animate) {
      state[i] = notchIdx;
      const p = notchPos(i, notchIdx);
      const el = pinEls[i];
      el.pin.style.transition = animate ? 'transform .12s ease' : 'none';
      el.pin.setAttribute('transform', `translate(${p.x},${p.y})`);
      el.label.textContent = labelFor(el.cfg, notchIdx);
    }
    function nearestNotch(i, along) {
      const cfg = pinsCfg[i];
      const t = (along - TRACK_START) / (TRACK_END - TRACK_START);
      return Math.max(0, Math.min(cfg.positions - 1, Math.round(t * (cfg.positions - 1))));
    }

    function svgPoint(e) {
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    function bindTrackTap(i, trackHit) {
      trackHit.addEventListener('pointerdown', (e) => {
        if (solved) return;
        const p = svgPoint(e);
        const along = orientation === 'vertical' ? p.y : p.x;
        placePin(i, nearestNotch(i, along), true);
        haptic('tick');
      });
    }
    function bindPinDrag(i, hitEl) {
      let dragging = false;
      hitEl.addEventListener('pointerdown', (e) => {
        if (solved) return;
        dragging = true; hitEl.setPointerCapture(e.pointerId);
      });
      hitEl.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const p = svgPoint(e);
        const along = orientation === 'vertical' ? p.y : p.x;
        const clamped = Math.max(TRACK_START, Math.min(TRACK_END, along));
        const target = orientation === 'vertical' ? { x: crossPos[i], y: clamped } : { x: clamped, y: crossPos[i] };
        pinEls[i].pin.style.transition = 'none';
        pinEls[i].pin.setAttribute('transform', `translate(${target.x},${target.y})`);
      });
      hitEl.addEventListener('pointerup', (e) => {
        if (!dragging) return;
        dragging = false;
        const p = svgPoint(e);
        const along = orientation === 'vertical' ? p.y : p.x;
        placePin(i, nearestNotch(i, along), true);
        haptic('tick');
      });
      hitEl.addEventListener('pointercancel', () => {
        if (!dragging) return;
        dragging = false;
        placePin(i, state[i], true); // snap back to its last committed notch
      });
    }

    document.getElementById('unlock').addEventListener('click', () => {
      if (solved) return;
      solved = true; haptic('ok');
      const submission = pinsCfg.map((cfg, i) => `${cfg.id}:${labelFor(cfg, state[i])}`).join(',');
      send({ submission });
      setTimeout(() => showOverlay(false), 400);
    });

    // test hook (mirrors the rest of the family) — set every pin to a given notch index array
    window.__slidingLock = {
      state, pinsCfg,
      setAll: (indices) => { indices.forEach((idx, i) => { if (pinEls[i]) placePin(i, Math.max(0, Math.min(pinsCfg[i].positions - 1, idx)), true); }); },
    };
  </script>
</body>
</html>
